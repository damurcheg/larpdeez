.b-name{font-family:var(--font-display);font-weight:700;font-size:22px;letter-spacing:-.02em;line-height:1.2;overflow-wrap:anywhere}
.b-bio{font-size:13px;color:var(--ink2);line-height:1.5}
.b-gpa{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.b-gpa .gpa-big{font-family:var(--font-display);font-weight:700;font-size:clamp(40px,6vw,56px);letter-spacing:-.02em;line-height:1}
.b-gpa .letter{height:34px;min-width:34px;font-size:18px;border-radius:10px}
.b-actions{display:flex;gap:9px;flex-wrap:wrap;margin-top:auto}
.b-actions .btn{height:42px;border-radius:13px;font-size:13.5px}
.b-btn-journal{box-shadow:0 8px 20px -10px color-mix(in srgb,var(--primary-bg) 65%,transparent)}
.b-level{grid-column:span 4}
.b-tiles{grid-column:span 12;display:grid;grid-template-columns:repeat(auto-fill,minmax(min(160px,100%),1fr));gap:12px}
.b-comp,.b-heat,.b-mods,.b-dist,.b-ach{grid-column:span 12}
.b-duo{grid-column:span 12;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:stretch}
.b-duo .b-chart,.b-duo .b-mods{grid-column:auto;min-width:0}
.level-card{--ic:17px;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;text-align:center;border-radius:var(--r-lg);padding:24px;background:linear-gradient(150deg,var(--primary-bg),color-mix(in srgb,var(--primary-bg) 55%,var(--acid)));color:var(--primary-fg);position:relative;overflow:hidden}
.level-card::after{content:'';position:absolute;right:-50px;top:-60px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,color-mix(in srgb,var(--acid) 35%,transparent),transparent 70%)}
.level-empty{background:var(--surface);color:var(--muted);border:1.5px dashed var(--border2)}
.level-empty>svg,.level-empty>.sys-ic{--ic:28px;width:28px;height:28px;font-size:28px;opacity:.6}
.level-ring{width:110px;height:110px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:conic-gradient(var(--acid) calc(var(--p)*1%),color-mix(in srgb,var(--primary-fg) 18%,transparent) 0);position:relative}
.level-ring::before{content:'';position:absolute;inset:8px;border-radius:50%;background:color-mix(in srgb,var(--primary-bg) 82%,#000)}
.level-ring span{position:relative;font-family:var(--font-display);font-weight:700;font-size:26px}
.level-ring em{font-style:normal;font-size:13px;opacity:.7}
.level-name{display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:16px;position:relative}
.level-card .hint{color:color-mix(in srgb,var(--primary-fg) 75%,transparent);position:relative}
/* Компетенции */
.comp-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(230px,100%),1fr));gap:12px}
.comp-card{border:1px solid var(--pc-border);background:var(--pc-bg);border-radius:var(--r-md);padding:14px}
.comp-head{display:flex;align-items:center;gap:9px;margin-bottom:10px}
.comp-head b{flex:1;min-width:0;font-size:13.5px;color:var(--pc-text);line-height:1.3}
.comp-head .row-ic{width:30px;height:30px;--ic:14px;background:var(--surface)}
.comp-lv{background:var(--surface);border-color:var(--pc-border);color:var(--pc-text);font-size:10.5px;height:21px}
.comp-pct{font-family:var(--font-display);font-weight:700;font-size:25px;color:var(--pc-text);line-height:1;margin-bottom:8px}
.comp-pct em{font-style:normal;font-size:14px;opacity:.6}
.comp-card .bar{background:color-mix(in srgb,var(--pc-accent) 14%,var(--surface))}
.comp-card .bar i{background:var(--pc-accent)}
.comp-meta{display:flex;justify-content:space-between;gap:8px;font-family:var(--font-mono);font-size:10px;color:var(--pc-text);opacity:.85;margin-top:7px;flex-wrap:wrap}
.comp-cut{display:none}
.comp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.comp-foot[hidden]{display:none}
/* #endregion */

/* #region Журнал оценок */
.jr-wrap{padding:0;overflow:hidden}
.jr-scroll{overflow:auto;max-height:calc(100vh - var(--header-total-h) - 180px);-webkit-overflow-scrolling:touch}
.jr{border-collapse:separate;border-spacing:0;width:100%;min-width:520px}
.jr th{position:sticky;top:0;z-index:3;background:var(--surface2);font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.1em;color:var(--muted);padding:11px 6px;border-bottom:1px solid var(--border);text-align:center;white-space:nowrap}
.jr th.jr-name{text-align:left;padding-left:16px}
.jr td{padding:6px;border-bottom:1px solid var(--border);text-align:center}
.jr tbody tr:last-child td{border-bottom:none}
.jr-name{position:sticky;left:0;z-index:2;background:var(--surface);text-align:left!important;min-width:180px;max-width:250px;border-right:1px solid var(--border);padding-left:16px!important}
thead .jr-name{z-index:4;background:var(--surface2)}
.jr-disc{--ic:15px;display:flex;align-items:center;gap:9px;min-width:0}
.jr-disc>svg,.jr-disc>.sys-ic{color:var(--pc-accent);flex:none}
.jr-disc b{flex:1;min-width:0;font-size:13px;font-weight:600;color:var(--ink);overflow-wrap:anywhere}
.jr-mod td{background:linear-gradient(90deg,var(--pc-bg),color-mix(in srgb,var(--pc-bg) 30%,var(--surface)));border-bottom:1px solid var(--pc-border);border-top:1px solid var(--pc-border);padding:0;text-align:left;box-shadow:inset 3px 0 0 var(--pc-accent)}
.jr-mod-in{--ic:15px;display:flex;align-items:center;gap:9px;padding:9px 14px;font-family:var(--font-display);font-weight:700;font-size:12.5px;color:var(--pc-text)}
.jr-mod-in>svg,.jr-mod-in>.sys-ic{color:var(--pc-accent);flex:none}
.jr-mod-in b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.jr-mod-grade{display:inline-flex;align-items:center;gap:6px;font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--pc-text)}
/* Кликабельные названия модуля и дисциплины */
a.jr-mod-link{display:flex;align-items:center;gap:9px;flex:1;min-width:0;color:inherit;border-radius:8px;transition:.14s}
a.jr-mod-link:hover b{text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--pc-accent) 60%,transparent);text-underline-offset:3px}
a.jr-mod-link:focus-visible{outline:2px solid var(--pc-accent);outline-offset:2px}
a.jr-disc-link{display:flex;align-items:center;gap:9px;flex:1;min-width:0;color:inherit;border-radius:8px;transition:.14s}
a.jr-disc-link:hover b{color:var(--pc-accent);text-decoration:underline;text-decoration-color:color-mix(in srgb,var(--pc-accent) 50%,transparent);text-underline-offset:3px}
a.jr-disc-link:focus-visible{outline:2px solid var(--pc-accent);outline-offset:2px}
.jr-cell{display:inline-flex;align-items:center;justify-content:center;width:36px;height:30px;border-radius:9px;font-family:var(--font-mono);font-weight:700;font-size:13px;transition:transform .14s,box-shadow .14s,border-color .14s,color .14s;border:1px solid transparent}
button.jr-cell:hover{transform:translateY(-1px) scale(1.08);box-shadow:var(--shadow)}
button.jr-cell:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.jr-cell.empty{background:transparent;border:none}
.jr-cell.empty::after{content:'';width:4px;height:4px;border-radius:50%;background:var(--border2)}
.jr-cell.none{color:var(--muted);background:var(--surface2);border:1px dashed var(--border2)}
.jr-cell.none:hover{border-color:var(--accent);color:var(--accent)}
/* #endregion */

/* #region График динамики оценок */
.chart-filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
.chart-filters .ldz-select{flex:1;min-width:140px;height:36px;font-size:13px}
.chart-meta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-bottom:10px}
.chart-frame{border:1px solid var(--border);border-radius:14px;background:linear-gradient(180deg,var(--surface2),var(--surface));padding:10px 6px 2px}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.cg-grid line{stroke:var(--border);stroke-dasharray:2 5;opacity:.8}
.cg-grid line.cg-base{stroke:var(--border2);stroke-dasharray:none;opacity:1}
.cg-num{font-family:var(--font-mono);font-size:10px;fill:var(--muted)}
.cg-letter{font-family:var(--font-mono);font-size:9px;font-weight:700;fill:var(--muted);opacity:.7}
.cg-avg{stroke:color-mix(in srgb,var(--accent) 45%,transparent);stroke-width:1.2;stroke-dasharray:5 6}
.cg-avg-lbl{font-family:var(--font-mono);font-size:9.5px;font-weight:700;fill:var(--accent);opacity:.85}
.cg-line{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cg-date{font-family:var(--font-mono);font-size:9.5px;fill:var(--muted)}
.chart-pt{cursor:pointer}
.cd-hit{fill:transparent}
.cd-guide{stroke:var(--accent);stroke-dasharray:3 4;opacity:0;transition:opacity .15s}
.cd-halo{fill:color-mix(in srgb,var(--accent) 16%,transparent);opacity:0;transition:.15s;transform-box:fill-box;transform-origin:center}
.cd-core{fill:var(--surface);stroke:var(--accent);stroke-width:2;transition:transform .15s;transform-box:fill-box;transform-origin:center}
.chart-pt:hover .cd-guide{opacity:.5}
.chart-pt:hover .cd-halo{opacity:1}
.chart-pt:hover .cd-core{transform:scale(1.3)}
.chart-pt.last .cd-core{fill:var(--accent)}
.chart-pt.last .cd-halo{opacity:.6;animation:cdPulse 2.6s ease-in-out infinite}
@keyframes cdPulse{50%{transform:scale(1.5);opacity:.25}}
.chart-empty{--ic:26px;border:1.5px dashed var(--border2);border-radius:14px;padding:26px 18px;text-align:center;color:var(--muted)}
.chart-empty>svg,.chart-empty>.sys-ic{width:26px;height:26px;font-size:26px;margin-bottom:8px;opacity:.6}
.chart-empty p{font-size:13.5px;font-weight:600;color:var(--ink2)}
.chart-empty span{font-size:12px}
/* #endregion */

/* #region Тепловая карта активности */
.hy{display:grid;grid-template-rows:16px repeat(7,14px);gap:3px;width:max-content}
.hy .hm{font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--muted);line-height:1;white-space:nowrap;overflow:visible}
.hy .hd{display:flex;align-items:center;justify-content:flex-end;padding-right:3px;font-family:var(--font-mono);font-size:9px;font-weight:700;color:var(--muted);position:sticky;left:0;background:var(--surface);z-index:1}
.hy .hc{position:sticky;left:0;background:var(--surface);z-index:1}
.hy-cell{width:14px;height:14px;border-radius:4px;background:var(--bg2);border:1px solid var(--border);padding:0}
button.hy-cell:hover{outline:2px solid var(--accent);outline-offset:1px}
.hy-cell.lv1{background:color-mix(in srgb,var(--accent) 22%,var(--surface));border-color:color-mix(in srgb,var(--accent) 30%,var(--border))}
.hy-cell.lv2{background:color-mix(in srgb,var(--accent) 45%,var(--surface));border-color:color-mix(in srgb,var(--accent) 55%,var(--border))}
.hy-cell.lv3{background:color-mix(in srgb,var(--accent) 70%,var(--surface));border-color:var(--accent)}
.hy-cell.lv4{background:var(--accent);border-color:var(--accent)}
.hy-cell.future{opacity:.25}
.hy-legend{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.hy-scale{display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--muted)}
/* #endregion */

/* #region Достижения: медали, формы, палитра, лента */
.ach{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;min-width:0}
.ach b{font-size:11px;font-weight:700;line-height:1.25;max-height:28px;overflow:hidden;overflow-wrap:anywhere}
.ach-date{font-family:var(--font-mono);font-size:9px;color:var(--muted)}
.ach-medal{position:relative;width:62px;height:62px;flex:none;display:flex;align-items:center;justify-content:center;color:#fff;--shape:circle(50% at 50% 50%);filter:drop-shadow(0 5px 12px rgba(21,25,34,.28));transition:transform .18s cubic-bezier(.2,.9,.3,1.3)}
.ach:hover .ach-medal{transform:translateY(-3px) scale(1.04)}
.ach-medal .am-rim,.ach-medal .am-face,.ach-medal .am-gloss{position:absolute;clip-path:var(--shape);pointer-events:none}
.am-rim{inset:0;background:linear-gradient(155deg,color-mix(in srgb,var(--m1,#ccc) 45%,#fff),color-mix(in srgb,var(--m2,#888) 70%,#fff) 45%,var(--m2,#888))}
.am-face{inset:4px;background:linear-gradient(160deg,var(--m1,#ccc),var(--m2,#888) 82%)}
.am-gloss{inset:4px;background:radial-gradient(95% 62% at 30% 10%,rgba(255,255,255,.55),rgba(255,255,255,.10) 46%,transparent 62%),linear-gradient(180deg,transparent 58%,rgba(0,0,0,.22))}
.am-ic{position:relative;width:23px;height:23px;stroke-width:2.2;filter:drop-shadow(0 1px 2px rgba(0,0,0,.35))}
.shape-circle{--shape:circle(50% at 50% 50%)}
.shape-squircle{--shape:inset(0 round 27%)}
.shape-hex{--shape:polygon(50% 0,93% 25%,93% 75%,50% 100%,7% 75%,7% 25%)}
.shape-diamond{--shape:polygon(50% 0,100% 50%,50% 100%,0 50%)}
.shape-shield{--shape:polygon(50% 0,100% 10%,100% 64%,50% 100%,0 64%,0 10%)}
.shape-pentagon{--shape:polygon(50% 0,100% 38%,81% 100%,19% 100%,0 38%)}
.shape-octagon{--shape:polygon(30% 0,70% 0,100% 30%,100% 70%,70% 100%,30% 100%,0 70%,0 30%)}
.shape-banner{--shape:polygon(0 0,100% 0,100% 100%,50% 80%,0 100%)}
.shape-star{--shape:polygon(50% 0,64.7% 29.8%,97.6% 34.5%,73.8% 57.7%,79.4% 90.5%,50% 75%,20.6% 90.5%,26.2% 57.7%,2.4% 34.5%,35.3% 29.8%)}
.shape-burst{--shape:polygon(50% 0,59.8% 13.3%,75% 6.7%,76.9% 23.1%,93.3% 25%,86.7% 40.2%,100% 50%,86.7% 59.8%,93.3% 75%,76.9% 76.9%,75% 93.3%,59.8% 86.7%,50% 100%,40.2% 86.7%,25% 93.3%,23.1% 76.9%,6.7% 75%,13.3% 59.8%,0 50%,13.3% 40.2%,6.7% 25%,23.1% 23.1%,25% 6.7%,40.2% 13.3%)}
.shape-star .am-ic,.shape-burst .am-ic{width:19px;height:19px}
.shape-diamond .am-ic,.shape-banner .am-ic{width:21px;height:21px}
.tier-bronze{--m1:#E8A05C;--m2:#9C5A22}
.tier-silver{--m1:#E9EEF6;--m2:#8C99AD}
.tier-gold{--m1:#FFD86B;--m2:#C8860F}
.tier-emerald{--m1:#6FE0A8;--m2:#157A4C}
.tier-azure{--m1:#6FD0EA;--m2:#135F80}
.tier-indigo{--m1:#93A7F5;--m2:#2C43B0}
.tier-violet{--m1:#C09BF2;--m2:#5B34A6}
.tier-coral{--m1:#FFA06B;--m2:#B23F16}
.tier-rose{--m1:#F595C3;--m2:#A02462}
.tier-teal{--m1:#6BD8CB;--m2:#0E6157}
.tier-amber{--m1:#FFC978;--m2:#8F540A}
.tier-rare{--m1:var(--acid);--m2:#8B63C9}
.tier-rare .am-face{background:linear-gradient(120deg,var(--acid),#8B63C9 30%,#56AAC5 55%,#DF77AC 80%,var(--acid));background-size:300% 300%;animation:achFlow 7s ease-in-out infinite}
.tier-rare.unlocked .ach-medal{filter:drop-shadow(0 4px 14px color-mix(in srgb,var(--acid) 50%,transparent))}
@keyframes achFlow{0%,100%{background-position:0% 30%}50%{background-position:100% 70%}}
.ach-medal .ach-spark{position:absolute;top:-5px;right:-3px;width:15px;height:15px;color:var(--acid);filter:drop-shadow(0 0 5px var(--acid));animation:sparkTw 2.4s ease-in-out infinite}
@keyframes sparkTw{50%{transform:scale(1.25) rotate(12deg);opacity:.75}}
.ach.locked{opacity:.6}
.ach.locked .ach-medal{--m1:var(--border2);--m2:var(--border);filter:drop-shadow(0 3px 7px rgba(21,25,34,.14))}
.ach.locked .am-gloss{opacity:.45}
.ach.locked .am-ic{color:var(--muted);filter:none}
.ach.locked b,.ach.locked .ach-date{color:var(--muted)}
.ach.unlocked .ach-medal{animation:achPop .5s cubic-bezier(.2,1.4,.4,1) both}
@keyframes achPop{from{transform:scale(.55)}}
.ach-prog{flex:1;max-width:190px;margin-left:auto;display:flex;align-items:center}
.ach-prog .bar{flex:1;height:5px}
.ach-clip{position:relative}
.ach-clip:not(.open) .ach-grid{display:flex;gap:12px;overflow-x:auto;padding:8px 2px 12px;scroll-snap-type:x proximity;scrollbar-width:thin;scrollbar-color:var(--border2) transparent}
.ach-clip:not(.open) .ach{flex:0 0 96px;scroll-snap-align:start}
.ach-clip:not(.open) .ach-grid::-webkit-scrollbar{height:8px}
.ach-clip:not(.open) .ach-grid::-webkit-scrollbar-track{background:transparent}
.ach-clip:not(.open) .ach-grid::-webkit-scrollbar-thumb{background:var(--border2);border-radius:6px;border:2px solid var(--surface)}
.ach-clip:not(.open) .ach-grid::-webkit-scrollbar-thumb:hover{background:var(--accent)}
.ach-clip:not(.open)::after{content:'';position:absolute;top:0;right:0;bottom:16px;width:42px;background:linear-gradient(90deg,transparent,var(--surface));pointer-events:none}
.ach-clip.open .ach-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(100px,1fr));gap:18px 10px;padding:6px 2px 2px}
.ach-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}
/* #endregion */
/* #region Входящие: материалы и разделы */
.inbox-list{display:flex;flex-direction:column;gap:12px}
.inbox-card{display:flex;align-items:center;gap:13px;padding:15px 17px;flex-wrap:wrap}
.inbox-card .it-ic{--ic:19px;display:flex}
.inbox-name{display:block;font-size:14px;font-weight:700}
.inbox-acts{display:flex;gap:7px;align-items:center}
/* Раздел входящих: контейнер с шапкой и раскрываемым телом */
.inb-sec{border:1px solid var(--border);border-radius:var(--r-lg);background:var(--surface2);box-shadow:var(--shadow);overflow:hidden;transition:border-color .15s}

.inb-sec-head{display:flex;align-items:center;gap:10px;padding:12px 15px;flex-wrap:wrap}
.inb-sec-head .sec-ic{background:var(--surface);border-color:var(--border);color:var(--accent)}
.inb-sec-head b{font-size:14px;font-weight:700}
.inb-sec-name{flex:1;min-width:130px;display:flex;align-items:center;gap:9px}
.inb-sec-count{font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:var(--muted)}
.inb-sec-acts{display:flex;gap:5px;align-items:center;flex:none}
.inb-sec-body{border-top:1px dashed var(--border);padding:10px 12px 12px;display:flex;flex-direction:column;gap:10px}

.inb-sec-add{display:flex;gap:8px;flex-wrap:wrap;padding-top:2px}

.inbox-drag-card>svg,.inbox-drag-card>.sys-ic{--ic:20px;color:var(--accent)}
.inbox-tree{max-height:46vh;overflow-y:auto;border:1px solid var(--border);border-radius:14px;padding:10px;background:var(--surface2)}
.it-course{--ic:16px;display:flex;align-items:center;gap:8px;font-family:var(--font-display);font-weight:700;font-size:13px;padding:4px 6px 10px}
.it-course svg,.it-course .sys-ic{color:var(--accent)}
.it-row{--ic:14px;display:flex;align-items:center;gap:8px;width:100%;padding:7px 8px;border-radius:10px;text-align:left;font-size:13px}
.it-row:hover{background:var(--surface)}
.it-row>svg,.it-row>.sys-ic{color:var(--muted);flex:none}
.it-row b{flex:1;min-width:0;color:var(--pc-text,var(--ink))}
.it-row .row-ic{width:26px;height:26px;--ic:13px}
.it-children{padding-left:18px;border-left:1px dashed var(--border2);margin-left:12px}
.it-leaf{--ic:13px;display:flex;align-items:center;gap:8px;padding:5px 8px;font-size:12.5px;color:var(--muted)}
.it-leaf svg,.it-leaf .sys-ic{flex:none}
.inbox-slot{display:flex;align-items:center;gap:6px;width:100%;height:14px;padding:0 6px;border-radius:6px;transition:.12s}
.inbox-slot span{flex:1;height:2px;border-radius:2px;background:var(--border2);opacity:.5;transition:.12s}
.inbox-slot:hover span,.inbox-slot.hover span,.inbox-slot.sel span{height:4px;background:var(--accent);opacity:1}
.inbox-slot.sel{height:22px}
.inbox-slot em{font-style:normal;font-family:var(--font-mono);font-size:9.5px;font-weight:700;color:var(--accent)}
body.inbox-dragging .inbox-slot{height:20px}
body.inbox-dragging .inbox-slot span{opacity:.9}
/* #endregion */

/* #region Избранное */
.fav-btn.fav-on{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent);background:var(--warn-bg)}
.fav-btn.fav-on svg{fill:currentColor}
.it-col .fav-btn{border-color:transparent;background:transparent;color:var(--muted);opacity:.55;width:24px;height:24px}
.it-col .fav-btn:hover{opacity:1;color:var(--warn);background:var(--warn-bg)}
.it-col .fav-btn.fav-on{opacity:1;color:var(--warn);background:transparent;border-color:transparent}
.fav-btn.fav-mini{width:20px;height:20px;border-radius:6px}
.fav-btn.fav-mini svg,.fav-btn.fav-mini .sys-ic{--ic:12px}
.icon-btn.fav-28{width:28px;height:28px;border-radius:8px;--ic:14px}

.fav-hint{--ic:13px;display:flex;align-items:center;gap:6px;margin-bottom:12px}
.fav-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(260px,100%),1fr));gap:14px;align-items:start}
.fav-card{position:relative;display:flex;flex-direction:column;gap:10px;background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow);transition:box-shadow .2s,border-color .2s,opacity .2s}
.fav-card:hover{border-color:var(--border2);box-shadow:var(--shadow-lg)}
.fav-card.fav-src{opacity:.35}
.fav-card.fav-drop-before{box-shadow:-5px 0 0 0 var(--accent),var(--shadow)}
.fav-card.fav-drop-after{box-shadow:5px 0 0 0 var(--accent),var(--shadow)}
.fav-grip{--ic:14px;display:flex;align-items:center;justify-content:center;width:22px;height:26px;margin:-2px 0 0 -6px;border-radius:7px;color:var(--muted);opacity:.55;cursor:grab;touch-action:none;flex:none;transition:.15s}
.fav-grip:hover{opacity:1;color:var(--accent);background:var(--bg2)}

.fav-head{display:flex;gap:10px;align-items:flex-start}
.fav-ic{--ic:17px;width:36px;height:36px;border-radius:11px;background:var(--pc-bg);border:1px solid var(--pc-border);color:var(--pc-accent);display:flex;align-items:center;justify-content:center;flex:none}
.fav-head b{font-size:14px;line-height:1.3;display:block;overflow-wrap:anywhere}
.fav-sub{font-size:11.5px;color:var(--muted);display:block;margin-top:3px}
.fav-when{--ic:13px;display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11.5px;font-weight:700;color:var(--pc-text)}
.fav-body{border-top:1px dashed var(--border);padding-top:10px;font-size:13px;color:var(--ink2);display:flex;flex-direction:column;gap:10px}

.fav-foot{margin-top:auto}
.fav-card.fav-big{padding:0;overflow:hidden;border-color:var(--pc-border)}
.fav-band{display:flex;gap:10px;align-items:flex-start;padding:13px 14px;background:linear-gradient(135deg,var(--pc-bg),color-mix(in srgb,var(--pc-bg) 55%,var(--surface)));border-bottom:1px solid var(--pc-border)}
.fav-band .fav-ic{background:var(--surface)}
.fav-band b{font-family:var(--font-display);font-size:14px;color:var(--pc-text);letter-spacing:-.01em;line-height:1.3;display:block;overflow-wrap:anywhere}
.fav-band .fav-sub{color:color-mix(in srgb,var(--pc-text) 70%,var(--muted))}
.fav-inner{display:flex;flex-direction:column;gap:10px;padding:12px 14px 14px;flex:1}
.fav-proj{border-color:color-mix(in srgb,var(--pc-accent) 40%,var(--border));box-shadow:0 8px 24px -12px color-mix(in srgb,var(--pc-accent) 45%,transparent)}
.fav-proj .fav-band{background:linear-gradient(135deg,color-mix(in srgb,var(--pc-accent) 22%,var(--pc-bg)),var(--pc-bg) 70%)}
.fav-proj-flag{--ic:11px;display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px 0 6px;border-radius:6px;background:var(--pc-accent);color:var(--surface);font-family:var(--font-mono);font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;align-self:flex-start;line-height:1}
.fav-ghost{position:fixed;z-index:400;pointer-events:none;opacity:.96;transform:rotate(1.2deg);box-shadow:var(--shadow-lg);margin:0}
body.fav-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.fav-dragging .fav-card{transition:none}
/* #endregion */

/* #region Учебный план */
.plan-timeline{padding:10px 0}
.plan-week{display:flex;gap:14px;padding:10px 18px;border-bottom:1px dashed var(--border);align-items:flex-start}
.plan-week:last-child{border-bottom:none}
.plan-week.now{background:color-mix(in srgb,var(--acid) 8%,transparent)}
.pw-num{min-width:120px;flex:none}

.pw-num span{font-size:10.5px;color:var(--muted)}
.pw-bars{flex:1;display:flex;flex-direction:column;gap:5px;min-width:0}
.pw-bar{--ic:15px;display:flex;align-items:center;gap:9px;padding:8px 10px 8px 11px;border-radius:12px;background:var(--pc-bg);border:1px solid var(--pc-border);border-left:3px solid var(--pc-accent);font-size:12.5px;transition:.14s}
.pw-bar:hover{border-color:var(--pc-accent)}
.pw-bar>svg,.pw-bar>.sys-ic{color:var(--pc-accent);flex:none}
.pw-main{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
.pw-link{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--pc-text);font-weight:600}

.pw-type{font-size:10px;color:var(--pc-text);opacity:.7;white-space:nowrap;flex:none}
.pw-acts{display:flex;gap:4px;flex:none;margin-left:auto}
.pw-act{--ic:13px;width:27px;height:27px;border-radius:8px;border:1px solid var(--pc-border);background:var(--surface);color:var(--pc-text);display:flex;align-items:center;justify-content:center;transition:.15s}

.pw-act:active{transform:scale(.94)}
.pw-act.danger:hover{border-color:color-mix(in srgb,var(--danger) 45%,transparent);color:var(--danger);background:var(--danger-bg)}
.pw-free{font-size:11.5px;color:var(--muted);padding:6px 2px}
/* #endregion */

/* #region Поиск и меню */
.m-only{display:none}
.hide-s{}
.hsearch{position:relative;display:flex;align-items:center;gap:9px;flex:1 1 auto;min-width:0;max-width:640px;margin:0 auto;height:38px;padding:0 12px;border:1px solid var(--border);border-radius:12px;background:var(--surface2);transition:border-color .15s,box-shadow .15s,background .15s}
.hsearch:focus-within{border-color:var(--accent);background:var(--surface);box-shadow:var(--ring)}
.hs-ic{--ic:16px;display:flex;color:var(--muted);flex:none}
.hs-input{flex:1;min-width:0;height:100%;border:none;background:transparent;outline:none;font-size:14px;font-weight:500;color:var(--ink)}

.hs-input::-webkit-search-cancel-button{-webkit-appearance:none;appearance:none}
.hs-clear{--ic:14px;display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:7px;color:var(--muted);flex:none}

.hs-clear:hover{background:var(--bg2);color:var(--ink)}
.hs-drop{position:fixed;z-index:150;display:none;padding:8px;background:var(--surface);border:1px solid var(--border2);border-radius:18px;box-shadow:var(--shadow-lg);max-height:min(70vh,540px);overflow-y:auto;overscroll-behavior:contain}
.hs-drop.on{display:block}
#menu-scrim{position:fixed;inset:0;z-index:290;background:rgba(10,12,18,.32);backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px);opacity:0;transition:opacity .18s}
#menu-scrim.on{opacity:1}
.menu-pop{width:238px;padding:6px;border-radius:20px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6);border-color:color-mix(in srgb,var(--border2) 65%,transparent)}
.menu-list{display:flex;flex-direction:column}
.menu-item{--ic:18px;display:flex;align-items:center;gap:11px;height:44px;padding:0 12px;border-radius:14px;font-size:14.5px;font-weight:600;color:var(--ink);text-align:left;transition:.14s}
.menu-item svg,.menu-item .sys-ic{color:var(--muted)}
.menu-item:hover,.menu-item:active{background:var(--accent-soft);color:var(--accent)}
.menu-item:hover svg,.menu-item:hover .sys-ic,.menu-item:active svg,.menu-item:active .sys-ic{color:var(--accent)}
.menu-sep{height:1px;background:var(--border);margin:5px 8px}
button.menu-profile{width:100%;text-align:left;border-radius:14px;padding:10px 12px;transition:.14s;display:flex;align-items:center;gap:10px}
button.menu-profile:hover{background:var(--accent-soft)}
button.menu-profile:hover b{color:var(--accent)}
.menu-profile .mp-main{flex:1;min-width:0}
.menu-profile .mp-main b{display:block;font-size:13.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-profile .mp-main span{display:block;font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-profile .mp-chev{--ic:15px;margin-left:auto;display:flex;color:var(--muted)}
.s-count{font-family:var(--font-mono);font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);padding:6px 8px 8px}
.s-empty{padding:20px 14px;text-align:center;font-size:13px;color:var(--muted)}
.s-item{background:var(--pc-bg,var(--surface2));border:1px solid var(--pc-border,var(--border));border-radius:14px;padding:11px 12px;margin-bottom:8px}
.s-item.active{border-color:var(--pc-accent,var(--accent));box-shadow:0 0 0 3px color-mix(in srgb,var(--pc-accent,var(--accent)) 16%,transparent)}
.s-head{display:flex;align-items:flex-start;gap:10px}
.s-ic{--ic:16px;width:32px;height:32px;border-radius:10px;background:var(--surface);border:1px solid var(--pc-border,var(--border));color:var(--pc-accent,var(--accent));display:flex;align-items:center;justify-content:center;flex:none}
.s-main{flex:1;min-width:0}
.s-title{display:block;font-size:13.5px;font-weight:600;line-height:1.35;color:var(--ink)}
.s-sub{display:block;font-size:11.5px;color:var(--pc-text,var(--muted));margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.s-hl{background:color-mix(in srgb,var(--pc-accent,var(--accent)) 22%,transparent);color:inherit;border-radius:4px;padding:0 2px}
.s-actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}
.s-actions .btn{height:30px;font-size:12.5px;padding:0 11px}
.s-item .btn-soft:hover{border-color:var(--pc-accent,var(--accent));color:var(--pc-accent,var(--accent))}
.s-body{margin-top:10px;padding-top:10px;border-top:1px dashed var(--pc-border,var(--border))}
.s-desc{font-size:13px;color:var(--ink2);white-space:pre-line}
.s-body .links-row{margin-top:10px}
.s-meta{--ic:13px;display:flex;align-items:center;gap:7px;font-family:var(--font-mono);font-size:11.5px;color:var(--pc-text,var(--ink2));margin-top:8px;flex-wrap:wrap}
.search-page{padding-bottom:24px}
.sp-bar{position:sticky;top:calc(var(--header-total-h) + 6px);z-index:20;display:flex;align-items:center;gap:10px;padding:8px 0;background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}

.sp-bar .icon-btn{flex:none}

/* #region GitHub-экраны */

.gh-card{width:430px;max-width:100%;max-height:calc(100dvh - var(--safe-top) - var(--safe-bottom) - 40px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:24px;padding:28px;box-shadow:var(--shadow-lg)}

.gh-sub{color:var(--muted);font-size:13px;margin-bottom:20px}
.gh-card .field{margin-bottom:12px}
.gh-main{width:100%;margin-top:6px}
.gh-err{display:none;background:var(--danger-bg);color:var(--danger);border-radius:10px;padding:10px 12px;font-size:13px;font-weight:600;margin-bottom:14px}

/* #region Адаптивность */

}

  .btn-continue .bc-arrow{width:36px;height:36px;border-radius:12px}
  /* «Входящие»: компактная квадратная кнопка справа от «Продолжить» */
  .btn-inbox{width:52px;padding:0;border-radius:15px;justify-content:center}

  .sub-row{flex-wrap:wrap}
  .sub-row .sub-num{min-width:100%}

// Восстановление целостности входящих: каждый материал ровно в одном месте, порядок сохранён
function repairInbox(s){
  if(!Array.isArray(s.inbox))s.inbox=[];
  s.inboxSections=normInboxSections(s.inboxSections);
  s.inboxLayout=normInboxLayout(s.inboxLayout);
  const ids=new Set(s.inbox.map(x=>x.id));
  const seenSec=new Set();
  s.inboxSections=s.inboxSections.filter(x=>!seenSec.has(x.id)&&seenSec.add(x.id));
  const inSec=new Set();
  s.inboxSections.forEach(sec=>{sec.items=sec.items.filter(id=>ids.has(id)&&!inSec.has(id)&&inSec.add(id))});
  const seenLay=new Set();
  s.inboxLayout=s.inboxLayout.filter(n=>{
    const ok=n.kind==='section'?s.inboxSections.some(x=>x.id===n.id):(ids.has(n.id)&&!inSec.has(n.id));
    const key=n.kind+':'+n.id;
    return ok&&!seenLay.has(key)&&seenLay.add(key);
  });
  s.inboxSections.forEach(sec=>{if(!s.inboxLayout.some(n=>n.kind==='section'&&n.id===sec.id))s.inboxLayout.push({kind:'section',id:sec.id})});
  s.inbox.forEach(x=>{if(!inSec.has(x.id)&&!s.inboxLayout.some(n=>n.kind==='item'&&n.id===x.id))s.inboxLayout.push({kind:'item',id:x.id})});
}

}
function normalize(r){

    inboxLayout:normInboxLayout(r.inboxLayout),
    favorites:(Array.isArray(r.favorites)?r.favorites:[]).map(f=>(f&&typeof f==='object'&&f.key)?{key:String(f.key),addedAt:+f.addedAt||Date.now()}:null).filter(Boolean),
    sessions:(Array.isArray(r.sessions)?r.sessions:[]).map(s=>(s&&typeof s==='object'&&+s.startedAt&&+s.endedAt>+s.startedAt)?{id:str(s.id,uid()),startedAt:+s.startedAt,endedAt:+s.endedAt,minutes:Math.max(0,Math.round((+s.endedAt-+s.startedAt)/60000))}:null).filter(Boolean),
    activeSession:(r.activeSession&&+r.activeSession.startedAt&&+r.activeSession.startedAt<=Date.now()+60000)?{startedAt:+r.activeSession.startedAt}:null,
    achievements:(r.achievements&&typeof r.achievements==='object'&&!Array.isArray(r.achievements))?Object.fromEntries(Object.entries(r.achievements).filter(([k,v])=>typeof v==='string')):{},
    plan:(Array.isArray(r.plan)?r.plan:[]).map(normPlan).filter(Boolean)
  };
  repairState(out);
  return out;

function repairState(s){
  const compIds=new Set(s.competencies.map(c=>c.id));
  s.modules.forEach(m=>{
    m.compTags=m.compTags.filter(id=>compIds.has(id));
    m.project.compIds=m.project.compIds.filter(id=>compIds.has(id));
    m.disciplines.forEach(d=>{
      const ids=new Set(d.items.map(i=>i.id));
      const seenSec=new Set();
      d.sections=d.sections.filter(x=>!seenSec.has(x.id)&&seenSec.add(x.id));
      const inSec=new Set();
      d.sections.forEach(sec=>{sec.items=sec.items.filter(id=>ids.has(id)&&!inSec.has(id)&&inSec.add(id))});
      const seenLay=new Set();
      d.layout=d.layout.filter(n=>{
        const ok=n.kind==='section'?d.sections.some(x=>x.id===n.id):(ids.has(n.id)&&!inSec.has(n.id));
        const key=n.kind+':'+n.id;
        return ok&&!seenLay.has(key)&&seenLay.add(key);
      });
      d.sections.forEach(sec=>{if(!d.layout.some(n=>n.kind==='section'&&n.id===sec.id))d.layout.push({kind:'section',id:sec.id})});
      d.items.forEach(i=>{if(!inSec.has(i.id)&&!d.layout.some(n=>n.kind==='item'&&n.id===i.id))d.layout.push({kind:'item',id:i.id})});
      const owner={};
      d.sections.forEach(sec=>sec.items.forEach(id=>owner[id]=sec.id));
      d.items.forEach(i=>{i.compIds=i.compIds.filter(id=>compIds.has(id));i.sectionId=owner[i.id]||null});
    });
  });
  repairInbox(s);
  s.favorites=s.favorites.filter(f=>favTarget(f.key,s));
  const evIds=new Set(s.events.map(e=>e.id));
  s.modules.forEach(m=>m.disciplines.forEach(d=>d.items.forEach(i=>{if(i.repeatEventId&&!evIds.has(i.repeatEventId))i.repeatEventId=null})));
}

// #region Оценивание
function letterOf(g){return g<2?'F':g<3?'D':g<4?'C':g<=4.5?'B':'A'}
function calcGrade(criteria,scores){
  if(!criteria||!criteria.length)return null;
  const sc=scores||{};
  if(!criteria.every(c=>+sc[c.id]>=1&&+sc[c.id]<=5))return null;
  const sum=criteria.reduce((a,c)=>a+ +sc[c.id],0);
  const pct=sum/(criteria.length*5)*100;
  const g=Math.round((1+pct/25)*10)/10;
  return{pct:Math.round(pct),g,letter:letterOf(g)};
}
function moduleInfo(m){
  const items=allItems(m);
  const topics=items.filter(x=>x.i.type==='topic'),tasks=items.filter(x=>x.i.type==='task');
  const tDone=topics.filter(x=>x.i.read).length;
  const grades=tasks.map(x=>calcGrade(x.i.criteria,x.i.scores)).filter(Boolean);
  const p=m.project,pg=p.enabled?calcGrade(p.criteria,p.scores):null;
  const done=p.enabled?!!pg:(tasks.length?grades.length===tasks.length:(topics.length?tDone===topics.length:false));
  const denom=topics.length||tasks.length;
  const progress=denom?(topics.length?tDone:grades.length)/denom:(p.enabled&&pg?1:0);
  let mg=null;
  if(done){const arr=[...grades.map(g=>g.g),...(pg?[pg.g]:[])];if(arr.length)mg=Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*10)/10}
  return{topics,tasks,tDone,grades,pg,done,progress,mg,letter:mg?letterOf(mg):null};
}
function collectGrades(){
  const out=[];
  state.modules.forEach(m=>{
    m.disciplines.forEach(d=>d.items.forEach(i=>{
      if(i.type!=='task')return;
      const g=calcGrade(i.criteria,i.scores);
      if(g)out.push(g);
    }));
    if(m.project.enabled){
      const pg=calcGrade(m.project.criteria,m.project.scores);
      if(pg)out.push(pg);
    }
  });
  return out;
}
function gpa(){
  const gs=collectGrades();
  if(!gs.length)return null;
  const tenths=gs.reduce((a,x)=>a+Math.round(x.g*10),0);
  return Math.round(tenths/gs.length)/10;
}
function itemDone(i){return i.type==='topic'?i.read:!!calcGrade(i.criteria,i.scores)}

function lucideHas(name){try{return !!(window.lucide&&window.lucide.icons&&window.lucide.icons[pascal(name)])}catch{return false}}
// data-cicon — иконки предметного содержимого (всегда Lucide)
// data-lucide — системные действия: подменяются на Phosphor, иначе остаются в Lucide
function icons(){
  try{
    document.querySelectorAll('i[data-cicon]').forEach(el=>{
      el.setAttribute('data-lucide',el.getAttribute('data-cicon'));
      el.removeAttribute('data-cicon');
    });
    document.querySelectorAll('i[data-lucide]').forEach(el=>{
      const n=el.getAttribute('data-lucide'),sys=SYS_ICONS[n];
      if(sys){
        const ph=document.createElement('i');
        ph.className='ph ph-'+sys+' sys-ic'+(el.className?' '+el.className:'');
        ph.setAttribute('aria-hidden','true');
        const st=el.getAttribute('style');
        if(st){ph.setAttribute('style',st);if(el.style.width)ph.style.fontSize=el.style.width}
        el.replaceWith(ph);
      }else if(!lucideHas(n)){
        el.setAttribute('data-lucide',lucideHas('shapes')?'shapes':'circle');
      }
    });
    if(window.lucide)window.lucide.createIcons({nameAttr:'data-lucide'});
  }catch{/* библиотека недоступна — остаются мягкие плейсхолдеры */}
}

function toast(msg,{type='info',action=null,duration=4200}={}){
  const el=document.createElement('div');el.className=`toast t-${type}`;
  const ic=type==='success'?'circle-check':type==='error'?'triangle-alert':'info';

  $('#toasts').appendChild(el);icons();
  requestAnimationFrame(()=>el.classList.add('show'));
  const kill=()=>{el.classList.remove('show');setTimeout(()=>el.remove(),260)};
  const tm=setTimeout(kill,duration);
  el.querySelector('.toast-x').onclick=()=>{clearTimeout(tm);kill()};
  if(action)el.querySelector('.toast-act').onclick=()=>{clearTimeout(tm);kill();action.fn()};
}
function confetti(x=innerWidth/2,y=innerHeight*.3){
  if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
  const c=document.createElement('canvas');c.className='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
  const ctx=c.getContext('2d');
  const p=accentPal();
  const cols=[p.a,'#E68150','#7C94E9','#DF77AC','#DBAF3D','#67B57B'];
  const ps=Array.from({length:64},()=>({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*9-3,s:Math.random()*6+4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0],l:70+Math.random()*30}));
  let f=0;
  (function tick(){
    ctx.clearRect(0,0,c.width,c.height);let alive=false;
    for(const q of ps){
      if(q.l<=0)continue;alive=true;q.l--;q.x+=q.vx;q.y+=q.vy;q.vy+=.28;q.r+=q.vr;
      ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.globalAlpha=Math.min(1,q.l/30);ctx.fillStyle=q.c;ctx.fillRect(-q.s/2,-q.s/2,q.s,q.s*.62);ctx.restore();
    }
    if(alive&&f++<170)requestAnimationFrame(tick);else c.remove();
  })();
}

function upcoming(){
  const out=[],t=today();
  state.modules.forEach(m=>{
    m.disciplines.forEach(d=>d.items.forEach(i=>{
      if(!i.dueDate||itemDone(i))return;
      out.push({kind:i.type,title:i.name,date:i.dueDate,time:i.dueTime||null,href:`#/module/${m.id}/discipline/${d.id}`,color:d.color,sub:m.name});

  state.events.forEach(ev=>{if(diffD(ev.date,t)>=0)out.push({kind:'event',title:ev.title,date:ev.date,time:ev.start,color:ev.color,sub:'событие'})});

  if(i.type==='topic')return`<article class="dv-card topic reveal" id="item-${i.id}" style="--d:${idx*60}ms"><div class="dv-head"><span class="it-ic"><i data-lucide="book-open"></i></span><div style="flex:1;min-width:0"><h3>${esc(i.name)}</h3></div>${favBtn('i:'+m.id+':'+d.id+':'+i.id)}<span class="kind-chip topic">Тема</span></div>${i.description?`<p class="dv-desc">${esc(i.description)}</p>`:''}${i.links.length?`<div class="links-row">${i.links.map(l=>linkChip(l)).join('')}</div>`:''}<div class="dv-foot"><button class="read-toggle${i.read?' on':''}" data-action="toggle-read" ${ids}><i data-lucide="${i.read?'check-check':'circle'}"></i>${i.read?'Прочитано':'Отметить прочитанной'}</button><span class="spacer"></span>${dueChip('item',ids,i.dueDate,i.read)}${timeChip(ids,i.dueDate,i.dueTime,i.dueTimeEnd)}</div></article>`;
  return`<article class="dv-card task reveal" id="item-${i.id}" style="--d:${idx*60}ms"><div class="dv-head"><span class="it-ic"><i data-lucide="clipboard-list"></i></span><div style="flex:1;min-width:0"><h3>${esc(i.name)}</h3></div>${favBtn('i:'+m.id+':'+d.id+':'+i.id)}<span class="kind-chip task">Задание</span></div>${i.description?`<p class="dv-desc">${esc(i.description)}</p>`:''}${i.criteria.length?`<div class="crit-preview">${i.criteria.map(c=>`<span class="chip">${esc(c.text)||'Критерий'}${g?` · <b>${i.scores[c.id]}/5</b>`:''}</span>`).join('')}</div>`:'<div class="hint" style="margin-top:10px">Критерии оценивания ещё не заданы.</div>'}${i.links.length?`<div class="links-row">${i.links.map(l=>linkChip(l)).join('')}</div>`:''}<div class="dv-foot">${g?gradeChipBtn(g,'item',ids):`<button class="btn btn-primary sm" data-action="open-grade" data-kind="item" ${ids}><i data-lucide="gauge"></i>Оценить</button>`}<span class="spacer"></span>${dueChip('item',ids,i.dueDate,!!g)}${timeChip(ids,i.dueDate,i.dueTime,i.dueTimeEnd)}</div></article>`;
}
function secViewHtml(m,d,e,idx){
  const open=ui.secOpen.has(e.s.id),done=e.items.filter(itemDone).length;
  return`<section class="sec-view${open?' open':''}" id="sec-${e.s.id}"><button class="sec-view-head" data-action="sec-toggle" data-id="${e.s.id}" aria-expanded="${open}"><span class="sec-ic"><i data-lucide="folder${open?'-open':''}"></i></span><b>${esc(e.s.name)}</b><span class="mono hint">${done}/${e.items.length}</span><i data-lucide="chevron-${open?'up':'down'}"></i></button>${open?`<div class="sec-view-body">${e.items.map((i,j)=>itemDvCard(m,d,i,idx+j)).join('')}</div>`:''}</section>`;
}
function discEntries(d){
  const byId=new Map(d.items.map(i=>[i.id,i]));
  return(d.layout||[]).map(n=>{
    if(n.kind==='section'){const s=d.sections.find(x=>x.id===n.id);return s?{kind:'section',s,items:s.items.map(id=>byId.get(id)).filter(Boolean)}:null}
    const i=byId.get(n.id);return i?{kind:'item',i}:null;
  }).filter(Boolean);
}
function discItemsOrdered(d){return discEntries(d).flatMap(e=>e.kind==='item'?[e.i]:e.items)}

function storageMeter(){
  let size=0;try{size=new Blob([JSON.stringify(state)]).size}catch{}
  const p=clamp(size/(5*1024*1024),0,1);
  return`<div class="hint">Занято в localStorage: <b class="mono">${(size/1024).toFixed(0)} КБ</b> из ~5 МБ</div><div class="meter${p>.8?' warn':''}" style="--p:${p}"><i></i></div>`;
}

function isMobileCal(){return matchMedia('(max-width:760px)').matches}
function weekLabel(anchor){
  const a=fromISO(anchor),b=fromISO(addD(anchor,6));
  if(a.getFullYear()!==b.getFullYear())return`${a.getDate()} ${MON_S[a.getMonth()]} ${a.getFullYear()} – ${b.getDate()} ${MON_S[b.getMonth()]} ${b.getFullYear()}`;
  if(a.getMonth()!==b.getMonth())return`${a.getDate()} ${MON_S[a.getMonth()]} – ${b.getDate()} ${MON_S[b.getMonth()]} ${b.getFullYear()}`;
  return`${a.getDate()} – ${b.getDate()} ${MONTHS_R[a.getMonth()]} ${a.getFullYear()}`;
}
function layoutDay(evts){
  const sorted=[...evts].sort((a,b)=>a.start.localeCompare(b.start)||b.end.localeCompare(a.end));
  const clusters=[];let cur=null,curEnd='';
  for(const ev of sorted){
    const end=ev.end==='24:00'?'23:59':ev.end;
    if(!cur||ev.start>=curEnd){cur={items:[]};clusters.push(cur);curEnd=end}
    else if(end>curEnd)curEnd=end;
    cur.items.push(ev);
  }
  const pos=new Map();
  for(const cl of clusters){
    const cols=[];
    for(const ev of cl.items){
      const end=ev.end==='24:00'?'23:59':ev.end;
      let ci=cols.findIndex(e=>e<=ev.start);
      if(ci<0){ci=cols.length;cols.push(end)}else cols[ci]=end;
      pos.set(ev.id,{col:ci});
    }
    cl.items.forEach(ev=>pos.get(ev.id).n=cols.length);
  }
  return pos;
}

  const out=[];

    out.push({id:`item-${i.id}`,itemId:i.id,mid:m.id,did:d.id,kind:'item',itemType:i.type,title:i.name,date:i.dueDate,start,end,color:d.color,done:itemDone(i)});

}

function positionNowLine(){
  const el=$('#now-line');if(!el)return;
  const n=new Date(),mins=n.getHours()*60+n.getMinutes();
  if(mins<DAY_START||mins>DAY_END){el.style.display='none';return}
  el.style.display='';el.style.top=((mins-DAY_START)/60*HOUR_H)+'px';
}
function afterCalendar(){
  positionNowLine();
  const grid=$('#cal-grid'),tb=$('#cal-toolbar');
  const measure=()=>{if(grid&&tb)grid.style.setProperty('--cal-tb-h',tb.offsetHeight+'px')};
  measure();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>measure());
  if(ui.calScrollMem==null){
    requestAnimationFrame(()=>{
      if(route().name!=='calendar')return;
      const g=$('#cal-grid');if(!g)return;
      const head=$('#cal-m-head')||$('#cal-toolbar');
      const headH=head?head.offsetHeight:0;
      const top=g.getBoundingClientRect().top+scrollY;
      const n=new Date(),mins=n.getHours()*60+n.getMinutes();
      const showNow=isMobileCal()?ui.calDay===today():ui.weekAnchor===weekStart(today());
      let y=Math.max(0,top-headH-10);
      if(showNow&&mins>DAY_START+90)y=Math.max(0,top+(mins-DAY_START)/60*HOUR_H-headH-90);
      scrollTo(0,y);ui.calScrollMem=scrollY;
    });
  }
  const onScroll=()=>{ui.calScrollMem=scrollY};
  addEventListener('scroll',onScroll,{passive:true});
  let fab=null;
  if(isMobileCal()){
    fab=document.createElement('button');
    fab.className='cal-today-fab';fab.dataset.action='cal-today';
    fab.setAttribute('aria-label','Перейти к сегодняшнему дню');
    fab.innerHTML='<i data-lucide="calendar-check"></i>Сегодня';
    document.body.appendChild(fab);icons();
  }
  const swipe=(el,step)=>{
    if(!el)return;
    let sx=0,sy=0,st=0;
    el.addEventListener('touchstart',e=>{if(calPtr&&calPtr.active)return;const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
    el.addEventListener('touchend',e=>{
      if(calPtr&&calPtr.active)return;
      if(Date.now()-calLastDragEnd<400)return;
      const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
      if(Date.now()-st<600&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){ui.calDay=addD(ui.calDay||today(),dx<0?step:-step);ui.weekAnchor=weekStart(ui.calDay);render()}
    },{passive:true});
  };
  swipe($('#cal-day-wrap'),1);
  swipe($('#cal-m-week'),7);
  const tm=setInterval(positionNowLine,60000);
  const mq=matchMedia('(max-width:760px)');
  const onMq=()=>{if(route().name==='calendar')render()};
  if(mq.addEventListener)mq.addEventListener('change',onMq);else mq.addListener(onMq);
  const onR=()=>measure();addEventListener('resize',onR);
  pageCleanup=()=>{
    clearInterval(tm);
    if(mq.removeEventListener)mq.removeEventListener('change',onMq);else mq.removeListener(onMq);
    removeEventListener('resize',onR);
    removeEventListener('scroll',onScroll);
    if(fab)fab.remove();
    if(route().name!=='calendar')ui.calScrollMem=null;
  };
}

// #region Календарь: перетаскивание, резайз, создание выделением
let calPtr=null,calSuppressClick=false,calLastDragEnd=0;
const CAL_SNAP=15;
const calSnap=m=>Math.round(m/CAL_SNAP)*CAL_SNAP;
function calSlotAt(x,y){
  for(const el of document.querySelectorAll('.cal-allday')){const r=el.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return{date:el.dataset.adDate,allday:true}}
  for(const el of document.querySelectorAll('.cal-strip-day')){const r=el.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return{date:el.dataset.date,strip:true}}
  for(const el of document.querySelectorAll('.cal-col')){const r=el.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top-4&&y<=r.bottom+4)return{date:el.dataset.date,min:clamp(calSnap(DAY_START+(y-r.top)/HOUR_H*60),DAY_START,DAY_END),col:el}}
  return null;
}
function calDurOf(ent){const t=calTimeOf(ent);if(!t.start)return ITEM_CAL_DURATION;const e=t.end==='24:00'?1440:hm2min(t.end);return clamp(e-hm2min(t.start),CAL_SNAP,DAY_END-DAY_START)}
function calBlockTouch(e){if(calPtr&&calPtr.active)e.preventDefault()}
function calCleanupPtr(){
  if(!calPtr)return;
  clearTimeout(calPtr.armTimer);
  if(calPtr.active)calLastDragEnd=Date.now();
  if(calPtr.ghost)calPtr.ghost.remove();
  if(calPtr.hint)calPtr.hint.remove();
  if(calPtr.selEl)calPtr.selEl.remove();
  if(calPtr.src)calPtr.src.classList.remove('cal-src-dim','cal-resizing');
  document.querySelectorAll('.drop-on').forEach(el=>el.classList.remove('drop-on'));
  document.body.classList.remove('cal-dragging');
  document.removeEventListener('touchmove',calBlockTouch);
  calPtr=null;
}
function calActivate(){
  if(!calPtr||calPtr.active)return;
  calPtr.active=true;
  document.body.classList.add('cal-dragging');
  if(calPtr.touch&&navigator.vibrate)try{navigator.vibrate(20)}catch{}
  document.addEventListener('touchmove',calBlockTouch,{passive:false});
  if(calPtr.mode==='move'){
    const r=calPtr.src.getBoundingClientRect();
    const g=calPtr.src.cloneNode(true);
    g.classList.add('cal-ghost');g.classList.remove('cal-event','cal-ad-item');
    g.style.width=Math.max(120,Math.min(r.width,220))+'px';
    document.body.appendChild(g);calPtr.ghost=g;
    calPtr.src.classList.add('cal-src-dim');
    const h=document.createElement('div');h.className='cal-drop-hint pc-'+calPtr.color;h.innerHTML='<span></span>';h.style.display='none';document.body.appendChild(h);calPtr.hint=h;
  }else if(calPtr.mode.startsWith('resize')){
    calPtr.src.classList.add('cal-resizing');
  }else if(calPtr.mode==='create'){
    const s=document.createElement('div');s.className='cal-select';s.innerHTML='<span></span>';calPtr.col.appendChild(s);calPtr.selEl=s;
  }
}
function calAutoScroll(y){
  const head=isMobileCal()?$('#cal-m-head'):$('#cal-toolbar');
  const top=(head?head.getBoundingClientRect().bottom:0)+8;
  if(y<top+44)scrollBy(0,-12);else if(y>innerHeight-52)scrollBy(0,12);
}
document.addEventListener('pointerdown',e=>{
  if(route().name!=='calendar'||calPtr)return;
  if(e.button!==undefined&&e.button>0)return;
  const rs=e.target.closest('.cal-rs');
  const block=e.target.closest('[data-caldrag]');
  const col=e.target.closest('.cal-col');
  let mode=null;
  if(rs&&block&&block.classList.contains('cal-event'))mode=rs.dataset.rs==='top'?'resize-top':'resize-bottom';
  else if(block)mode='move';
  else if(col&&!e.target.closest('.cal-event,.cal-ad-item'))mode='create';
  if(!mode)return;
  const touch=e.pointerType==='touch';
  const ent=mode==='create'?null:calEntityGet(block.dataset);
  if(mode!=='create'&&!ent)return;
  calPtr={mode,touch,ent,src:block||null,col:col||(block?block.closest('.cal-col'):null),
    x0:e.clientX,y0:e.clientY,pointerId:e.pointerId,active:false,moved:false,
    dur:ent?calDurOf(ent):0,orig:ent?calTimeOf(ent):null,grabOff:0,
    color:ent?(ent.type==='event'?ent.ev.color:ent.d.color):'blue',
    anchorMin:null,cur:null,resCur:null,createCur:null};
  if(mode==='create'&&col){const r=col.getBoundingClientRect();calPtr.anchorMin=clamp(calSnap(DAY_START+(e.clientY-r.top)/HOUR_H*60),DAY_START,DAY_END-CAL_SNAP)}
  if(mode==='move'&&ent&&calPtr.orig.start&&block.classList.contains('cal-event')){
    const r=block.closest('.cal-col').getBoundingClientRect();
    calPtr.grabOff=clamp(DAY_START+(e.clientY-r.top)/HOUR_H*60-hm2min(calPtr.orig.start),0,calPtr.dur);
  }
  if(touch&&!mode.startsWith('resize'))calPtr.armTimer=setTimeout(()=>{if(calPtr&&!calPtr.moved)calActivate()},380);
},true);
document.addEventListener('pointermove',e=>{
  if(!calPtr||e.pointerId!==calPtr.pointerId)return;
  const p=calPtr,dx=e.clientX-p.x0,dy=e.clientY-p.y0;
  if(!p.active){
    const dist=Math.hypot(dx,dy);
    if(p.touch&&!p.mode.startsWith('resize')){if(dist>10){p.moved=true;calCleanupPtr()}return}
    if(dist>(p.touch?2:4))calActivate();else return;
  }
  e.preventDefault();
  calAutoScroll(e.clientY);
  if(p.mode==='move'){
    const g=p.ghost;
    g.style.left=(e.clientX-g.offsetWidth/2)+'px';
    g.style.top=(e.clientY-16)+'px';
    const slot=calSlotAt(e.clientX,e.clientY);
    p.cur=slot;
    document.querySelectorAll('.drop-on').forEach(el=>el.classList.remove('drop-on'));
    const h=p.hint;
    if(slot&&slot.col){
      if(h.parentNode!==slot.col)slot.col.appendChild(h);
      h.style.display='';
      const start=calSnap(clamp(slot.min-p.grabOff,DAY_START,DAY_END-p.dur));
      const end=Math.min(start+p.dur,DAY_END);
      h.style.top=((start-DAY_START)/60*HOUR_H)+'px';
      h.style.height=(p.dur/60*HOUR_H)+'px';
      h.querySelector('span').textContent=min2hm(start)+'–'+min2hm(end);
    }else{
      h.style.display='none';
      if(slot&&(slot.allday||slot.strip)){
        const el=slot.allday?document.querySelector(`.cal-allday[data-ad-date="${slot.date}"]`):document.querySelector(`.cal-strip-day[data-date="${slot.date}"]`);
        if(el)el.classList.add('drop-on');
      }
    }
  }else if(p.mode.startsWith('resize')){
    const col=p.src.closest('.cal-col');if(!col)return;
    const r=col.getBoundingClientRect();
    const min=clamp(calSnap(DAY_START+(e.clientY-r.top)/HOUR_H*60),DAY_START,DAY_END);
    const o=p.orig;let s=hm2min(o.start),en=Math.min(o.end==='24:00'?1440:hm2min(o.end),DAY_END);
    if(p.mode==='resize-top')s=clamp(min,DAY_START,en-CAL_SNAP);else en=clamp(min,s+CAL_SNAP,DAY_END);
    p.resCur={start:s,end:en};
    p.src.style.top=((s-DAY_START)/60*HOUR_H)+'px';
    p.src.style.height=Math.max(24,(en-s)/60*HOUR_H-2)+'px';
    const tl=p.src.querySelector('.ev-time');if(tl)tl.textContent=min2hm(s)+'–'+min2hm(en);
  }else if(p.mode==='create'){
    const r=p.col.getBoundingClientRect();
    const min=clamp(calSnap(DAY_START+(e.clientY-r.top)/HOUR_H*60),DAY_START,DAY_END);
    let a=Math.min(p.anchorMin,min),b=Math.max(p.anchorMin,min);
    if(b-a<CAL_SNAP)b=a+CAL_SNAP;
    b=Math.min(b,DAY_END);
    p.createCur={start:a,end:b};
    p.selEl.style.top=((a-DAY_START)/60*HOUR_H)+'px';
    p.selEl.style.height=((b-a)/60*HOUR_H)+'px';
    p.selEl.querySelector('span').textContent=min2hm(a)+'–'+min2hm(b);
  }
});
document.addEventListener('pointerup',e=>{
  if(!calPtr||e.pointerId!==calPtr.pointerId)return;
  const p=calPtr;
  if(!p.active){calCleanupPtr();return}
  calSuppressClick=true;setTimeout(()=>{calSuppressClick=false},400);
  if(p.mode==='move'){
    const slot=p.cur;

      if(slot.allday){
        const date=slot.date;mutate(()=>calTimeSet(p.ent,date,null,null),'Перенесено в «Весь день»');
      }else if(slot.strip){
        const t=calTimeOf(p.ent),date=slot.date;
        mutate(()=>calTimeSet(p.ent,date,t.start,t.start?t.end:null),'Дата обновлена');
      }else{
        const start=calSnap(clamp(slot.min-p.grabOff,DAY_START,DAY_END-p.dur));
        const end=Math.min(start+p.dur,DAY_END),date=slot.date;
        mutate(()=>calTimeSet(p.ent,date,min2hm(start),min2hm(end)),`Перенесено: ${dayLabel(date)} · ${min2hm(start)}–${min2hm(end)}`);
      }
    }
  }else if(p.mode.startsWith('resize')){
    const c=p.resCur;

document.addEventListener('pointercancel',()=>calCleanupPtr());
document.addEventListener('click',e=>{if(calSuppressClick){calSuppressClick=false;e.stopPropagation();e.preventDefault()}},true);

function saveEvent(){
  const c=modalCtx;if(!c||c.type!=='event')return;
  const d=c.draft;
  if(!d.title.trim())return evtError('Введите название события.');
  if(!validISO(d.date))return evtError('Выберите дату.');
  const old=c.id?state.events.find(e=>e.id===c.id):null;
  const links=(d.links||[]).filter(l=>l.url.trim());
  let ev;
  if(d.allDay){
    ev={id:c.id||uid(),title:d.title.trim(),description:d.description,date:d.date,start:null,end:null,allDay:true,color:d.color,links,sourceItemId:old?old.sourceItemId:null};
  }else{
    const st=parseHM(d.start),en=parseHM(d.end);

    if(hm2min(en)<=hm2min(st))return evtError('Конец должен быть позже начала.');
    ev={id:c.id||uid(),title:d.title.trim(),description:d.description,date:d.date,start:st,end:en,allDay:false,color:d.color,links,sourceItemId:old?old.sourceItemId:null};
  }
  if(c.id){const i=state.events.findIndex(e=>e.id===c.id);if(i>=0)state.events[i]=ev}else state.events.push(ev);
  ui.weekAnchor=weekStart(ev.date);ui.calDay=ev.date;
  save();closeModal();render();
  if(c.returnTo)openEntryModal(c.returnTo.ref);

// #region Экспорт в Apple Calendar (.ics)
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
// Перенос строк по стандарту iCalendar: не более 75 октетов, с учётом кириллицы
function icsFold(line){
  const enc=new TextEncoder(),out=[];let cur='',bytes=0;
  for(const ch of String(line)){
    const b=enc.encode(ch).length;
    if(bytes+b>74){out.push(cur);cur=' '+ch;bytes=1+b}
    else{cur+=ch;bytes+=b}
  }
  out.push(cur);return out.join('\r\n');
}
// Локальное время события переводим в UTC — Apple Calendar показывает его в часовом поясе пользователя
function icsUtc(date,time){
  const[y,m,d]=date.split('-').map(Number),[hh,mm]=time.split(':').map(Number);
  return new Date(y,m-1,d,hh,mm).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
}
function icsCandidates(){
  const c=modalCtx&&modalCtx.type==='ics'?modalCtx.draft:{useRange:false,from:today(),to:null};
  const from=c.useRange?c.from:today(),to=c.useRange?c.to:null;
  const inRange=ds=>diffD(ds,from)>=0&&(!to||diffD(ds,to)<=0);
  const out=[];
  state.events.filter(e=>inRange(e.date)).forEach(e=>out.push({id:'ev-'+e.id,kind:'event',title:e.title,description:e.description,date:e.date,start:e.allDay?null:e.start,end:e.allDay?null:e.end,allDay:e.allDay,color:e.color}));
  state.modules.forEach(m=>m.disciplines.forEach(d=>d.items.forEach(i=>{
    if(!i.dueDate||!i.dueTime||!inRange(i.dueDate))return;
    const end=i.dueTimeEnd||min2hm(Math.min(hm2min(i.dueTime)+ITEM_CAL_DURATION,T_END_MAX));
    const links=i.links.map(l=>`${l.label||hostOf(l.url)}: ${l.url}`).join('\n');
    out.push({id:'it-'+i.id,kind:i.type,title:i.name,description:`${i.type==='task'?'Задание':'Тема'} · ${m.name} / ${d.name}\n${i.description}${links?'\nСсылки:\n'+links:''}`,date:i.dueDate,start:i.dueTime,end,color:d.color,allDay:false});
  })));
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.start||'').localeCompare(String(b.start||'')));
  return out;
}
function icsListHtml(){

function downloadIcs(){
  const sel=icsSelected();
  if(!sel.length){toast('Нет выбранных элементов для экспорта',{type:'error'});return}
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//larpdeez//study calendar//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:larpdeez','X-WR-CALDESC:Учебные события, темы и задания из larpdeez'];
  sel.forEach(x=>{
    lines.push('BEGIN:VEVENT',`UID:${x.id}-${x.date.replace(/-/g,'')}@larpdeez.local`,`DTSTAMP:${stamp}`);
    if(x.allDay)lines.push(`DTSTART;VALUE=DATE:${x.date.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addD(x.date,1).replace(/-/g,'')}`);
    else lines.push(`DTSTART:${icsUtc(x.date,x.start)}`,`DTEND:${icsUtc(x.date,x.end)}`);
    lines.push(`SUMMARY:${icsEscape(x.title)}`,`DESCRIPTION:${icsEscape(x.description)}`,`CATEGORIES:${icsEscape(x.kind==='event'?'Событие':x.kind==='task'?'Задание':'Тема')}`,'STATUS:CONFIRMED','TRANSP:OPAQUE','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const text=lines.map(icsFold).join('\r\n')+'\r\n';
  try{
    const blob=new Blob([text],{type:'text/calendar;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`larpdeez-${today()}.ics`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    closeModal();toast(`Экспортировано ${sel.length} ${plural(sel.length,['элемент','элемента','элементов'])} в .ics`,{type:'success'});
  }catch{toast('Не удалось создать файл .ics',{type:'error'})}
}

function weekLabel(anchor){

  return`${a.getDate()} – ${b.getDate()} ${MONTHS_R[a.getMonth()]} ${a.getFullYear()}`;
}
function layoutDay(evts){
  const sorted=[...evts].sort((a,b)=>a.start.localeCompare(b.start)||b.end.localeCompare(a.end));
  const clusters=[];let cur=null,curEnd='';
  for(const ev of sorted){
    const end=ev.end==='24:00'?'23:59':ev.end;
    if(!cur||ev.start>=curEnd){cur={items:[]};clusters.push(cur);curEnd=end}
    else if(end>curEnd)curEnd=end;
    cur.items.push(ev);
  }
  const pos=new Map();
  for(const cl of clusters){
    const cols=[];
    for(const ev of cl.items){
      const end=ev.end==='24:00'?'23:59':ev.end;
      let ci=cols.findIndex(e=>e<=ev.start);
      if(ci<0){ci=cols.length;cols.push(end)}else cols[ci]=end;
      pos.set(ev.id,{col:ci});
    }
    cl.items.forEach(ev=>pos.get(ev.id).n=cols.length);
  }
  return pos;
}

    out.push({id:`item-${i.id}`,itemId:i.id,mid:m.id,did:d.id,kind:'item',itemType:i.type,title:i.name,date:i.dueDate,start,end,color:d.color,done:itemDone(i)});

  return`<div class="page cal-desktop">${toolbar}

${gutter}${cols}

}
function positionNowLine(){
  const el=$('#now-line');if(!el)return;
  const n=new Date(),mins=n.getHours()*60+n.getMinutes();
  if(mins<DAY_START||mins>DAY_END){el.style.display='none';return}
  el.style.display='';el.style.top=((mins-DAY_START)/60*HOUR_H)+'px';
}
function afterCalendar(){
  positionNowLine();
  const grid=$('#cal-grid'),tb=$('#cal-toolbar');
  const measure=()=>{if(grid&&tb)grid.style.setProperty('--cal-tb-h',tb.offsetHeight+'px')};
  measure();
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(()=>measure());
  if(ui.calScrollMem==null){
    requestAnimationFrame(()=>{
      if(route().name!=='calendar')return;
      const g=$('#cal-grid');if(!g)return;
      const head=$('#cal-m-head')||$('#cal-toolbar');
      const headH=head?head.offsetHeight:0;
      const top=g.getBoundingClientRect().top+scrollY;
      const n=new Date(),mins=n.getHours()*60+n.getMinutes();
      const showNow=isMobileCal()?ui.calDay===today():ui.weekAnchor===weekStart(today());
      let y=Math.max(0,top-headH-10);
      if(showNow&&mins>DAY_START+90)y=Math.max(0,top+(mins-DAY_START)/60*HOUR_H-headH-90);
      scrollTo(0,y);ui.calScrollMem=scrollY;
    });
  }
  const onScroll=()=>{ui.calScrollMem=scrollY};
  addEventListener('scroll',onScroll,{passive:true});
  let fab=null;
  if(isMobileCal()){
    fab=document.createElement('button');
    fab.className='cal-today-fab';fab.dataset.action='cal-today';
    fab.setAttribute('aria-label','Перейти к сегодняшнему дню');
    fab.innerHTML='<i data-lucide="calendar-check"></i>Сегодня';
    document.body.appendChild(fab);icons();
  }
  const swipe=(el,step)=>{
    if(!el)return;
    let sx=0,sy=0,st=0;
    el.addEventListener('touchstart',e=>{if(calPtr&&calPtr.active)return;const t=e.touches[0];sx=t.clientX;sy=t.clientY;st=Date.now()},{passive:true});
    el.addEventListener('touchend',e=>{
      if(calPtr&&calPtr.active)return;
      if(Date.now()-calLastDragEnd<400)return;
      const t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy;
      if(Date.now()-st<600&&Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy)*1.6){ui.calDay=addD(ui.calDay||today(),dx<0?step:-step);ui.weekAnchor=weekStart(ui.calDay);render()}
    },{passive:true});
  };
  swipe($('#cal-day-wrap'),1);
  swipe($('#cal-m-week'),7);
  const tm=setInterval(positionNowLine,60000);
  const mq=matchMedia('(max-width:760px)');
  const onMq=()=>{if(route().name==='calendar')render()};
  if(mq.addEventListener)mq.addEventListener('change',onMq);else mq.addListener(onMq);
  const onR=()=>measure();addEventListener('resize',onR);
  pageCleanup=()=>{
    clearInterval(tm);
    if(mq.removeEventListener)mq.removeEventListener('change',onMq);else mq.removeListener(onMq);
    removeEventListener('resize',onR);
    removeEventListener('scroll',onScroll);
    if(fab)fab.remove();
    if(route().name!=='calendar')ui.calScrollMem=null;
  };
}

// #region Календарь: перетаскивание, резайз, создание выделением
function calDurOf(ent){const t=calTimeOf(ent);if(!t.start)return ITEM_CAL_DURATION;const e=t.end==='24:00'?1440:hm2min(t.end);return clamp(e-hm2min(t.start),CAL_SNAP,DAY_END-DAY_START)}
function calBlockTouch(e){if(calPtr&&calPtr.active)e.preventDefault()}
function calCleanupPtr(){
  if(!calPtr)return;
  clearTimeout(calPtr.armTimer);
  if(calPtr.active)calLastDragEnd=Date.now();
  if(calPtr.ghost)calPtr.ghost.remove();
  if(calPtr.hint)calPtr.hint.remove();
  if(calPtr.selEl)calPtr.selEl.remove();
  if(calPtr.src)calPtr.src.classList.remove('cal-src-dim','cal-resizing');
  document.querySelectorAll('.drop-on').forEach(el=>el.classList.remove('drop-on'));
  document.body.classList.remove('cal-dragging');
  document.removeEventListener('touchmove',calBlockTouch);
  calPtr=null;
}
function calActivate(){
  if(!calPtr||calPtr.active)return;
  calPtr.active=true;
  document.body.classList.add('cal-dragging');
  if(calPtr.touch&&navigator.vibrate)try{navigator.vibrate(20)}catch{}
  document.addEventListener('touchmove',calBlockTouch,{passive:false});
  if(calPtr.mode==='move'){
    const r=calPtr.src.getBoundingClientRect();
    const g=calPtr.src.cloneNode(true);
    g.classList.add('cal-ghost');g.classList.remove('cal-event','cal-ad-item');
    g.style.width=Math.max(120,Math.min(r.width,220))+'px';
    document.body.appendChild(g);calPtr.ghost=g;
    calPtr.src.classList.add('cal-src-dim');
    const h=document.createElement('div');h.className='cal-drop-hint pc-'+calPtr.color;h.innerHTML='<span></span>';h.style.display='none';document.body.appendChild(h);calPtr.hint=h;
  }else if(calPtr.mode.startsWith('resize')){calPtr.src.classList.add('cal-resizing')}
  else if(calPtr.mode==='create'){const s=document.createElement('div');s.className='cal-select';s.innerHTML='<span></span>';calPtr.col.appendChild(s);calPtr.selEl=s}
}
function calAutoScroll(y){
  const head=isMobileCal()?$('#cal-m-head'):$('#cal-toolbar');
  const top=(head?head.getBoundingClientRect().bottom:0)+8;
  if(y<top+44)scrollBy(0,-12);else if(y>innerHeight-52)scrollBy(0,12);
}
document.addEventListener('pointerdown',e=>{
  if(route().name!=='calendar'||calPtr)return;
  if(e.button!==undefined&&e.button>0)return;
  const rs=e.target.closest('.cal-rs');
  const block=e.target.closest('[data-caldrag]');
  const col=e.target.closest('.cal-col');
  let mode=null;
  if(rs&&block&&block.classList.contains('cal-event'))mode=rs.dataset.rs==='top'?'resize-top':'resize-bottom';
  else if(block)mode='move';
  else if(col&&!e.target.closest('.cal-event,.cal-ad-item'))mode='create';
  if(!mode)return;
  const touch=e.pointerType==='touch';
  const ent=mode==='create'?null:calEntityGet(block.dataset);
  if(mode!=='create'&&!ent)return;
  calPtr={mode,touch,ent,src:block||null,col:col||(block?block.closest('.cal-col'):null),
    x0:e.clientX,y0:e.clientY,pointerId:e.pointerId,active:false,moved:false,
    dur:ent?calDurOf(ent):0,orig:ent?calTimeOf(ent):null,grabOff:0,
    color:ent?(ent.type==='event'?ent.ev.color:ent.d.color):'blue',
    anchorMin:null,cur:null,resCur:null,createCur:null};
  if(mode==='create'&&col){const r=col.getBoundingClientRect();calPtr.anchorMin=clamp(calSnap(DAY_START+(e.clientY-r.top)/HOUR_H*60),DAY_START,DAY_END-CAL_SNAP)}
  if(mode==='move'&&ent&&calPtr.orig.start&&block.classList.contains('cal-event')){
    const r=block.closest('.cal-col').getBoundingClientRect();
    calPtr.grabOff=clamp(DAY_START+(e.clientY-r.top)/HOUR_H*60-hm2min(calPtr.orig.start),0,calPtr.dur);
  }
  if(touch&&!mode.startsWith('resize'))calPtr.armTimer=setTimeout(()=>{if(calPtr&&!calPtr.moved)calActivate()},380);
},true);
document.addEventListener('pointermove',e=>{
  if(!calPtr||e.pointerId!==calPtr.pointerId)return;
  const p=calPtr,dx=e.clientX-p.x0,dy=e.clientY-p.y0;
  if(!p.active){
    const dist=Math.hypot(dx,dy);
    if(p.touch&&!p.mode.startsWith('resize')){if(dist>10){p.moved=true;calCleanupPtr()}return}
    if(dist>(p.touch?2:4))calActivate();else return;
  }
  e.preventDefault();
  calAutoScroll(e.clientY);
  if(p.mode==='move'){
    const g=p.ghost;
    g.style.left=(e.clientX-g.offsetWidth/2)+'px';
    g.style.top=(e.clientY-16)+'px';
    const slot=calSlotAt(e.clientX,e.clientY);
    p.cur=slot;
    document.querySelectorAll('.drop-on').forEach(el=>el.classList.remove('drop-on'));
    const h=p.hint;
    if(slot&&slot.col){
      if(h.parentNode!==slot.col)slot.col.appendChild(h);
      h.style.display='';
      const start=calSnap(clamp(slot.min-p.grabOff,DAY_START,DAY_END-p.dur));
      const end=Math.min(start+p.dur,DAY_END);
      h.style.top=((start-DAY_START)/60*HOUR_H)+'px';
      h.style.height=(p.dur/60*HOUR_H)+'px';
      h.querySelector('span').textContent=min2hm(start)+'–'+min2hm(end);
    }else{
      h.style.display='none';
      if(slot&&(slot.allday||slot.strip)){
        const el=slot.allday?document.querySelector(`.cal-allday[data-ad-date="${slot.date}"]`):document.querySelector(`.cal-strip-day[data-date="${slot.date}"]`);
        if(el)el.classList.add('drop-on');
      }
    }
  }else if(p.mode.startsWith('resize')){
    const col=p.src.closest('.cal-col');if(!col)return;
    const r=col.getBoundingClientRect();
    const min=clamp(calSnap(DAY_START+(e.clientY-r.top)/HOUR_H*60),DAY_START,DAY_END);
    const o=p.orig;let s=hm2min(o.start),en=Math.min(o.end==='24:00'?1440:hm2min(o.end),DAY_END);
    if(p.mode==='resize-top')s=clamp(min,DAY_START,en-CAL_SNAP);else en=clamp(min,s+CAL_SNAP,DAY_END);
    p.resCur={start:s,end:en};
    p.src.style.top=((s-DAY_START)/60*HOUR_H)+'px';
    p.src.style.height=Math.max(24,(en-s)/60*HOUR_H-2)+'px';
    const tl=p.src.querySelector('.ev-time');if(tl)tl.textContent=min2hm(s)+'–'+min2hm(en);
  }else if(p.mode==='create'){
    const r=p.col.getBoundingClientRect();
    const min=clamp(calSnap(DAY_START+(e.clientY-r.top)/HOUR_H*60),DAY_START,DAY_END);
    let a=Math.min(p.anchorMin,min),b=Math.max(p.anchorMin,min);
    if(b-a<CAL_SNAP)b=a+CAL_SNAP;
    b=Math.min(b,DAY_END);
    p.createCur={start:a,end:b};
    p.selEl.style.top=((a-DAY_START)/60*HOUR_H)+'px';
    p.selEl.style.height=((b-a)/60*HOUR_H)+'px';
    p.selEl.querySelector('span').textContent=min2hm(a)+'–'+min2hm(b);
  }
});
document.addEventListener('pointerup',e=>{
  if(!calPtr||e.pointerId!==calPtr.pointerId)return;
  const p=calPtr;
  if(!p.active){calCleanupPtr();return}
  calSuppressClick=true;setTimeout(()=>{calSuppressClick=false},400);
  if(p.mode==='move'){
    const slot=p.cur;
    if(slot){
      if(slot.allday){
        const date=slot.date;mutate(()=>calTimeSet(p.ent,date,null,null),'Перенесено в «Весь день»');
      }else if(slot.strip){
        const t=calTimeOf(p.ent),date=slot.date;
        mutate(()=>calTimeSet(p.ent,date,t.start,t.start?t.end:null),'Дата обновлена');
      }else{
        const start=calSnap(clamp(slot.min-p.grabOff,DAY_START,DAY_END-p.dur));
        const end=Math.min(start+p.dur,DAY_END),date=slot.date;
        mutate(()=>calTimeSet(p.ent,date,min2hm(start),min2hm(end)),`Перенесено: ${dayLabel(date)} · ${min2hm(start)}–${min2hm(end)}`);
      }
    }
  }else if(p.mode.startsWith('resize')){
    const c=p.resCur;
    if(c){const ent=p.ent,date=calTimeOf(ent).date;mutate(()=>calTimeSet(ent,date,min2hm(c.start),min2hm(c.end)),'Длительность обновлена')}
  }else if(p.mode==='create'){
    const c=p.createCur;
    if(c&&c.end-c.start>=CAL_SNAP)openEventModal(null,{date:p.col.dataset.date,start:min2hm(c.start),end:min2hm(c.end)});
  }
  calCleanupPtr();
});
document.addEventListener('pointercancel',()=>calCleanupPtr());
document.addEventListener('click',e=>{if(calSuppressClick){calSuppressClick=false;e.stopPropagation();e.preventDefault()}},true);

}
function saveEvent(){
  const c=modalCtx;if(!c||c.type!=='event')return;
  const d=c.draft;
  if(!d.title.trim())return evtError('Введите название события.');
  if(!validISO(d.date))return evtError('Выберите дату.');
  const old=c.id?state.events.find(e=>e.id===c.id):null;
  const links=(d.links||[]).filter(l=>l.url.trim());
  let ev;
  if(d.allDay){ev={id:c.id||uid(),title:d.title.trim(),description:d.description,date:d.date,start:null,end:null,allDay:true,color:d.color,links,sourceItemId:old?old.sourceItemId:null}}
  else{
    const st=parseHM(d.start),en=parseHM(d.end);
    if(!st||!en)return evtError('Введите время в формате ЧЧ:ММ, например 09:30.');
    if(!okStart(st))return evtError('Начало должно быть между 08:00 и 22:30.');
    if(!okEnd(en))return evtError('Конец должен быть между 08:30 и 23:00.');
    if(hm2min(en)<=hm2min(st))return evtError('Конец должен быть позже начала.');
    ev={id:c.id||uid(),title:d.title.trim(),description:d.description,date:d.date,start:st,end:en,allDay:false,color:d.color,links,sourceItemId:old?old.sourceItemId:null};
  }
  if(c.id){const i=state.events.findIndex(e=>e.id===c.id);if(i>=0)state.events[i]=ev}else state.events.push(ev);
  ui.weekAnchor=weekStart(ev.date);ui.calDay=ev.date;
  save();closeModal();render();

// #region Экспорт в Apple Calendar (.ics)
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
// Перенос строк по стандарту iCalendar: не более 75 октетов, с учётом кириллицы
function icsFold(line){
  const enc=new TextEncoder(),out=[];let cur='',bytes=0;
  for(const ch of String(line)){
    const b=enc.encode(ch).length;
    if(bytes+b>74){out.push(cur);cur=' '+ch;bytes=1+b}
    else{cur+=ch;bytes+=b}
  }
  out.push(cur);return out.join('\r\n');
}
// Локальное время события переводим в UTC — Apple Calendar показывает его в часовом поясе пользователя
function icsUtc(date,time){
  const[y,m,d]=date.split('-').map(Number),[hh,mm]=time.split(':').map(Number);
  return new Date(y,m-1,d,hh,mm).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
}
function icsCandidates(){
  const c=modalCtx&&modalCtx.type==='ics'?modalCtx.draft:{useRange:false,from:today(),to:null};
  const from=c.useRange?c.from:today(),to=c.useRange?c.to:null;
  const inRange=ds=>diffD(ds,from)>=0&&(!to||diffD(ds,to)<=0);
  const out=[];
  state.events.filter(e=>inRange(e.date)).forEach(e=>out.push({id:'ev-'+e.id,kind:'event',title:e.title,description:e.description,date:e.date,start:e.allDay?null:e.start,end:e.allDay?null:e.end,allDay:e.allDay,color:e.color}));
  state.modules.forEach(m=>m.disciplines.forEach(d=>d.items.forEach(i=>{
    if(!i.dueDate||!i.dueTime||!inRange(i.dueDate))return;
    const end=i.dueTimeEnd||min2hm(Math.min(hm2min(i.dueTime)+ITEM_CAL_DURATION,T_END_MAX));
    const links=i.links.map(l=>`${l.label||hostOf(l.url)}: ${l.url}`).join('\n');
    out.push({id:'it-'+i.id,kind:i.type,title:i.name,description:`${i.type==='task'?'Задание':'Тема'} · ${m.name} / ${d.name}\n${i.description}${links?'\nСсылки:\n'+links:''}`,date:i.dueDate,start:i.dueTime,end,color:d.color,allDay:false});
  })));
  out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.start||'').localeCompare(String(b.start||'')));
  return out;
}
function icsSelected(){const c=modalCtx.draft;return icsCandidates().filter(x=>!c.excluded.has(x.id))}
function icsListHtml(){
  const c=modalCtx.draft,list=icsCandidates();
  if(!list.length)return'<div class="hint" style="padding:14px;text-align:center">В выбранном диапазоне нет элементов с датой.</div>';
  return list.map(x=>{const on=!c.excluded.has(x.id);return`<label class="ics-row pc-${x.color}${on?' on':''}"><input class="ics-check-input" type="checkbox" data-ics-id="${x.id}" ${on?'checked':''}><span class="ics-check" aria-hidden="true"><i data-lucide="check"></i></span><span class="dot"></span><span class="t"><b>${esc(x.title)}</b><span>${x.kind==='event'?'событие':x.kind==='task'?'задание':'тема'}</span></span><span class="when">${dayLabel(x.date)} · ${x.allDay?'весь день':x.start}</span></label>`}).join('');
}
function downloadIcs(){
  const sel=icsSelected();
  if(!sel.length){toast('Нет выбранных элементов для экспорта',{type:'error'});return}
  const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
  const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//larpdeez//study calendar//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:larpdeez','X-WR-CALDESC:Учебные события, темы и задания из larpdeez'];
  sel.forEach(x=>{
    lines.push('BEGIN:VEVENT',`UID:${x.id}-${x.date.replace(/-/g,'')}@larpdeez.local`,`DTSTAMP:${stamp}`);
    if(x.allDay)lines.push(`DTSTART;VALUE=DATE:${x.date.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addD(x.date,1).replace(/-/g,'')}`);
    else lines.push(`DTSTART:${icsUtc(x.date,x.start)}`,`DTEND:${icsUtc(x.date,x.end)}`);
    lines.push(`SUMMARY:${icsEscape(x.title)}`,`DESCRIPTION:${icsEscape(x.description)}`,`CATEGORIES:${icsEscape(x.kind==='event'?'Событие':x.kind==='task'?'Задание':'Тема')}`,'STATUS:CONFIRMED','TRANSP:OPAQUE','END:VEVENT');
  });
  lines.push('END:VCALENDAR');
  const text=lines.map(icsFold).join('\r\n')+'\r\n';
  try{
    const blob=new Blob([text],{type:'text/calendar;charset=utf-8'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`larpdeez-${today()}.ics`;
    document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    closeModal();toast(`Экспортировано ${sel.length} ${plural(sel.length,['элемент','элемента','элементов'])} в .ics`,{type:'success'});
  }catch{toast('Не удалось создать файл .ics',{type:'error'})}
}
function icsDateLabel(v){
  if(!validISO(v))return'—';
  const d=fromISO(v);
  return`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
}

${c.useRange?`<div><label class="lbl">По</label><button class="field ics-date-btn" data-action="ics-date" data-field="to" title="${validISO(c.to)?fmtLong(c.to):'Без ограничения'}"><i data-lucide="calendar"></i><span>${icsDateLabel(c.to)}</span><i data-lucide="chevron-down" class="chev"></i></button></div><button class="btn btn-ghost sm" data-action="ics-clear-to" style="height:40px">Сбросить «по»</button>`:''}`;
}

async function importFile(file){
  if(!file)return;
  let parsed;
  try{parsed=JSON.parse(await file.text())}
  catch{toast('Файл повреждён: это не корректный JSON. Данные не изменены.',{type:'error',duration:6000});return}
  const raw=parsed&&typeof parsed==='object'&&parsed.data?parsed.data:parsed;
  if(!raw||typeof raw!=='object'||Array.isArray(raw)||(!Array.isArray(raw.modules)&&!raw.course)){
    toast('Файл не похож на резервную копию larpdeez. Данные не изменены.',{type:'error',duration:6000});return;
  }
  let next;
  try{next=normalize(raw)}catch{toast('Не удалось разобрать структуру файла. Данные не изменены.',{type:'error'});return}
  openConfirm('Импортировать данные?',`В файле: ${next.modules.length} ${plural(next.modules.length,['модуль','модуля','модулей'])}, ${next.events.length} ${plural(next.events.length,['событие','события','событий'])}. Текущие данные будут заменены.`,()=>{

  },'Импортировать');
