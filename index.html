// #region Drag-and-drop сортировка (курсы + входящие)
let dragCtx=null;
function clearDropMarks(){document.querySelectorAll('.drop-before').forEach(x=>x.classList.remove('drop-before'));document.querySelectorAll('.drop-end').forEach(x=>x.classList.remove('drop-end'))}
function sortArray(list,mid,did){
  if(list==='modules')return state.modules;
  if(list==='discs'){const m=findM(mid);return m?m.disciplines:null}
  if(list==='items'){const d=findD(findM(mid),did);return d?d.items:null}
  return null;
}
function applyOrder(list,mid,did,ids){const arr=sortArray(list,mid,did);if(!arr)return;arr.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));save();render()}
const findInboxSec=id=>state.inboxSections.find(s=>s.id===id);
// Порядок элементов внутри раздела входящих
function applyInboxSecOrder(sid,ids){
  const sec=findInboxSec(sid);if(!sec)return;
  sec.items.sort((a,b)=>ids.indexOf(a)-ids.indexOf(b));
  save();render();
}
// Перенос узла в корневом списке входящих (материалы и разделы)
function applyInboxLayoutDrop(dragId,kind,beforeId){
  const rem=(id,isSec)=>{
    if(isSec)state.inboxLayout=state.inboxLayout.filter(n=>!(n.kind==='section'&&n.id===id));
    else{
      state.inboxLayout=state.inboxLayout.filter(n=>!(n.kind==='item'&&n.id===id));
      state.inboxSections.forEach(s=>s.items=s.items.filter(x=>x!==id));
    }
  };
  rem(dragId,kind==='section');
  const node={kind:kind==='section'?'section':'item',id:dragId};
  const idx=beforeId?state.inboxLayout.findIndex(n=>n.id===beforeId&&n.kind===node.kind):-1;
  if(idx>=0)state.inboxLayout.splice(idx,0,node);else state.inboxLayout.push(node);
  save();render();
}
function dragAllowed(target){
  if(!dragCtx)return false;
  const tl=target.dataset.sortlist;
  if(dragCtx.list==='modules'||dragCtx.list==='discs')return tl===dragCtx.list;
  if(dragCtx.list==='inboxlayout')return tl==='inboxlayout';
  if(dragCtx.list==='inboxsec')return tl==='inboxsec'&&target.dataset.sid===dragCtx.sid;
  if(dragCtx.mid!==target.dataset.mid||dragCtx.did!==target.dataset.did)return false;
  if(dragCtx.kind==='section')return tl==='layout';
  return tl==='layout'||tl==='secitems';
}
function removeFromContainers(d,id,kind){
  if(kind==='section'){d.layout=d.layout.filter(n=>!(n.kind==='section'&&n.id===id));return}
  d.layout=d.layout.filter(n=>!(n.kind==='item'&&n.id===id));
  d.sections.forEach(s=>s.items=s.items.filter(x=>x!==id));
}
function applyLayoutDrop(d,target,dragId,kind,beforeId){
  removeFromContainers(d,dragId,kind);
  if(target.dataset.sortlist==='secitems'){
    const sec=d.sections.find(s=>s.id===target.dataset.sid);if(!sec)return;
    const idx=beforeId?sec.items.indexOf(beforeId):sec.items.length;
    sec.items.splice(idx<0?sec.items.length:idx,0,dragId);
  }else{
    const node={kind,id:dragId};
    const idx=beforeId?d.layout.findIndex(n=>n.id===beforeId&&n.kind===(kind==='section'?'section':'item')):-1;
    if(idx>=0)d.layout.splice(idx,0,node);else d.layout.push(node);
  }
  const owner={};d.sections.forEach(s=>s.items.forEach(id=>owner[id]=s.id));
  d.items.forEach(i=>i.sectionId=owner[i.id]||null);
  save();render();
}
document.addEventListener('dragstart',e=>{
  const h=e.target.closest&&e.target.closest('[data-drag]');if(!h)return;
  const listEl=h.closest('[data-sortlist]');if(!listEl)return;
  dragCtx={id:h.dataset.drag,list:listEl.dataset.sortlist,kind:h.dataset.dragkind||'item',mid:listEl.dataset.mid,did:listEl.dataset.did,sid:listEl.dataset.sid};
  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',h.dataset.drag)}catch{}
  const card=listEl.querySelector(`:scope > [data-drag="${h.dataset.drag}"]`);
  if(card)requestAnimationFrame(()=>card.classList.add('dragging'));
});
document.addEventListener('dragover',e=>{
  if(!dragCtx)return;
  const list=e.target.closest&&e.target.closest('[data-sortlist]');
  if(!list||!dragAllowed(list))return;
  e.preventDefault();clearDropMarks();
  const cards=[...list.querySelectorAll(':scope > [data-drag]')].filter(c=>c.dataset.drag!==dragCtx.id);
  const after=cards.find(c=>{const r=c.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  if(after)after.classList.add('drop-before');else list.classList.add('drop-end');
});
document.addEventListener('drop',e=>{
  if(!dragCtx)return;
  const list=e.target.closest&&e.target.closest('[data-sortlist]');
  if(!list||!dragAllowed(list)){clearDropMarks();return}
  e.preventDefault();
  const before=list.querySelector(':scope > .drop-before');
  const mid=list.dataset.mid,did=list.dataset.did,l=list.dataset.sortlist,ctx=dragCtx;
  clearDropMarks();dragCtx=null;
  if(l==='modules'||l==='discs'||l==='items'){
    const ids=[...list.querySelectorAll(':scope > [data-drag]')].map(c=>c.dataset.drag).filter(id=>id!==ctx.id);
    if(before)ids.splice(ids.indexOf(before.dataset.drag),0,ctx.id);else ids.push(ctx.id);
    applyOrder(l,mid,did,ids);
  }else if(l==='inboxsec'){
    const ids=[...list.querySelectorAll(':scope > [data-drag]')].map(c=>c.dataset.drag).filter(id=>id!==ctx.id);
    if(before)ids.splice(ids.indexOf(before.dataset.drag),0,ctx.id);else ids.push(ctx.id);
    applyInboxSecOrder(list.dataset.sid,ids);
  }else if(l==='inboxlayout'){
    applyInboxLayoutDrop(ctx.id,ctx.kind,before?before.dataset.drag:null);
  }else{
    const d=findD(findM(mid),did);if(!d)return;
    applyLayoutDrop(d,list,ctx.id,ctx.kind,before?before.dataset.drag:null);
  }
});
document.addEventListener('dragend',()=>{clearDropMarks();document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));dragCtx=null});

// #region Привязка полей (автосохранение без перерендера)
function applyBind(path,val,el){
  const p=path.split('.'),k=p.shift();
  if(k==='course'){state.course[p[0]]=val}
  else if(k==='profile'){state.profile[p[0]]=p[0]==='bio'?val.slice(0,200):val}
  else if(k==='comp'){const c=state.competencies.find(x=>x.id===p[0]);if(c)c.name=val.slice(0,40)}
  else if(k==='module'){const m=findM(p[0]);if(!m)return;m[p[1]]=p[1]==='description'?val.slice(0,200):val}
  else if(k==='disc'){const d=findD(findM(p[0]),p[1]);if(d)d[p[2]]=val}
  else if(k==='sec'){const d=findD(findM(p[0]),p[1]);const s=d&&d.sections.find(x=>x.id===p[2]);if(s)s.name=val}
  else if(k==='item'){const i=findI(findD(findM(p[0]),p[1]),p[2]);if(i)i[p[3]]=p[3]==='repeatDays'?(+val>0?clamp(Math.round(+val),1,365):null):val}
  else if(k==='link'||k==='ilink'){const i=findI(findD(findM(p[0]),p[1]),p[2]);const l=i&&i.links.find(x=>x.id===p[3]);if(l)l[p[4]]=val}
  else if(k==='crit'){const i=findI(findD(findM(p[0]),p[1]),p[2]);const c=i&&i.criteria.find(x=>x.id===p[3]);if(c)c.text=val}
  else if(k==='proj'){const m=findM(p[0]);if(m)m.project[p[1]]=val}
  else if(k==='preq'||k==='pcrit'){const m=findM(p[0]);if(!m)return;const arr=k==='preq'?m.project.requirements:m.project.criteria;const it=arr.find(x=>x.id===p[1]);if(it)it.text=val}
  else if(k==='pref'){const m=findM(p[0]);const r=m&&m.project.refs.find(x=>x.id===p[1]);if(r)r[p[2]]=val}
  if(el&&el.dataset.counter){const c=$(el.dataset.counter);if(c)c.textContent=`${val.length} / ${el.maxLength>0?el.maxLength:'∞'}`}
}

  if(e.key==='Escape'){if(pop)closePopover();else if(modalCtx)closeModal();return}
  if(e.target.id==='tag-input'){
    const m=findM(e.target.dataset.mid);if(!m)return;
    if(e.key==='Enter'||e.key===','){
      e.preventDefault();
      const v=e.target.value.trim().replace(/^#/,'').slice(0,16);
      if(!v)return;
      if(m.tags.length+m.compTags.length>=6){toast('Максимум 6 тегов',{type:'info'});return}
      if(m.tags.includes(v)){e.target.value='';return}
      m.tags.push(v);save();
      const box=$('#tags-box');if(box){box.outerHTML=tagsBoxHtml(m);icons();const inp=$('#tag-input');if(inp)inp.focus()}
    }else if(e.key==='Backspace'&&!e.target.value&&m.tags.length){
      m.tags.pop();save();
      const box=$('#tags-box');if(box){box.outerHTML=tagsBoxHtml(m);icons();const inp=$('#tag-input');if(inp)inp.focus()}
    }
  }
});

  case 'tr-clear':{

  case 'pp-prev':case 'pp-next':{if(!pop)break;const mo=pop.meta.month;mo.m+=a==='pp-next'?1:-1;if(mo.m<0){mo.m=11;mo.y--}if(mo.m>11){mo.m=0;mo.y++}refreshPopover(datePopHtml(pop.meta));break}

  case 'open-icon':{

  case 'expand-view':{const id=ds.iid;ui.viewExpanded.has(id)?ui.viewExpanded.delete(id):ui.viewExpanded.add(id);render();break}
  case 'expand-item':ui.expanded.has(ds.id)?ui.expanded.delete(ds.id):ui.expanded.add(ds.id);render();break;
  case 'move':{
    const arr=sortArray(ds.list,ds.mid,ds.did);if(!arr)break;
    const idx=arr.findIndex(x=>x.id===ds.id),to=idx+ +ds.dir;
    if(idx<0||to<0||to>=arr.length)break;
    const[t]=arr.splice(idx,1);arr.splice(to,0,t);save();render();break}
  case 'add-link':case 'add-crit':case 'add-req':case 'add-pcrit':case 'add-pref':{

  case 'grade-save':saveGrade();break;
  case 'grade-clear':{

// #region Импорт и экспорт JSON
function exportData(){
  try{
    const payload={app:'larpdeez',version:3,exportedAt:new Date().toISOString(),data:state};
    const blob=new Blob([JSON.stringify(payload,null,2)],{type:'application/json'});
    const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`larpdeez-${today()}.json`;
    document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(a.href),4000);
    toast('Резервная копия выгружена',{type:'success'});
  }catch{toast('Не удалось выгрузить данные',{type:'error'})}
}
async function importFile(file){
  if(!file)return;
  let parsed;
  try{parsed=JSON.parse(await file.text())}
  catch{toast('Файл повреждён: это не корректный JSON. Данные не изменены.',{type:'error',duration:6000});return}
  const raw=parsed&&typeof parsed==='object'&&parsed.data?parsed.data:parsed;
  if(!raw||typeof raw!=='object'||Array.isArray(raw)||(!Array.isArray(raw.modules)&&!raw.course)){
    toast('Файл не похож на резервную копию larpdeez. Данные не изменены.',{type:'error',duration:6000});return;
  }
  let next;
  try{next=normalize(raw)}catch{toast('Не удалось разобрать структуру файла. Данные не изменены.',{type:'error'});return}
  openConfirm('Импортировать данные?',`В файле: ${next.modules.length} ${plural(next.modules.length,['модуль','модуля','модулей'])}, ${next.events.length} ${plural(next.events.length,['событие','события','событий'])}. Текущие данные будут заменены.`,()=>{
    state=next;applyTheme();
    if(!save()){toast('Данные импортированы, но не поместились в хранилище целиком.',{type:'error',duration:7000})}
    ui.weekAnchor=null;location.hash='#/';render({top:true});
    toast('Импорт завершён',{type:'success'});
  },'Импортировать');
}

// #region Drag-and-drop сортировка (курсы + входящие)
let dragCtx=null;
function clearDropMarks(){document.querySelectorAll('.drop-before').forEach(x=>x.classList.remove('drop-before'));document.querySelectorAll('.drop-end').forEach(x=>x.classList.remove('drop-end'))}
function sortArray(list,mid,did){
  if(list==='modules')return state.modules;
  if(list==='discs'){const m=findM(mid);return m?m.disciplines:null}
  if(list==='items'){const d=findD(findM(mid),did);return d?d.items:null}
  return null;
}
function applyOrder(list,mid,did,ids){const arr=sortArray(list,mid,did);if(!arr)return;arr.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));save();render()}
const findInboxSec=id=>state.inboxSections.find(s=>s.id===id);
// Порядок элементов внутри раздела входящих
function applyInboxSecOrder(sid,ids){
  const sec=findInboxSec(sid);if(!sec)return;
  sec.items.sort((a,b)=>ids.indexOf(a)-ids.indexOf(b));
  save();render();
}
// Перенос узла в корневом списке входящих (материалы и разделы)
function applyInboxLayoutDrop(dragId,kind,beforeId){
  const rem=(id,isSec)=>{
    if(isSec)state.inboxLayout=state.inboxLayout.filter(n=>!(n.kind==='section'&&n.id===id));
    else{
      state.inboxLayout=state.inboxLayout.filter(n=>!(n.kind==='item'&&n.id===id));
      state.inboxSections.forEach(s=>s.items=s.items.filter(x=>x!==id));
    }
  };
  rem(dragId,kind==='section');
  const node={kind:kind==='section'?'section':'item',id:dragId};
  const idx=beforeId?state.inboxLayout.findIndex(n=>n.id===beforeId&&n.kind===node.kind):-1;
  if(idx>=0)state.inboxLayout.splice(idx,0,node);else state.inboxLayout.push(node);
  save();render();
}
function dragAllowed(target){
  if(!dragCtx)return false;
  const tl=target.dataset.sortlist;
  if(dragCtx.list==='modules'||dragCtx.list==='discs')return tl===dragCtx.list;
  if(dragCtx.list==='inboxlayout')return tl==='inboxlayout';
  if(dragCtx.list==='inboxsec')return tl==='inboxsec'&&target.dataset.sid===dragCtx.sid;
  if(dragCtx.mid!==target.dataset.mid||dragCtx.did!==target.dataset.did)return false;
  if(dragCtx.kind==='section')return tl==='layout';
  return tl==='layout'||tl==='secitems';
}
function removeFromContainers(d,id,kind){
  if(kind==='section'){d.layout=d.layout.filter(n=>!(n.kind==='section'&&n.id===id));return}
  d.layout=d.layout.filter(n=>!(n.kind==='item'&&n.id===id));
  d.sections.forEach(s=>s.items=s.items.filter(x=>x!==id));
}
function applyLayoutDrop(d,target,dragId,kind,beforeId){
  removeFromContainers(d,dragId,kind);
  if(target.dataset.sortlist==='secitems'){
    const sec=d.sections.find(s=>s.id===target.dataset.sid);if(!sec)return;
    const idx=beforeId?sec.items.indexOf(beforeId):sec.items.length;
    sec.items.splice(idx<0?sec.items.length:idx,0,dragId);
  }else{
    const node={kind,id:dragId};
    const idx=beforeId?d.layout.findIndex(n=>n.id===beforeId&&n.kind===(kind==='section'?'section':'item')):-1;
    if(idx>=0)d.layout.splice(idx,0,node);else d.layout.push(node);
  }
  const owner={};d.sections.forEach(s=>s.items.forEach(id=>owner[id]=s.id));
  d.items.forEach(i=>i.sectionId=owner[i.id]||null);
  save();render();
}
document.addEventListener('dragstart',e=>{
  const h=e.target.closest&&e.target.closest('[data-drag]');if(!h)return;
  const listEl=h.closest('[data-sortlist]');if(!listEl)return;
  dragCtx={id:h.dataset.drag,list:listEl.dataset.sortlist,kind:h.dataset.dragkind||'item',mid:listEl.dataset.mid,did:listEl.dataset.did,sid:listEl.dataset.sid};
  try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',h.dataset.drag)}catch{}
  const card=listEl.querySelector(`:scope > [data-drag="${h.dataset.drag}"]`);
  if(card)requestAnimationFrame(()=>card.classList.add('dragging'));
});
document.addEventListener('dragover',e=>{
  if(!dragCtx)return;
  const list=e.target.closest&&e.target.closest('[data-sortlist]');
  if(!list||!dragAllowed(list))return;
  e.preventDefault();clearDropMarks();
  const cards=[...list.querySelectorAll(':scope > [data-drag]')].filter(c=>c.dataset.drag!==dragCtx.id);
  const after=cards.find(c=>{const r=c.getBoundingClientRect();return e.clientY<r.top+r.height/2});
  if(after)after.classList.add('drop-before');else list.classList.add('drop-end');
});
document.addEventListener('drop',e=>{
  if(!dragCtx)return;
  const list=e.target.closest&&e.target.closest('[data-sortlist]');
  if(!list||!dragAllowed(list)){clearDropMarks();return}
  e.preventDefault();
  const before=list.querySelector(':scope > .drop-before');
  const mid=list.dataset.mid,did=list.dataset.did,l=list.dataset.sortlist,ctx=dragCtx;
  clearDropMarks();dragCtx=null;
  if(l==='modules'||l==='discs'||l==='items'){
    const ids=[...list.querySelectorAll(':scope > [data-drag]')].map(c=>c.dataset.drag).filter(id=>id!==ctx.id);
    if(before)ids.splice(ids.indexOf(before.dataset.drag),0,ctx.id);else ids.push(ctx.id);
    applyOrder(l,mid,did,ids);
  }else if(l==='inboxsec'){
    const ids=[...list.querySelectorAll(':scope > [data-drag]')].map(c=>c.dataset.drag).filter(id=>id!==ctx.id);
    if(before)ids.splice(ids.indexOf(before.dataset.drag),0,ctx.id);else ids.push(ctx.id);
    applyInboxSecOrder(list.dataset.sid,ids);
  }else if(l==='inboxlayout'){
    applyInboxLayoutDrop(ctx.id,ctx.kind,before?before.dataset.drag:null);
  }else{
    const d=findD(findM(mid),did);if(!d)return;
    applyLayoutDrop(d,list,ctx.id,ctx.kind,before?before.dataset.drag:null);
  }
});
document.addEventListener('dragend',()=>{clearDropMarks();document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));dragCtx=null});
// #endregion

// #region Привязка полей (автосохранение без перерендера)
function applyBind(path,val,el){
  const p=path.split('.'),k=p.shift();
  if(k==='course'){state.course[p[0]]=val}
  else if(k==='profile'){state.profile[p[0]]=p[0]==='bio'?val.slice(0,200):val}
  else if(k==='comp'){const c=state.competencies.find(x=>x.id===p[0]);if(c)c.name=val.slice(0,40)}
  else if(k==='module'){const m=findM(p[0]);if(!m)return;m[p[1]]=p[1]==='description'?val.slice(0,200):val}
  else if(k==='disc'){const d=findD(findM(p[0]),p[1]);if(d)d[p[2]]=val}
  else if(k==='sec'){const d=findD(findM(p[0]),p[1]);const s=d&&d.sections.find(x=>x.id===p[2]);if(s)s.name=val}
  else if(k==='item'){const i=findI(findD(findM(p[0]),p[1]),p[2]);if(i)i[p[3]]=p[3]==='repeatDays'?(+val>0?clamp(Math.round(+val),1,365):null):val}
  else if(k==='link'||k==='ilink'){const i=findI(findD(findM(p[0]),p[1]),p[2]);const l=i&&i.links.find(x=>x.id===p[3]);if(l)l[p[4]]=val}
  else if(k==='crit'){const i=findI(findD(findM(p[0]),p[1]),p[2]);const c=i&&i.criteria.find(x=>x.id===p[3]);if(c)c.text=val}
  else if(k==='proj'){const m=findM(p[0]);if(m)m.project[p[1]]=val}
  else if(k==='preq'||k==='pcrit'){const m=findM(p[0]);if(!m)return;const arr=k==='preq'?m.project.requirements:m.project.criteria;const it=arr.find(x=>x.id===p[1]);if(it)it.text=val}
  else if(k==='pref'){const m=findM(p[0]);const r=m&&m.project.refs.find(x=>x.id===p[1]);if(r)r[p[2]]=val}
  if(el&&el.dataset.counter){const c=$(el.dataset.counter);if(c)c.textContent=`${val.length} / ${el.maxLength>0?el.maxLength:'∞'}`}
}
document.addEventListener('input',e=>{
  if(e.target.id==='hs-input'||e.target.id==='ms-input'){searchState.q=e.target.value;searchState.open=true;searchState.active=-1;searchSoon();return}

  const b=e.target.closest('[data-bind]');

  const ibc=e.target.closest('[data-inb-crit]');
  if(ibc&&modalCtx&&modalCtx.type==='inbox'){const[cid,f]=ibc.dataset.inbCrit.split('.');const c=(modalCtx.draft.criteria||[]).find(x=>x.id===cid);if(c)c[f]=ibc.value;return}
  const pl=e.target.closest('[data-plan]');

  if(e.target.id==='icon-filter'&&pop){const g=$('#icon-grid');if(g){g.innerHTML=iconGridHtml(e.target.value,pop.meta.current);icons()}}
});
document.addEventListener('focusout',e=>{const t=e.target.closest('.time-input');if(!t)return;const p=parseHM(t.value);if(p)t.value=p;});
document.addEventListener('change',e=>{

  if(e.target.hasAttribute('data-evt-allday')&&modalCtx&&modalCtx.type==='event'){modalCtx.draft.allDay=e.target.checked;document.querySelectorAll('.time-sel .time-input').forEach(i=>i.disabled=e.target.checked);return}

    const row=ics.closest('.ics-row');if(row)row.classList.toggle('on',ics.checked);

document.addEventListener('keydown',e=>{

// #region GitHub-синхронизация: сейф, шифрование, репозиторий
const GH={cfgKey:'ldz-gh-config',cfg:null,owner:'',repo:'',path:'vault.json',token:'',dek:null,vault:null,sha:null,ready:false,dirty:false,updatedAt:0,iterations:210000,_t:null};
const ghEnc=new TextEncoder(),ghDec=new TextDecoder();
function ghB64(buf){const u=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function ghUnB64(str){const s=atob(String(str).replace(/\s/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function ghRecovery(){const h=[...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();return'LDZ-'+h.match(/.{4}/g).join('-')}
async function ghDerive(secret,salt){const km=await crypto.subtle.importKey('raw',ghEnc.encode(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:GH.iterations,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function ghWrap(dek,secret){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await ghDerive(secret,salt),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,dek);return{salt:ghB64(salt),iv:ghB64(iv),ct:ghB64(ct)}}
async function ghUnwrap(w,secret){const key=await ghDerive(secret,ghUnB64(w.salt));return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ghUnB64(w.iv)},key,ghUnB64(w.ct)))}
async function ghEncryptData(obj){const iv=crypto.getRandomValues(new Uint8Array(12)),key=await crypto.subtle.importKey('raw',GH.dek,{name:'AES-GCM'},false,['encrypt']),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,ghEnc.encode(JSON.stringify(obj)));return{iv:ghB64(iv),ct:ghB64(ct)}}
async function ghDecryptData(d){const key=await crypto.subtle.importKey('raw',GH.dek,{name:'AES-GCM'},false,['decrypt']);return JSON.parse(ghDec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ghUnB64(d.iv)},key,ghUnB64(d.ct))))}
function ghUrl(){return`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path.split('/').map(encodeURIComponent).join('/')}`}
function ghHeaders(){return{Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}
function ghOverlay(html){let el=$('#gh-lock');if(!el){el=document.createElement('div');el.id='gh-lock';document.body.appendChild(el)}el.innerHTML=html;document.body.classList.add('gh-locked');icons();return el}
function ghHideOverlay(){const el=$('#gh-lock');if(el)el.remove();document.body.classList.remove('gh-locked')}
function ghSetSync(s){const el=$('#cloud-status');if(el){el.dataset.state=s;el.textContent={ok:'Синхронизировано',save:'Сохранение…',err:'Ошибка GitHub',off:'Локальный режим'}[s]||s}}
async function ghUnlockVault(v,login,secret){
  let dek=null;
  if(login===v.login){try{dek=await ghUnwrap(v.main,secret)}catch{}}
  if(!dek){try{dek=await ghUnwrap(v.recovery,secret)}catch{}}
  if(!dek)throw new Error('Неверный логин, пароль или запасной код');
  GH.dek=dek;return ghDecryptData(v.data);
}
GH.push=function(){if(!this.ready)return;this.dirty=true;clearTimeout(this._t);this._t=setTimeout(()=>this.pushNow(),1500)}
GH.pushNow=async function(){if(!this.ready||!this.dek||!this.vault)return;ghSetSync('save');try{const v={...this.vault,data:await ghEncryptData(state),updatedAt:Date.now()};await ghWriteVault(v);this.vault=v;this.dirty=false;ghSetSync('ok')}catch(e){ghSetSync('err');toast('GitHub: '+(e.message||'ошибка сохранения'),{type:'error'})}}
GH.pull=async function(){if(!this.ready||!this.dek)return;try{const v=await ghReadVault();if(v&&v.updatedAt>this.updatedAt){const data=await ghDecryptData(v.data);this.vault=v;this.updatedAt=v.updatedAt;state=normalize(data);try{localStorage.setItem(KEY,JSON.stringify(state))}catch{};applyTheme();render();ghSetSync('ok')}}catch{ghSetSync('err')}}
GH.unwrapCurrent=async function(secret){try{return await ghUnwrap(this.vault.main,secret)}catch{return await ghUnwrap(this.vault.recovery,secret)}}
GH.changeAccess=async function(login,currentPassword,password){const dek=await this.unwrapCurrent(currentPassword);if(password)this.vault.main=await ghWrap(dek,password);if(login)this.vault.login=login;this.vault.updatedAt=Date.now();await ghWriteVault(this.vault)}
GH.newRecovery=async function(currentPassword){const dek=await this.unwrapCurrent(currentPassword),code=ghRecovery();this.vault.recovery=await ghWrap(dek,code);this.vault.updatedAt=Date.now();await ghWriteVault(this.vault);return code}
function bindCloudPanel(){
  const p=$('#cloud-panel');if(!p)return;
  if(!GH.cfg){p.innerHTML='<div class="panel-title"><i data-lucide="github"></i>GitHub-хранилище</div><p class="hint">Сейф не подключён в этом браузере.</p>';icons();return}
  ghSetSync(GH.dirty?'save':'ok');
  const r=$('#gh-repo-label');if(r)r.textContent=GH.owner+'/'+GH.repo;
  const l=$('#cl-login');if(l)l.value=(GH.vault&&GH.vault.login)||'admin';

async function ghFetch(url,opts={},ms=20000){
  const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
  try{return await fetch(url,{...opts,signal:c.signal})}
  catch(e){throw new Error(e.name==='AbortError'?'GitHub не ответил за 20 секунд. Проверьте сеть или откройте api.github.com через VPN.':'Нет связи с api.github.com: '+(e.message||'сеть'))}
  finally{clearTimeout(t)}
}
async function ghReadVault(){
  const r=await ghFetch(ghUrl(),{headers:ghHeaders(),cache:'no-store'});
  if(r.status===404)return null;
  if(r.status===401)throw new Error('Токен неверный или истёк.');
  if(r.status===403)throw new Error('Нет доступа. Токен должен быть выдан для '+GH.owner+'/'+GH.repo+' с Contents: Read and write.');
  if(!r.ok)throw new Error('GitHub вернул '+r.status);
  const j=await r.json();GH.sha=j.sha;
  const v=JSON.parse(ghDec.decode(ghUnB64(j.content)));
  if(!v||v.app!=='larpdeez-vault')throw new Error('Файл '+GH.path+' не является сейфом larpdeez.');
  return v;
}
async function ghWriteVault(v){

  let r=await ghFetch(ghUrl(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(mk(GH.sha))});
  if(r.status===409){await ghReadVault();r=await ghFetch(ghUrl(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(mk(GH.sha))})}
  if(r.status===401||r.status===403)throw new Error('Нет прав на запись. В токене нужно Contents: Read and write для '+GH.owner+'/'+GH.repo+'.');
  if(r.status===404)throw new Error('Репозиторий не найден. Проверьте владельца и название репозитория.');
  if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||'GitHub '+r.status)}

}

const GH_DEFAULTS={owner:'damurcheg',repo:'larpdeez-data',path:'vault.json'};
const GH_SESSION_DAYS=90;
function ghIdbOpen(){return new Promise((res,rej)=>{const r=indexedDB.open('ldz-secure',1);r.onupgradeneeded=()=>{const db=r.result;if(!db.objectStoreNames.contains('kv'))db.createObjectStore('kv')};r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)})}
async function ghIdbGet(k){try{const db=await ghIdbOpen();return await new Promise((res,rej)=>{const q=db.transaction('kv','readonly').objectStore('kv').get(k);q.onsuccess=()=>res(q.result||null);q.onerror=()=>rej(q.error)})}catch{return null}}
async function ghIdbSet(k,v){try{const db=await ghIdbOpen();return await new Promise((res,rej)=>{const q=db.transaction('kv','readwrite').objectStore('kv').put(v,k);q.onsuccess=()=>res(true);q.onerror=()=>rej(q.error)})}catch{return false}}
async function ghIdbDel(k){try{const db=await ghIdbOpen();return await new Promise((res,rej)=>{const q=db.transaction('kv','readwrite').objectStore('kv').delete(k);q.onsuccess=()=>res(true);q.onerror=()=>rej(q.error)})}catch{return false}}
async function ghSessionSave(dek){
  try{
    const key=await crypto.subtle.generateKey({name:'AES-GCM',length:256},false,['encrypt','decrypt']);
    const iv=crypto.getRandomValues(new Uint8Array(12));
    const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,dek);
    const a=await ghIdbSet('deviceKey',key),b=await ghIdbSet('dek',{iv:ghB64(iv),ct:ghB64(ct),at:Date.now()});
    return a&&b;
  }catch{return false}
}
async function ghSessionRead(){
  try{
    const key=await ghIdbGet('deviceKey'),box=await ghIdbGet('dek');
    if(!key||!box)return null;
    if(Date.now()-(box.at||0)>GH_SESSION_DAYS*86400000){await ghSessionClear();return null}
    return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ghUnB64(box.iv)},key,ghUnB64(box.ct)));
  }catch{return null}
}
async function ghSessionClear(){await ghIdbDel('deviceKey');await ghIdbDel('dek')}

GH.boot=function(){
  return new Promise(async resolve=>{
    let cfg=null;
    try{cfg=JSON.parse(localStorage.getItem(GH.cfgKey))}catch{}
    if(!cfg||!cfg.owner||!cfg.repo)cfg=await ghIdbGet('cfg');
    if(!cfg||!cfg.owner||!cfg.repo)cfg={owner:GH_DEFAULTS.owner,repo:GH_DEFAULTS.repo,path:GH_DEFAULTS.path,token:''};
    if(!cfg.owner||!cfg.repo)return resolve(await ghSetup());
    Object.assign(GH,{owner:cfg.owner,repo:cfg.repo,path:cfg.path||'vault.json',token:cfg.token||''});
    GH.cfg=cfg;
    if(!GH.token)return resolve(await ghTokenScreen('В этом браузере нет токена GitHub. Вставьте его один раз — дальше вход будет по паролю.'));
    let v=null;
    try{v=await ghReadVault()}catch(e){return resolve(await ghTokenScreen(e.message))}
    if(!v)return resolve(await ghSetup('Файл '+GH.path+' не найден в '+GH.owner+'/'+GH.repo+'. Если репозиторий другой — укажите его. Создавайте новый сейф, только если данных точно нет.'));
    GH.vault=v;GH.updatedAt=v.updatedAt||0;
    const dek=await ghSessionRead();
    if(dek){
      try{
        GH.dek=dek;
        const data=await ghDecryptData(v.data);
        GH.ready=true;
        ghCfgSave({owner:GH.owner,repo:GH.repo,path:GH.path,token:GH.token});
        await ghSessionSave(dek);
        ghHideOverlay();ghSetSync('ok');
        return resolve(data);
      }catch{GH.dek=null;await ghSessionClear()}
    }
    return resolve(await ghLock(v));
  });
}

const normSearch=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9\s]/g,' ').replace(/\s+/g,' ').trim();
function prefixDist(a,b,max){
  const la=a.length,lb=b.length;
  if(la-lb>max)return max+1;
  let prev=new Array(lb+1),cur=new Array(lb+1);
  for(let j=0;j<=lb;j++)prev[j]=j;
  for(let i=1;i<=la;i++){
    cur[0]=i;let best=i;
    for(let j=1;j<=lb;j++){
      cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
      if(cur[j]<best)best=cur[j];
    }
    if(best>max)return max+1;
    const t=prev;prev=cur;cur=t;
  }
  return Math.min.apply(null,prev);
}
function bestPrefixDist(words,q){
  if(q.length<3)return null;
  const allow=q.length<=4?1:2;
  let best=null;
  for(const w of words){
    if(w.length<3)continue;
    const d=prefixDist(q,w,allow);
    if(d>allow)continue;
    if(d>=2&&w[0]!==q[0])continue;
    if(best===null||d<best)best=d;
  }
  return best;
}
function scoreOne(e,p){
  const t=normSearch(e.title),words=t.split(' ').filter(Boolean);
  let s=0;
  if(t===p)s=1200;
  else if(t.startsWith(p))s=1000-Math.min(60,t.length-p.length);
  else if(words.some(w=>w.startsWith(p)))s=900;
  else if(t.includes(p))s=760;
  else{const d=bestPrefixDist(words,p);if(d!==null)s=700-d*70}
  if(!s){
    const mod=normSearch(e.mod),disc=normSearch(e.disc);
    if(mod.includes(p))s=380;
    else if(disc.includes(p))s=360;
    else if(normSearch(e.extra).includes(p))s=330;
    else if(normSearch(e.desc).includes(p))s=300;
    else{const d2=bestPrefixDist((mod+' '+disc).split(' ').filter(Boolean),p);if(d2!==null)s=280-d2*60}
  }else{
    if(normSearch(e.mod).includes(p))s+=50;
    if(normSearch(e.disc).includes(p))s+=40;
  }
  return s;
}
function scoreEntry(e,nq){
  const parts=nq.split(' ').filter(Boolean);
  if(!parts.length)return 0;
  let total=0;
  for(const p of parts){const s=scoreOne(e,p);if(!s)return 0;total+=s}
  return total;
}
function searchRun(q){
  const nq=normSearch(q);

  searchIndex().forEach(e=>{const s=scoreEntry(e,nq);if(s>0)out.push(Object.assign({},e,{score:s}))});
  out.sort((a,b)=>b.score-a.score||a.title.length-b.title.length||a.title.localeCompare(b.title,'ru'));
  return out.slice(0,40);
}

function openMenu(btn){
  openPopover(btn,menuHtml(),'menu-pop',{type:'menu'});
  const old=$('#menu-scrim');if(old)old.remove();
  const scrim=document.createElement('div');
  scrim.id='menu-scrim';
  scrim.addEventListener('click',ev=>{ev.preventDefault();ev.stopPropagation();closePopover()});
  document.body.appendChild(scrim);
  requestAnimationFrame(()=>scrim.classList.add('on'));
  btn.setAttribute('aria-expanded','true');
  if(pop){
    const r=btn.getBoundingClientRect(),w=pop.el.offsetWidth;
    pop.el.style.left=Math.max(10,Math.min(r.right-w,innerWidth-w-10))+'px';

document.addEventListener('focusin',e=>{
  if(e.target.id==='hs-input'&&(searchState.q||'').trim().length>=2){searchState.open=true;searchRefresh()}
});
document.addEventListener('pointerdown',e=>{
  if(!searchState.open)return;
  const box=$('#hsearch'),drop=$('#hs-drop');
  if(box&&box.contains(e.target))return;
  if(drop&&drop.contains(e.target))return;
  closeSearch();
},true);
document.addEventListener('keydown',e=>{
  const id=e.target&&e.target.id;
  if(id!=='hs-input'&&id!=='ms-input'){if(e.key==='Escape'&&searchState.open)closeSearch();return}
  if(e.key==='Escape'){e.preventDefault();closeSearch();e.target.blur();return}
  if(e.key==='ArrowDown'||e.key==='ArrowUp'){
    if(!searchState.items.length)return;
    e.preventDefault();
    const n=searchState.items.length;
    searchState.active=e.key==='ArrowDown'?(searchState.active+1)%n:(searchState.active<=0?n-1:searchState.active-1);
    searchState.open=true;searchRefresh();
    const el=document.querySelector('.s-item.active');if(el)el.scrollIntoView({block:'nearest'});
    return;
  }
  if(e.key==='Enter'){e.preventDefault();const x=searchState.items[searchState.active>=0?searchState.active:0];if(x)searchGo(x)}
});

let sessMilestone=0,sessTick=null;
function ensureV4(){
  if(!state)return;
  const p=state.profile;state.profile=(p&&typeof p==='object')?p:{};
  ['name','avatar','specialization','bio'].forEach(k=>{if(typeof state.profile[k]!=='string')state.profile[k]=''});
  if(!COLORS[state.profile.avatarColor])state.profile.avatarColor='yellow';
  ['competencies','inbox','favorites','sessions','plan'].forEach(k=>{if(!Array.isArray(state[k]))state[k]=[]});
  if(!state.achievements||typeof state.achievements!=='object'||Array.isArray(state.achievements))state.achievements={};
  if(state.activeSession&&!(+state.activeSession.startedAt>0))state.activeSession=null;
  const cids=new Set(state.competencies.map(c=>c.id));
  state.events.forEach(e=>{if(!Array.isArray(e.links))e.links=[];if(typeof e.allDay!=='boolean')e.allDay=false;if(e.sourceItemId===undefined)e.sourceItemId=null});
  state.modules.forEach(m=>{
    if(!Array.isArray(m.compTags))m.compTags=[];m.compTags=m.compTags.filter(id=>cids.has(id));
    if(!Array.isArray(m.project.compIds))m.project.compIds=[];m.project.compIds=m.project.compIds.filter(id=>cids.has(id)).slice(0,6);
    m.disciplines.forEach(d=>{
      if(!Array.isArray(d.sections))d.sections=[];
      if(!Array.isArray(d.layout))d.layout=[];
      const ids=new Set(d.items.map(i=>i.id)),seenS=new Set();
      d.sections=d.sections.filter(s=>s&&typeof s==='object'&&!seenS.has(s.id)&&seenS.add(s.id));
      const inSec=new Set();
      d.sections.forEach(s=>{if(typeof s.name!=='string')s.name='Раздел';if(!Array.isArray(s.items))s.items=[];s.items=s.items.filter(id=>ids.has(id)&&!inSec.has(id)&&inSec.add(id))});
      const seenL=new Set();
      d.layout=d.layout.filter(n=>{if(!n||typeof n!=='object')return false;const ok=n.kind==='section'?d.sections.some(s=>s.id===n.id):(n.kind==='item'&&ids.has(n.id)&&!inSec.has(n.id));const k=n.kind+':'+n.id;return ok&&!seenL.has(k)&&seenL.add(k)});
      d.sections.forEach(s=>{if(!d.layout.some(n=>n.kind==='section'&&n.id===s.id))d.layout.push({kind:'section',id:s.id})});
      d.items.forEach(i=>{if(!inSec.has(i.id)&&!d.layout.some(n=>n.kind==='item'&&n.id===i.id))d.layout.push({kind:'item',id:i.id})});
      const owner={};d.sections.forEach(s=>s.items.forEach(id=>owner[id]=s.id));
      d.items.forEach(i=>{if(!Array.isArray(i.compIds))i.compIds=[];i.compIds=i.compIds.filter(id=>cids.has(id)).slice(0,3);i.sectionId=owner[i.id]||null;if(i.repeatDays===undefined)i.repeatDays=null;if(i.repeatEventId===undefined)i.repeatEventId=null});
    });
  });
  repairInbox(state);
  state.favorites=state.favorites.filter(f=>f&&f.key&&favTarget(f.key));
  const evIds=new Set(state.events.map(e=>e.id));
  state.modules.forEach(m=>m.disciplines.forEach(d=>d.items.forEach(i=>{if(i.repeatEventId&&!evIds.has(i.repeatEventId))i.repeatEventId=null})));
  checkAchievements(true);
}
function levelOf(p){return p<25?0:p<50?1:p<75?2:p<90?3:4}
function compStats(){
  const map=new Map(state.competencies.map(c=>[c.id,{c,earned:0,max:0,topics:0,topicsDone:0,tasks:0,tasksDone:0,projects:0,projectsDone:0}]));
  const add=(ids,w,done,kind)=>{(ids||[]).forEach(id=>{const s=map.get(id);if(!s)return;s.max+=w;if(done)s.earned+=w;if(kind==='topic'){s.topics++;if(done)s.topicsDone++}else if(kind==='task'){s.tasks++;if(done)s.tasksDone++}else{s.projects++;if(done)s.projectsDone++}})};
  state.modules.forEach(m=>{m.disciplines.forEach(d=>d.items.forEach(i=>add(i.compIds,1,itemDone(i),i.type)));if(m.project.enabled)add(m.project.compIds,3,!!calcGrade(m.project.criteria,m.project.scores),'project')});
  return[...map.values()].map(s=>{const pct=s.max?Math.round(s.earned/s.max*100):0;return Object.assign({},s,{pct,level:levelOf(pct)})});
}
function eduLevel(){const s=compStats();if(!s.length)return null;const pct=Math.round(s.reduce((a,x)=>a+x.pct,0)/s.length);return{pct,level:levelOf(pct),n:s.length}}
function discsDoneCount(){return state.modules.reduce((a,m)=>a+m.disciplines.filter(d=>d.items.length&&d.items.every(itemDone)).length,0)}
function totalMinutes(){return state.sessions.reduce((a,s)=>a+(+s.minutes||0),0)}
function fmtMins(m){m=Math.round(m);if(m<60)return m+' мин';const h=Math.floor(m/60),mm=m%60;return h+' ч'+(mm?' '+mm+' мин':'')}
// День засчитывается при ≥1 минуте завершённых сессий (ручные отметки прошлых версий сохраняются)
function activityDays(){const s=new Set(state.studyDays);state.sessions.forEach(x=>{if(x.minutes>=1)s.add(iso(new Date(x.endedAt)))});return s}
function dayMinutes(ds){return state.sessions.reduce((a,s)=>a+(iso(new Date(s.endedAt))===ds?s.minutes:0),0)}
function daySessions(ds){return state.sessions.filter(s=>iso(new Date(s.endedAt))===ds).length}
function streak(){const set=activityDays();let n=0,cur=today();if(!set.has(cur))cur=addD(cur,-1);while(set.has(cur)){n++;cur=addD(cur,-1)}return n}
function bestStreak(){const s=[...activityDays()].sort();let best=0,run=0,prev=null;for(const d of s){run=prev&&diffD(d,prev)===1?run+1:1;best=Math.max(best,run);prev=d}return best}
function readAvatar(file){
  return new Promise((res,rej)=>{
    if(!file||!/^image\//.test(file.type))return rej(new Error('Нужен файл изображения'));
    const img=new Image(),url=URL.createObjectURL(file);
    img.onload=()=>{const s=128,c=document.createElement('canvas');c.width=c.height=s;const r=Math.max(s/img.width,s/img.height);c.getContext('2d').drawImage(img,(s-img.width*r)/2,(s-img.height*r)/2,img.width*r,img.height*r);URL.revokeObjectURL(url);res(c.toDataURL('image/jpeg',.82))};
    img.onerror=()=>{URL.revokeObjectURL(url);rej(new Error('Не удалось прочитать изображение'))};
    img.src=url;
  });
}

function favTarget(key,s=state){
  const p=String(key).split(':');
  if(p[0]==='m'){const m=s.modules.find(x=>x.id===p[1]);return m?{kind:'module',title:m.name,sub:'Модуль',color:m.color,icon:m.icon,ci:true,href:'#/module/'+m.id,desc:m.description}:null}
  if(p[0]==='d'){const m=s.modules.find(x=>x.id===p[1]),d=m&&m.disciplines.find(x=>x.id===p[2]);return d?{kind:'disc',title:d.name,sub:m.name,color:d.color,icon:d.icon,ci:true,href:'#/module/'+m.id+'/discipline/'+d.id,desc:''}:null}
  if(p[0]==='i'){const m=s.modules.find(x=>x.id===p[1]),d=m&&m.disciplines.find(x=>x.id===p[2]),i=d&&d.items.find(x=>x.id===p[3]);return i?{kind:i.type,title:i.name,sub:m.name+' · '+d.name,color:d.color,icon:i.type==='task'?'clipboard-list':'book-open',href:'#/module/'+m.id+'/discipline/'+d.id,scroll:'#item-'+i.id,desc:i.description,links:i.links,criteria:i.criteria,scores:i.scores}:null}
  if(p[0]==='p'){const m=s.modules.find(x=>x.id===p[1]);return m&&m.project.enabled?{kind:'project',title:m.project.name,sub:'Финальный проект · '+m.name,color:m.color,icon:'flag',href:'#/module/'+m.id,scroll:'#project',desc:m.project.description}:null}
  if(p[0]==='e'){const e=s.events.find(x=>x.id===p[1]);return e?{kind:'event',title:e.title,sub:'Событие',color:e.color,icon:'calendar',eid:e.id,date:e.date,start:e.start,end:e.end,allDay:e.allDay,desc:e.description,links:e.links}:null}
  return null;
}

// #region График динамики оценок
function gradeHistory(){
  const f=ui.chart,out=[];
  state.modules.forEach(m=>{if(f.scope!=='course'&&f.mid!==m.id)return;m.disciplines.forEach(d=>{if(f.scope==='disc'&&f.did!==d.id)return;d.items.forEach(i=>{if(i.type!=='task')return;const g=calcGrade(i.criteria,i.scores);if(!g)return;out.push({g:g.g,letter:g.letter,title:i.name,date:i.gradedAt||null,disc:d.name})})})});
  out.sort((a,b)=>(a.date||'0000')<(b.date||'0000')?-1:(a.date||'0000')>(b.date||'0000')?1:0);
  return out;

// Плавная кривая Catmull-Rom → кубические Безье
function smoothPath(p){
  if(p.length<2)return'';
  if(p.length===2)return`M${p[0].x},${p[0].y}L${p[1].x},${p[1].y}`;
  let d=`M${p[0].x},${p[0].y}`;
  for(let i=0;i<p.length-1;i++){
    const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
    const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
    d+=`C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x},${p2.y}`;
  }
  return d;
}

function sessElapsed(){return state.activeSession?Date.now()-state.activeSession.startedAt:0}
function fmtClock(ms){const s=Math.floor(ms/1000),h=Math.floor(s/3600),m=Math.floor(s%3600/60),ss=s%60;return(h?pad(h)+':':'')+pad(m)+':'+pad(ss)}
function sessPillHtml(){const on=!!state.activeSession;return`<button class="sess-pill" id="sess-pill" data-action="sess-open" title="Учебная сессия" ${on?'':'hidden'}><i data-lucide="timer"></i><b id="sess-time">${on?fmtClock(sessElapsed()):'00:00'}</b></button>`}
function startSession(){if(state.activeSession)return;state.activeSession={startedAt:Date.now()};sessMilestone=0;save();closeModal();renderHeader();render();toast('Сессия началась — таймер в шапке',{type:'success'})}
function stopSession(){
  const a=state.activeSession;if(!a)return;
  const end=Date.now(),minutes=Math.round((end-a.startedAt)/60000);
  state.sessions.push({id:uid(),startedAt:a.startedAt,endedAt:end,minutes});state.activeSession=null;
  const day=iso(new Date(end));if(minutes>=1&&!state.studyDays.includes(day)){state.studyDays.push(day);state.studyDays.sort()}
  save();closeModal();hideSessNote();renderHeader();render();checkAchievements();
  toast(minutes>=1?'Сессия завершена · '+fmtMins(minutes)+' засчитано':'Сессия короче минуты — в серию не засчитана',{type:minutes>=1?'success':'info',duration:5000});
  if(minutes>=10)confetti();
}
function openSessModal(){
  if(!state.activeSession)return;
  const st=new Date(state.activeSession.startedAt);
  openModal(`<div class="modal-head"><h3>Учебная сессия</h3><button class="icon-btn plain sm" data-action="modal-close"><i data-lucide="x"></i></button></div><div class="modal-body" style="text-align:center"><div class="sess-big mono" id="sess-modal-time">${fmtClock(sessElapsed())}</div><p class="hint" style="margin-top:8px">Начало в ${pad(st.getHours())}:${pad(st.getMinutes())} · ${fmtLong(iso(st))}</p><p class="hint" style="margin-top:10px">Завершение засчитает время в тепловую карту и серию (от 1 минуты).</p></div><div class="modal-foot"><button class="btn btn-ghost" data-action="modal-close">Продолжить учиться</button><button class="btn btn-primary" data-action="sess-stop"><i data-lucide="square"></i>Завершить</button></div>`,{type:'session'});
}
function sessTickFn(){
  const on=!!state.activeSession,pill=$('#sess-pill');
  if(pill){
    pill.hidden=!on;
    if(on){
      const el=$('#sess-time');if(el)el.textContent=fmtClock(sessElapsed());
      const home=$('#home-sess-time');if(home)home.textContent=fmtClock(sessElapsed());
      const mt=$('#sess-modal-time');if(mt)mt.textContent=fmtClock(sessElapsed());
      const m=Math.floor(sessElapsed()/1800000);
      if(m>sessMilestone){sessMilestone=m;showSessNote(m)}
    }
  }
}
function startSessTicker(){if(sessTick)clearInterval(sessTick);sessMilestone=Math.floor(sessElapsed()/1800000);sessTick=setInterval(sessTickFn,1000);sessTickFn()}
function showSessNote(m){hideSessNote();const el=document.createElement('div');el.id='sess-note';el.innerHTML=`<i data-lucide="bell-ring"></i><span>${fmtMins(m*30)} прошло — вы в потоке!</span><button data-action="sess-note-close" aria-label="Закрыть"><i data-lucide="x"></i></button>`;document.body.appendChild(el);icons();requestAnimationFrame(()=>el.classList.add('on'));el._t=setTimeout(hideSessNote,15000)}
function hideSessNote(){const el=$('#sess-note');if(el){clearTimeout(el._t);el.classList.remove('on');setTimeout(()=>el.remove(),200)}}

        const m=p.type==='module'?findM(p.moduleId):null;const title=esc(planTitle(p));
        const link=m?`<a class="pw-link" href="#/module/${m.id}">${title}</a>`:`<b class="pw-link">${title}</b>`;
        return`<div class="pw-bar pc-${planColor(p)}"><i data-lucide="${PLAN_TYPES[p.type].icon}"></i><div class="pw-main">${link}<span class="pw-type">${PLAN_TYPES[p.type].label}</span></div><span class="pw-acts"><button class="pw-act" data-action="plan-edit" data-id="${p.id}" title="Изменить период" aria-label="Изменить период"><i data-lucide="pencil"></i></button><button class="pw-act danger" data-action="plan-del" data-id="${p.id}" title="Удалить период" aria-label="Удалить период"><i data-lucide="trash-2"></i></button></span></div>`;
      }).join(''):'<span class="pw-free">свободная неделя</span>'}</div></div>`;
    }
  }
  return`<div class="page"><a class="back-link" href="#/"><i data-lucide="arrow-left"></i>Главная</a><div class="page-head"><h1>Учебный план</h1><button class="btn btn-primary" data-action="plan-add"><i data-lucide="plus"></i>Период</button></div>${periods.length?`<div class="panel plan-timeline reveal">${weeks}</div><p class="hint" style="margin-top:10px">Конференц-неделя — сдача задолженностей и экзаменов. Проектная — работа над проектами и защита. План не создаёт событий календаря.</p>`:`<div class="empty reveal"><i data-lucide="calendar-range"></i><p>Спланируйте семестр: модули, экзаменационные, конференц- и проектные недели.</p><button class="btn btn-primary" data-action="plan-add"><i data-lucide="plus"></i>Создать период</button></div>`}</div>`;
}
function openPlanModal(id){
  const p=id?state.plan.find(x=>x.id===id):null;
  const draft=p?Object.assign({},p):{id:null,type:'module',moduleId:state.modules[0]?state.modules[0].id:'',title:'',from:weekStart(today()),to:weekStart(today())};
  const pm=findM(draft.moduleId);
  openModal(`<div class="modal-head"><h3>${p?'Изменить период':'Новый период'}</h3><button class="icon-btn plain sm" data-action="modal-close"><i data-lucide="x"></i></button></div><div class="modal-body"><div class="form-stack"><div><label class="lbl">Тип периода</label>${selectBtnHtml('plan-type-btn','plan-type',PLAN_TYPES[draft.type].icon,PLAN_TYPES[draft.type].label)}</div><div id="plan-mod-wrap" ${draft.type!=='module'?'hidden':''}><label class="lbl">Модуль</label>${selectBtnHtml('plan-mod-btn','plan-module',pm?pm.icon:'book',pm?pm.name:'Выберите модуль')}<p class="hint" style="margin-top:6px">Название подставится автоматически.</p></div><div id="plan-title-wrap" ${draft.type==='module'?'hidden':''}><label class="lbl">Название</label><input class="field" data-plan="title" value="${esc(draft.title)}" placeholder="Например: Защита проектов"></div><div class="ics-dates"><div><label class="lbl">Начальная неделя · пн</label><button class="field ics-date-btn" data-action="plan-week" data-field="from"><i data-lucide="calendar"></i><span id="plan-from-lbl">${icsDateLabel(weekStart(draft.from))}</span><i data-lucide="chevron-down" class="chev"></i></button></div><div><label class="lbl">Конечная неделя · вс</label><button class="field ics-date-btn" data-action="plan-week" data-field="to"><i data-lucide="calendar"></i><span id="plan-to-lbl">${icsDateLabel(addD(weekStart(draft.to),6))}</span><i data-lucide="chevron-down" class="chev"></i></button></div></div><p class="hint">Начало — понедельник выбранной недели, конец — воскресенье.</p><div class="err-line" id="plan-err"></div></div></div><div class="modal-foot">${p?`<button class="btn btn-danger left" data-action="plan-del" data-id="${p.id}"><i data-lucide="trash-2"></i></button>`:''}<button class="btn btn-ghost" data-action="modal-close">Отмена</button><button class="btn btn-primary" data-action="plan-save"><i data-lucide="check"></i>Сохранить</button></div>`,{type:'plan',draft});
}
// #endregion

// #region Просроченные элементы
function overdueHtml(){
  const od=[];
  state.modules.forEach(m=>m.disciplines.forEach(d=>d.items.forEach(i=>{if(i.dueDate&&diffD(i.dueDate,today())<0&&!itemDone(i))od.push({i,d,m,days:-diffD(i.dueDate,today())})})));
  if(!od.length)return'';
  od.sort((a,b)=>b.days-a.days);
  return`<div class="overdue reveal${ui.overdueOpen?' open':''}"><div class="overdue-head"><span class="overdue-ic"><i data-lucide="alarm-clock"></i></span><b>Просроченные элементы — ${od.length}</b><button class="exp-btn" data-action="overdue-toggle"><i data-lucide="chevron-${ui.overdueOpen?'up':'down'}"></i>${ui.overdueOpen?'Свернуть':'Показать все'}</button></div>${ui.overdueOpen?`<div class="overdue-list">${od.map(x=>`<button class="overdue-row" data-action="journal-go" data-mid="${x.m.id}" data-did="${x.d.id}" data-iid="${x.i.id}"><span class="kind-chip ${x.i.type}">${x.i.type==='task'?'Задание':'Тема'}</span><span class="od-name">${esc(x.i.name)}</span><span class="od-sub hide-s">${esc(x.d.name)}</span><span class="od-days">${x.days} ${plural(x.days,['день','дня','дней'])}</span><i data-lucide="arrow-up-right"></i></button>`).join('')}</div>`:''}</div>`;
}
// #endregion

// #region Избранное: страница и карточки
function favoritesPage(){
  const list=state.favorites.map(f=>({f,t:favTarget(f.key)})).filter(x=>x.t);
  return`<div class="page"><a class="back-link" href="#/"><i data-lucide="arrow-left"></i>Главная</a><div class="page-head"><h1>Избранное</h1><span class="count-badge">${list.length}</span></div>${list.length?`<p class="hint fav-hint"><i data-lucide="move" style="width:13px;height:13px"></i>Перетаскивайте карточки за ручку — порядок сохраняется автоматически.</p><div class="fav-grid" id="fav-grid">${list.map(({f,t},i)=>favCardHtml(f,t,i)).join('')}</div>`:`<div class="empty reveal"><i data-lucide="star"></i><p>Отмечайте звёздочкой модули, дисциплины, темы, задания, проекты и события — они соберутся здесь.</p></div>`}</div>`;
}
function favCardHtml(f,t,i){
  const open=ui.favExpand.has(f.key),big=t.kind==='module'||t.kind==='disc',proj=t.kind==='project';
  const g=t.kind==='task'&&t.criteria&&t.criteria.length?calcGrade(t.criteria,t.scores):null;
  const icAttr=t.ci?'data-cicon':'data-lucide';
  const grip=`<button class="fav-grip" title="Перетащить, чтобы изменить порядок" aria-label="Переместить карточку"><i data-lucide="grip-vertical"></i></button>`;
  const go=t.kind==='event'?`<button class="btn btn-soft sm" data-action="fav-go-event" data-eid="${t.eid}"><i data-lucide="arrow-up-right"></i>Открыть</button>`:`<a class="btn btn-soft sm" href="${t.href}" ${t.scroll?`data-action="fav-go" data-scroll="${t.scroll}"`:''}><i data-lucide="arrow-up-right"></i>Открыть</a>`;
  const crit=(t.kind==='task'&&t.criteria&&t.criteria.length)?`<div class="crit-preview">${t.criteria.map(c=>`<span class="chip">${esc(c.text)||'Критерий'}${g?` · <b>${t.scores[c.id]}/5</b>`:''}</span>`).join('')}</div>`:'';
  const hasBody=t.desc||(t.links&&t.links.length)||crit;
  const exp=hasBody?`<button class="exp-btn${open?' on':''}" data-action="fav-expand" data-key="${f.key}"><i data-lucide="chevron-${open?'up':'down'}"></i>${open?'Свернуть':'Подробнее'}</button>`:'';
  const body=open?`<div class="fav-body">${t.desc?`<p>${esc(t.desc)}</p>`:''}${crit}${t.links&&t.links.length?`<div class="links-row">${t.links.map(l=>linkChip(l)).join('')}</div>`:''}</div>`:'';
  const delay=`--d:${Math.min(i,8)*50}ms`;
  if(big||proj){
    return`<article class="fav-card fav-big${proj?' fav-proj':''} pc-${t.color} reveal" style="${delay}" data-fkey="${f.key}">
<div class="fav-band">${grip}<span class="fav-ic"><i ${icAttr}="${t.icon}"></i></span><div style="flex:1;min-width:0"><b>${esc(t.title)}</b><span class="fav-sub">${esc(t.sub)}</span></div>${favBtn(f.key,'plain')}</div>
<div class="fav-inner">${proj?'<span class="fav-proj-flag"><i data-lucide="flag"></i>Проект</span>':''}${exp}${body}<div class="fav-foot">${go}</div></div>
</article>`;
  }
  const when=t.kind==='event'?`<div class="fav-when"><i data-lucide="calendar"></i>${dayLabel(t.date)} · ${t.allDay?'весь день':t.start+'–'+t.end}</div>`:'';
  return`<article class="fav-card pc-${t.color} reveal" style="${delay}" data-fkey="${f.key}">
<div class="fav-head">${grip}<span class="fav-ic"><i ${icAttr}="${t.icon}"></i></span><div style="flex:1;min-width:0"><b>${esc(t.title)}</b><span class="fav-sub">${esc(t.sub)}</span></div>${favBtn(f.key,'plain')}</div>
${when}${exp}${body}<div class="fav-foot">${go}</div>
</article>`;
}
// #endregion

// #region Избранное: произвольный порядок карточек
let favDrag=null,favSuppress=false;
function favCleanup(){
  if(!favDrag)return;
  clearTimeout(favDrag.arm);
  if(favDrag.ghost)favDrag.ghost.remove();
  if(favDrag.card)favDrag.card.classList.remove('fav-src');
  document.querySelectorAll('.fav-drop-before,.fav-drop-after').forEach(el=>el.classList.remove('fav-drop-before','fav-drop-after'));
  document.body.classList.remove('fav-dragging');
  favDrag=null;
}
function favActivate(){
  const d=favDrag;if(!d||d.active)return;
  d.active=true;favSuppress=true;
  document.body.classList.add('fav-dragging');
  try{d.grip.setPointerCapture(d.pid)}catch{}
  const r=d.card.getBoundingClientRect();
  const gh=d.card.cloneNode(true);
  gh.classList.add('fav-ghost');gh.classList.remove('reveal');
  gh.style.width=r.width+'px';gh.style.left=r.left+'px';gh.style.top=r.top+'px';
  document.body.appendChild(gh);
  d.ghost=gh;d.gw=r.width;d.gh=r.height;
  d.card.classList.add('fav-src');
  if(d.touch&&navigator.vibrate)try{navigator.vibrate(15)}catch{}
}
function favTargetIndex(x,y){
  const cards=[...document.querySelectorAll('#fav-grid .fav-card')].filter(c=>c!==favDrag.card);
  let idx=cards.length;
  for(let i=0;i<cards.length;i++){
    const r=cards[i].getBoundingClientRect();
    if(y<r.top){idx=i;break}
    if(y<=r.bottom&&x<r.left+r.width/2){idx=i;break}
  }
  return{cards,idx};
}
document.addEventListener('pointerdown',e=>{
  if(route().name!=='favorites'||favDrag)return;
  const grip=e.target.closest('.fav-grip');if(!grip)return;
  const card=grip.closest('.fav-card');if(!card||!card.dataset.fkey)return;
  favDrag={key:card.dataset.fkey,card,grip,pid:e.pointerId,x0:e.clientX,y0:e.clientY,touch:e.pointerType==='touch',active:false,ghost:null,idx:-1};
  if(favDrag.touch)favDrag.arm=setTimeout(()=>{if(favDrag&&!favDrag.active)favActivate()},260);
},true);
document.addEventListener('pointermove',e=>{
  const d=favDrag;if(!d||e.pointerId!==d.pid)return;
  if(!d.active){
    const dist=Math.hypot(e.clientX-d.x0,e.clientY-d.y0);
    if(dist>(d.touch?8:5))favActivate();else return;
  }
  e.preventDefault();
  d.ghost.style.left=(e.clientX-d.gw/2)+'px';
  d.ghost.style.top=(e.clientY-d.gh/2)+'px';
  const{cards,idx}=favTargetIndex(e.clientX,e.clientY);
  d.idx=idx;
  document.querySelectorAll('.fav-drop-before,.fav-drop-after').forEach(el=>el.classList.remove('fav-drop-before','fav-drop-after'));
  if(!cards.length)return;
  if(idx<cards.length)cards[idx].classList.add('fav-drop-before');
  else cards[cards.length-1].classList.add('fav-drop-after');
});
document.addEventListener('pointerup',e=>{
  const d=favDrag;if(!d||e.pointerId!==d.pid)return;
  if(!d.active){favCleanup();return}
  const key=d.key,idx=d.idx;
  favCleanup();
  setTimeout(()=>{favSuppress=false},350);
  if(idx<0)return;
  const moved=state.favorites.find(f=>f.key===key);if(!moved)return;
  const keys=state.favorites.map(f=>f.key).filter(k=>k!==key);
  keys.splice(Math.min(idx,keys.length),0,key);
  state.favorites.sort((a,b)=>keys.indexOf(a.key)-keys.indexOf(b.key));
  save();render();
  toast('Порядок избранного сохранён',{type:'success',duration:2200});
});
document.addEventListener('pointercancel',()=>favCleanup());
document.addEventListener('click',e=>{if(favSuppress){favSuppress=false;e.stopPropagation();e.preventDefault()}},true);
// #endregion

// #region Инициализация
async function init(){
  load();applyTheme();
  $('#file-import').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';importFile(f)});
  const remote=await GH.boot();
  if(remote){state=normalize(remote);try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
  applyTheme();
  addEventListener('hashchange',()=>{closeModal();render({top:true})});
  addEventListener('visibilitychange',()=>{if(document.hidden){if(GH.dirty)GH.pushNow()}else GH.pull()});
  addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{};if(GH.dirty)GH.pushNow()});
  render({top:true});
  startSessTicker();
  if(GH.dirty)GH.pushNow();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
// #endregion
</script>
