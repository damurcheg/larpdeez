.overdue-list{display:flex;flex-direction:column;gap:5px}
.overdue-row{display:flex;align-items:center;gap:10px;width:100%;padding:8px 10px;border-radius:11px;text-align:left;transition:.14s;border:1px solid transparent}
.overdue-row:hover{background:var(--surface);border-color:color-mix(in srgb,var(--danger) 30%,transparent)}
.od-name{flex:1;min-width:0;font-size:13.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.od-sub{font-size:11.5px;color:var(--muted);max-width:160px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.od-days{font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:var(--danger);background:var(--danger-bg);padding:4px 8px;border-radius:7px;white-space:nowrap}
.overdue-row>svg{width:14px;height:14px;color:var(--muted);flex:none}
@media(max-width:1080px){.b-profile,.b-level,.b-chart,.b-ach{grid-column:span 12}}
@media(max-width:760px){
.bento{gap:12px}
.sess-pill{padding:0 9px;height:36px}
.sess-pill b{font-size:12.5px}
.hero-cta{width:100%}
.hero-cta .btn-continue{flex:1;width:auto}
.btn-inbox{width:52px;border-radius:16px}
#sess-note{right:12px;left:12px}
.jr-scroll{max-height:none}
.fav-masonry{columns:2 150px;column-gap:10px}
.fav-card{padding:13px;margin-bottom:10px}
.inbox-acts{width:100%;justify-content:flex-end}
.inbox-acts .btn{flex:1}
.plan-week{flex-direction:column;gap:6px}
.pw-num{display:flex;gap:8px;align-items:baseline}
}
/* #region Редактор: сворачиваемые блоки и профиль-bento */
.ed-collapse{padding:0;overflow:hidden}
.ed-collapse-head{display:flex;align-items:center;gap:11px;width:100%;padding:16px 20px;text-align:left;transition:background .15s}
.ed-collapse-head:hover{background:var(--surface2)}
.ec-ic{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);display:flex;align-items:center;justify-content:center;flex:none}
.ec-ic svg{width:17px;height:17px}
.ed-collapse-head b{flex:1;min-width:0;font-size:15px}
.ec-hint{font-size:12px;font-weight:600;color:var(--muted);white-space:nowrap}
.ed-collapse-head>svg{width:16px;height:16px;color:var(--muted);flex:none}
.ed-collapse-body{padding:16px 20px 20px;border-top:1px dashed var(--border)}
.profile-bento{display:grid;grid-template-columns:158px minmax(0,1fr);gap:14px;align-items:start}
.pb-av{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 12px;border:1px solid var(--border);border-radius:var(--r-md);background:var(--surface2);text-align:center}
.pb-av .hint{font-size:10.5px;line-height:1.35}
.pb-fields{display:grid;grid-template-columns:1fr 1fr;gap:12px;align-content:start}
.pb-bio{grid-column:1/-1}
/* #endregion */
/* #region Кастомные селекты */
.ldz-select{display:flex;align-items:center;gap:8px;width:100%;text-align:left;cursor:pointer}
.ldz-select .lbl-txt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.ldz-select .chev{width:14px;height:14px;color:var(--muted);flex:none}
.sel-pop{width:280px}
.sel-pop .comp-pick{max-height:300px}
/* #endregion */
/* #region Избранное: мини-кнопки и выравнивание */
.it-col{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none}
.fav-btn.fav-mini{width:20px;height:20px;border-radius:6px;border-color:transparent;background:transparent;color:var(--muted);opacity:.5}
.fav-btn.fav-mini svg{width:12px;height:12px}
.fav-btn.fav-mini:hover{opacity:1;color:var(--warn);background:var(--warn-bg);transform:none}
.fav-btn.fav-mini.fav-on{opacity:1;color:var(--warn);background:transparent;border-color:transparent}
.icon-btn.fav-28{width:28px;height:28px;border-radius:8px}
.icon-btn.fav-28 svg{width:14px;height:14px}
.project-head .due-chip{height:28px}
/* #endregion */
/* #region Учебный план: строки и неделя в календаре */
.pw-link{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--pc-text);font-weight:600}
a.pw-link:hover{color:var(--pc-accent)}
.cal-plan-chip{height:28px;font-size:11.5px;flex:none;max-width:230px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
/* #endregion */
/* #region Просроченные: компактный блок */
.overdue.open .overdue-head{margin-bottom:10px}
/* #endregion */
/* #region График оценок */
.chart-svg{width:100%;height:230px;display:block;overflow:visible}
.chart-filters .ldz-select{flex:1;min-width:140px;height:36px;font-size:13px}
/* #endregion */
@media(max-width:760px){
.profile-bento{grid-template-columns:1fr}
.pb-fields{grid-template-columns:1fr}
.cal-plan-chip{max-width:150px}
.ed-collapse-head{padding:14px 16px}
.ed-collapse-body{padding:14px 16px 16px}
}
/* === LDZ UI v5: точечные улучшения === */
/* Симметрия иконок в чипах и тегах */
.chip:has(svg){padding:0 9px 0 6px}
.tag:has(svg){padding-left:8px}
/* Редактор курса: карточки модулей */
.mer-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:7px}
.mer-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;min-height:24px}
.mer-chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px 0 6px;border-radius:7px;background:var(--surface);border:1px solid var(--border);font-family:var(--font-mono);font-size:10.5px;font-weight:700;color:var(--ink2);line-height:1}
.mer-chip svg{width:12px;height:12px;color:var(--pc-accent,var(--accent))}
.mer-prog{display:inline-flex;align-items:center;gap:8px;flex:1;min-width:110px;max-width:200px}
.mer-prog .bar{flex:1;height:5px}
.mer-prog b{font-family:var(--font-mono);font-size:11px;font-weight:700;color:var(--ink2);min-width:34px;text-align:right}
.mer-done{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--success)}
.mer-done svg{width:14px;height:14px}
.mer-done .letter{height:22px;min-width:22px;font-size:11px;border-radius:7px}
.mer-done b{font-family:var(--font-mono);font-size:12.5px;color:var(--ink)}
.mer-acts{display:flex;align-items:center;gap:3px;flex:none}
/* Компетенции: две колонки */
.comp-ed-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.comp-ed-row .field.inline{min-width:0}
/* Кнопки аватара */
.pb-av .profile-av-btns{display:flex;flex-direction:column;gap:6px;width:100%}
.pb-av .profile-av-btns .btn{width:100%;height:32px;padding:0 10px;font-size:12.5px;border-radius:9px}
.pb-av .av-del{color:var(--danger)}
.pb-av .av-del:hover{background:var(--danger-bg)}
/* Паспорт: новая сетка блоков */
.b-ach{grid-column:span 12}
.b-duo{grid-column:span 12;display:grid;grid-template-columns:minmax(0,1.4fr) minmax(0,1fr);gap:16px;align-items:stretch}
.b-duo .b-chart,.b-duo .b-mods{grid-column:auto;min-width:0}
/* Меню: кликабельный профиль */
button.menu-profile{width:100%;text-align:left;border-radius:14px;padding:10px 12px;transition:.14s}
button.menu-profile:hover{background:var(--accent-soft)}
button.menu-profile:hover b{color:var(--accent)}
.menu-profile .mp-main{flex:1;min-width:0}
.menu-profile .mp-main b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-profile .mp-main span{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.menu-profile .mp-chev{margin-left:auto;display:flex;color:var(--muted)}
.menu-profile .mp-chev svg{width:15px;height:15px}
/* График динамики оценок */
.chart-frame{border:1px solid var(--border);border-radius:14px;background:linear-gradient(180deg,var(--surface2),var(--surface));padding:10px 6px 2px}
.chart-svg{width:100%;height:auto;display:block;overflow:visible}
.cg-grid line{stroke:var(--border);stroke-dasharray:2 5;opacity:.8}
.cg-grid line.cg-base{stroke:var(--border2);stroke-dasharray:none;opacity:1}
.cg-num{font-family:var(--font-mono);font-size:10px;fill:var(--muted)}
.cg-letter{font-family:var(--font-mono);font-size:9px;font-weight:700;fill:var(--muted);opacity:.7}
.cg-avg{stroke:color-mix(in srgb,var(--accent) 45%,transparent);stroke-width:1.2;stroke-dasharray:5 6}
.cg-avg-lbl{font-family:var(--font-mono);font-size:9.5px;font-weight:700;fill:var(--accent);opacity:.85}
.cg-line{fill:none;stroke:var(--accent);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.cg-date{font-family:var(--font-mono);font-size:9.5px;fill:var(--muted)}
.chart-pt{cursor:pointer}
.cd-hit{fill:transparent}
.cd-guide{stroke:var(--accent);stroke-dasharray:3 4;opacity:0;transition:opacity .15s}
.cd-halo{fill:color-mix(in srgb,var(--accent) 16%,transparent);opacity:0;transition:.15s;transform-box:fill-box;transform-origin:center}
.cd-core{fill:var(--surface);stroke:var(--accent);stroke-width:2;transition:transform .15s;transform-box:fill-box;transform-origin:center}
.chart-pt:hover .cd-guide{opacity:.5}
.chart-pt:hover .cd-halo{opacity:1}
.chart-pt:hover .cd-core{transform:scale(1.3)}
.chart-pt.last .cd-core{fill:var(--accent)}
.chart-pt.last .cd-halo{opacity:.6;animation:cdPulse 2.6s ease-in-out infinite}
@keyframes cdPulse{50%{transform:scale(1.5);opacity:.25}}
.chart-empty{border:1.5px dashed var(--border2);border-radius:14px;padding:26px 18px;text-align:center;color:var(--muted)}
.chart-empty svg{width:26px;height:26px;margin-bottom:8px;opacity:.6}
.chart-empty p{font-size:13.5px;font-weight:600;color:var(--ink2)}
.chart-empty span{font-size:12px}
/* Избранное: подсказка и drag-состояния */
.fav-hint{display:flex;align-items:center;gap:6px;margin-bottom:12px}
.fav-card.fav-src{opacity:.35}
.fav-card.fav-drop-before{box-shadow:-5px 0 0 0 var(--accent),var(--shadow)}
.fav-card.fav-drop-after{box-shadow:5px 0 0 0 var(--accent),var(--shadow)}
.fav-ghost{position:fixed;z-index:400;pointer-events:none;opacity:.96;transform:rotate(1.2deg);box-shadow:var(--shadow-lg);margin:0}
body.fav-dragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.fav-dragging .fav-card{transition:none}
/* Мобильная адаптация */
@media(max-width:760px){
.mer-prog{max-width:none}
.b-tiles{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.stat-tile{padding:13px 14px}
.stat-tile svg{width:16px;height:16px;margin-bottom:6px}
.stat-tile b{font-size:clamp(16px,4.8vw,20px);overflow-wrap:anywhere}
.stat-tile span{font-size:11px;line-height:1.35;display:block}
.b-duo{grid-template-columns:1fr;gap:12px}
.pb-av .profile-av-btns{flex-direction:row;max-width:340px;margin:0 auto}
.fav-grid{grid-template-columns:repeat(auto-fill,minmax(min(210px,100%),1fr));gap:10px}
.fav-grid .fav-card{margin-bottom:0}
.fav-grip{opacity:.8}
}
@media(max-width:640px){.comp-ed-grid{grid-template-columns:1fr}}
@media(max-width:340px){.b-tiles{grid-template-columns:1fr}.fav-grid{grid-template-columns:1fr}}
/* === LDZ: календарь без вложенной прокрутки, компетенции, план, журнал === */
.foot[hidden]{display:none}
/* Календарь: прокручивается страница, не контейнер */
.cal-wrap{overflow:visible}
.cal-scroll{overflow:visible;max-height:none}
.cal-toolbar{position:sticky;top:var(--header-total-h);z-index:30;background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);padding:10px 0;margin-bottom:10px}
.cal-grid{--cal-stick:calc(var(--header-total-h) + var(--cal-tb-h,56px));grid-template-columns:58px repeat(7,minmax(0,1fr));min-width:0}
.cal-corner{top:var(--cal-stick);border-top-left-radius:var(--r-lg)}
.cal-dayhead{top:var(--cal-stick)}
.cal-dayhead:nth-child(8){border-top-right-radius:var(--r-lg)}
.cal-ad-label,.cal-allday{top:calc(var(--cal-stick) + var(--cal-head-h))}
.cal-gutter{border-bottom-left-radius:var(--r-lg)}
.cal-col:last-child{border-bottom-right-radius:var(--r-lg)}
/* Мобильная закреплённая шапка календаря */
.cal-m-head{position:sticky;top:var(--header-total-h);z-index:40;margin:0 -14px;padding:0 14px 8px;background:color-mix(in srgb,var(--bg) 90%,transparent);backdrop-filter:blur(14px) saturate(1.3);-webkit-backdrop-filter:blur(14px) saturate(1.3);border-bottom:1px solid var(--border);box-shadow:0 12px 20px -16px rgba(0,0,0,.3)}
.cal-m-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:8px 0 2px}
.cal-month-btn{display:inline-flex;align-items:center;gap:7px;height:40px;padding:0 14px;border-radius:12px;border:1px solid var(--border);background:var(--surface);box-shadow:var(--shadow);font-family:var(--font-display);font-weight:700;font-size:15px;letter-spacing:-.01em;transition:.15s}
.cal-month-btn:hover{border-color:var(--accent);color:var(--accent)}
.cal-month-btn:active{transform:scale(.97)}
.cal-month-btn svg{width:15px;height:15px;color:var(--muted)}
.cal-m-acts{display:flex;gap:8px}
.cal-sq{width:40px;height:40px;border-radius:12px}
.cal-sq:active{transform:scale(.94)}
.cal-sq-primary{background:var(--primary-bg);border-color:transparent;color:var(--primary-fg)}
.cal-sq-primary:hover{color:var(--primary-fg);border-color:transparent;filter:brightness(1.07)}
.cal-m-plan{display:flex;align-items:center;gap:7px;margin-top:6px;padding:5px 10px;border-radius:9px;background:var(--pc-bg);border:1px solid var(--pc-border);color:var(--pc-text);font-size:11.5px;min-width:0}
.cal-m-plan svg{width:13px;height:13px;color:var(--pc-accent);flex:none}
.cal-m-plan b{font-family:var(--font-mono);font-size:10.5px;flex:none}
.cal-m-plan span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.cal-m-week{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:6px 0 2px}
.cal-m-week .cal-strip-day{width:auto;padding:5px 0 4px;border-radius:11px;gap:1px}
.cal-m-week .cal-strip-day .dn{font-size:15px}
.cal-m-week .cal-strip-day .wd{font-size:8.5px}
.cal-m-allday{display:flex;align-items:center;gap:8px;padding-top:6px}
.cal-m-ad{position:static;flex:1;flex-direction:row;align-items:center;gap:5px;min-height:32px;max-height:none;overflow-x:auto;overflow-y:hidden;border:1px solid var(--border);border-radius:10px;background:var(--surface2);padding:4px;box-shadow:none}
.cal-m-ad .cal-ad-item{width:auto;flex:none;max-width:200px;padding:5px 8px}
.cal-m-ad .cal-ad-proj{max-width:170px}
.cal-m-body{background:var(--surface);border:1px solid var(--border);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow);margin-top:10px}
.cal-m-hint{margin-top:10px}
/* Плавающая кнопка «Сегодня» */
.cal-today-fab{position:fixed;left:14px;bottom:calc(14px + var(--safe-bottom));z-index:90;display:inline-flex;align-items:center;gap:7px;height:42px;padding:0 16px;border-radius:14px;background:color-mix(in srgb,var(--surface) 88%,transparent);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--border2);box-shadow:var(--shadow-lg);font-weight:700;font-size:13px;color:var(--accent);transition:.18s}
.cal-today-fab svg{width:16px;height:16px}
.cal-today-fab:hover{transform:translateY(-2px);border-color:var(--accent)}
.cal-today-fab:active{transform:scale(.95)}
/* Кастомный выбор месяца и года */
.cal-month-pop{width:304px}
.cal-mp-year{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px;padding:0 2px}
.cal-mp-year b{font-family:var(--font-display);font-size:17px;font-weight:700}
.cal-mp-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.cal-mp-m{height:38px;border-radius:10px;border:1px solid var(--border);background:var(--surface2);font-size:12.5px;font-weight:600;color:var(--ink2);transition:.14s}
.cal-mp-m:hover{border-color:var(--accent);color:var(--accent);transform:translateY(-1px)}
.cal-mp-m.cur{border-color:color-mix(in srgb,var(--accent) 55%,transparent);color:var(--accent)}
.cal-mp-m.sel{background:var(--primary-bg);color:var(--primary-fg);border-color:transparent}
/* Компетенции: адаптивное раскрытие */
.comp-cut{display:none}
.comp-foot{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:12px}
.comp-foot[hidden]{display:none}
/* Журнал: обёртки названий */
.jr-disc b{flex:1;min-width:0;font-weight:600;overflow-wrap:anywhere}
.jr-mod-in b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
@media(max-width:760px){
.jr th{padding:8px 4px;font-size:9.5px;letter-spacing:.06em}
.jr-disc{gap:6px}
.jr-disc svg{width:13px;height:13px}
.jr-mod-in{font-size:11.5px;gap:7px}
.jr-mod-in svg{width:14px;height:14px}
.plan-week{padding:10px 12px;gap:8px}
.pw-bar{padding:9px 10px}
.pw-bar>i{margin-top:2px}
.pw-main{flex-direction:column;align-items:flex-start;gap:2px}
.pw-link{max-width:100%}
.pw-acts{align-self:center}
}

/* Паспорт: ID-карта */
.psh{padding:0;overflow:hidden;border-color:var(--border2)}
.psh-cover{height:86px;position:relative;background:linear-gradient(115deg,color-mix(in srgb,var(--primary-bg) 90%,#000) 0%,var(--primary-bg) 38%,color-mix(in srgb,var(--acid) 65%,var(--primary-bg)) 78%,var(--acid) 100%)}
.psh-cover::before{content:'';position:absolute;inset:0;background:radial-gradient(120% 160% at 85% -20%,rgba(255,255,255,.35),transparent 55%),repeating-linear-gradient(115deg,transparent 0 14px,rgba(255,255,255,.06) 14px 15px)}

[data-theme="dark"][data-ctx="lime"]{--accent:#C8DE8A;--accent-soft:#2A3115;--primary-bg:#A4C24A;--primary-fg:#141310}
[data-theme="dark"][data-ctx="indigo"]{--accent:#B3B3F2;--accent-soft:#23233C;--primary-bg:#8A8CE8;--primary-fg:#141310}
[data-theme="dark"][data-ctx="magenta"]{--accent:#EBA9E4;--accent-soft:#331F32;--primary-bg:#D573CA;--primary-fg:#141310}
/* Свотчи: адаптивная сетка на всю ширину контейнера */
.swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:6px;width:100%}
.swatch{width:100%;height:auto;aspect-ratio:1;border-radius:9px}
#evt-swatches{display:grid;grid-template-columns:repeat(auto-fill,minmax(26px,1fr));gap:6px;padding:2px}
#evt-swatches .swatch{width:100%;height:auto;aspect-ratio:1}
@media(max-width:760px){
.swatches,#evt-swatches{grid-template-columns:repeat(auto-fill,minmax(32px,1fr))}
}
/* === ПРАВКИ UX v2 (сгруппированный блок) === */
/* 1. Учебный план: вертикальные недели + пикер недель как модалка */
.wp-fields{grid-template-columns:1fr;gap:12px}
.wp-fields>div{width:100%;min-width:0}
.wp-fields .wp-btn{width:100%}
.popover.wp-pop{position:fixed;inset:0;left:0;top:0;right:0;bottom:0;width:auto;max-width:none;display:flex;align-items:center;justify-content:center;padding:calc(12px + var(--safe-top)) 12px calc(12px + var(--safe-bottom));background:color-mix(in srgb,var(--bg) 55%,rgba(10,10,5,.5));backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:none;box-shadow:none;transform:none;transition:opacity .18s}
.popover.wp-pop.open{transform:none}
.popover.wp-pop .wp-inner{width:min(360px,100%);background:var(--surface);border:1px solid var(--border2);border-radius:var(--r-xl);box-shadow:var(--shadow-lg);padding:14px;max-height:calc(var(--vvh,100dvh) - var(--safe-top) - var(--safe-bottom) - 24px);overflow:auto}

/* 2. Паспорт: профильный блок — ровное выравнивание + отступ GPA от полосы */
.psh-body{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:20px;align-items:start;padding:22px 22px 20px;position:relative}
.psh-id{display:flex;gap:16px;align-items:center;min-width:0;margin-top:-42px}
.psh-meta{min-width:0;padding-bottom:0}
.psh-gpa{align-self:start;margin:0}
.psh-foot{grid-column:1/-1;display:flex;align-items:center;gap:10px;flex-wrap:wrap;border-top:1px dashed var(--border);padding-top:16px;margin-top:4px}
@media(max-width:760px){
.psh-body{grid-template-columns:1fr;gap:14px;padding:18px 16px 16px}
.psh-id{margin-top:-34px}
.psh-gpa{align-items:flex-start;text-align:left}
.psh-foot .btn{flex:1}
.psh-code{display:none}
}

/* 3. Журнал оценок: фикс сжатия + дополнение до правого края пустыми ячейками */
.jr{width:100%;table-layout:fixed}
.jr col.col-name{width:180px}
.jr col.col-cell{width:46px}
.jr col.col-fill{width:auto}
.jr th.jr-fill,.jr td.jr-fill{padding:0;border-left:1px solid transparent;background:transparent;box-shadow:none}
.jr td.jr-fill{border-bottom:1px solid var(--border)}
.jr tbody tr:last-child td.jr-fill{border-bottom:none}
.jr th.jr-fill{border-bottom:1px solid var(--border);background:var(--surface2)}
@media(max-width:760px){
.jr col.col-name{width:132px}
.jr col.col-cell{width:38px}
}

/* 4. Входящие/Избранное: выравнивание счётчика с заголовком */
.page-head-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;min-width:0}
.page-head-title .count-badge{align-self:center}

/* 5. Шапка iOS: sticky + dvh + safe-area (модалки и попапы позиционируются от viewport, не от шапки) */
#topbar{position:-webkit-sticky;position:sticky;top:0;transform:translateZ(0)}
#app{padding-top:24px}
body{min-height:100dvh;overscroll-behavior-y:none}
@supports not (height:100dvh){body{min-height:100vh}}

/* 6. Модалки оценки: критерий отдельной строкой, кнопки 1–5 под ним на всю ширину */
@media(max-width:760px){
.grade-row{flex-direction:column;align-items:stretch;gap:8px}
.grade-row .g-name{width:100%}
.grade-row .seg-group{display:flex;gap:4px;width:100%}
.grade-row .seg{flex:1 1 0;width:auto;height:36px}
}

/* 8. Баннер главной: компактный индикатор дедлайна финального проекта */
.hero-cover{position:relative}
.hero-dline{position:absolute;left:18px;bottom:14px;display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 12px;border-radius:14px;background:color-mix(in srgb,var(--surface) 86%,transparent);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);color:var(--ink);font-family:var(--font-mono);font-size:12px;font-weight:700;letter-spacing:.04em;border:1px solid color-mix(in srgb,var(--surface) 50%,transparent);z-index:2;transition:.18s;line-height:1}
.hero-dline:hover{background:var(--surface);transform:translateY(-1px);border-color:var(--accent)}
.hero-dline .hd-d{color:var(--muted);font-size:10px;letter-spacing:.12em}
.hero-dline .hd-n{font-size:14px;color:var(--ink)}
.hero-dline.over .hd-n{color:var(--danger)}
.hero-dline.soon .hd-n{color:var(--warn)}
@media(max-width:760px){.hero-dline{left:12px;bottom:10px;height:24px;padding:0 10px;font-size:11px}.hero-dline .hd-n{font-size:12px}}

/* 9. Календарь: точки событий (до 3 + «+»), серия — подложка под число */
.mc-cell .mc-num{position:relative;z-index:1;display:flex;align-items:center;justify-content:center;width:100%;height:100%}
.mc-cell:not(.sel).series .mc-num{background:color-mix(in srgb,#F5C64A 32%,transparent);border-radius:7px;color:var(--ink)}
[data-theme="dark"] .mc-cell:not(.sel).series .mc-num{background:color-mix(in srgb,#7A5418 50%,transparent)}
.mc-dots{position:absolute;bottom:3px;left:50%;transform:translateX(-50%);display:flex;align-items:center;gap:2px;z-index:2;pointer-events:none}
.mc-ev{width:3px;height:3px;border-radius:50%;background:var(--course-accent,var(--accent))}
.mc-more{font-family:var(--font-mono);font-size:7px;font-weight:700;color:var(--course-accent,var(--accent));line-height:1}

/* 10/12. Плашки типа элемента — цвет соответствующей дисциплины, не курсовой акцент */
.kind-chip.task{background:var(--pc-bg);color:var(--pc-text);border:1px solid var(--pc-border)}
.kind-chip.event,.kind-chip.module,.kind-chip.disc,.kind-chip.section,.kind-chip.inbox,.kind-chip.inbox-section{background:var(--pc-bg,var(--bg2));color:var(--pc-text,var(--ink2));border:1px solid var(--pc-border,var(--border))}

/* 11. Редактор модуля: mobile — поле названия дисциплины под строкой с grip/icon/count */
.disc-acts{display:flex;align-items:center;gap:3px;flex:none}
@media(max-width:760px){
.sort-row.disc-ed-row{display:grid;grid-template-columns:auto auto minmax(0,1fr) auto;grid-template-areas:"grip icon count acts" "name name name name";row-gap:10px;column-gap:9px;padding:12px;align-items:center}
.sort-row.disc-ed-row>.grip{grid-area:grip}
.sort-row.disc-ed-row>.row-ic{grid-area:icon}
.sort-row.disc-ed-row>.disc-count{grid-area:count;justify-self:start}
.sort-row.disc-ed-row>.disc-name{grid-area:name;width:100%;min-width:0}
.sort-row.disc-ed-row>.disc-acts{grid-area:acts;justify-self:end}
}

/* 7. Модули на mobile: раскрытие активных/завершённых — кнопка использует .exp-btn */
.home-toggle-row{display:flex;justify-content:center;margin-top:14px}

function repairState(s){
const compIds=new Set(s.competencies.map(c=>c.id));
s.modules.forEach(m=>{
m.compTags=m.compTags.filter(id=>compIds.has(id));
m.project.compIds=m.project.compIds.filter(id=>compIds.has(id));
m.disciplines.forEach(d=>{
const ids=new Set(d.items.map(i=>i.id));
// дедуп разделов и чистка их содержимого
const seenSec=new Set();
d.sections=d.sections.filter(x=>!seenSec.has(x.id)&&seenSec.add(x.id));
const inSec=new Set();
d.sections.forEach(sec=>{sec.items=sec.items.filter(id=>ids.has(id)&&!inSec.has(id)&&inSec.add(id))});
// чистка layout
const seenLay=new Set();
d.layout=d.layout.filter(n=>{
const ok=n.kind==='section'?d.sections.some(x=>x.id===n.id):(ids.has(n.id)&&!inSec.has(n.id));
const key=n.kind+':'+n.id;
return ok&&!seenLay.has(key)&&seenLay.add(key);
});
// недостающие разделы и элементы — в конец, в порядке реестра
d.sections.forEach(sec=>{if(!d.layout.some(n=>n.kind==='section'&&n.id===sec.id))d.layout.push({kind:'section',id:sec.id})});
d.items.forEach(i=>{if(!inSec.has(i.id)&&!d.layout.some(n=>n.kind==='item'&&n.id===i.id))d.layout.push({kind:'item',id:i.id})});
// sectionId — производное поле
const owner={};d.sections.forEach(sec=>sec.items.forEach(id=>owner[id]=sec.id));
d.items.forEach(i=>{i.compIds=i.compIds.filter(id=>compIds.has(id));i.sectionId=owner[i.id]||null});
});});
s.favorites=s.favorites.filter(f=>favTarget(f.key,s));
const evIds=new Set(s.events.map(e=>e.id));
s.modules.forEach(m=>m.disciplines.forEach(d=>d.items.forEach(i=>{if(i.repeatEventId&&!evIds.has(i.repeatEventId))i.repeatEventId=null})));
}

// #region Оценивание
function letterOf(g){return g<2?'F':g<3?'D':g<4?'C':g<=4.5?'B':'A'}
function calcGrade(criteria,scores){
if(!criteria||!criteria.length)return null;
const sc=scores||{};
if(!criteria.every(c=>+sc[c.id]>=1&&+sc[c.id]<=5))return null;
const sum=criteria.reduce((a,c)=>a+ +sc[c.id],0);
const pct=sum/(criteria.length*5)*100;
const g=Math.round((1+pct/25)*10)/10;
return{pct:Math.round(pct),g,letter:letterOf(g)};
}
function moduleInfo(m){
const items=allItems(m);
const topics=items.filter(x=>x.i.type==='topic'),tasks=items.filter(x=>x.i.type==='task');
const tDone=topics.filter(x=>x.i.read).length;
const grades=tasks.map(x=>calcGrade(x.i.criteria,x.i.scores)).filter(Boolean);
const p=m.project,pg=p.enabled?calcGrade(p.criteria,p.scores):null;
const done=p.enabled?!!pg:(tasks.length?grades.length===tasks.length:(topics.length?tDone===topics.length:false));
const denom=topics.length||tasks.length;
const progress=denom?(topics.length?tDone:grades.length)/denom:(p.enabled&&pg?1:0);
let mg=null;
if(done){const arr=[...grades.map(g=>g.g),...(pg?[pg.g]:[])];if(arr.length)mg=Math.round(arr.reduce((a,b)=>a+b,0)/arr.length*10)/10}
return{topics,tasks,tDone,grades,pg,done,progress,mg,letter:mg?letterOf(mg):null};
}
function collectGrades(){
const out=[];
state.modules.forEach(m=>{
m.disciplines.forEach(d=>d.items.forEach(i=>{
if(i.type!=='task')return;
const g=calcGrade(i.criteria,i.scores);
if(g)out.push(g);
}));
if(m.project.enabled){
const pg=calcGrade(m.project.criteria,m.project.scores);
if(pg)out.push(pg);
}
});
return out;
}
function gpa(){
const gs=collectGrades();
if(!gs.length)return null;
const tenths=gs.reduce((a,x)=>a+Math.round(x.g*10),0);
return Math.round(tenths/gs.length)/10;
}
function itemDone(i){return i.type==='topic'?i.read:!!calcGrade(i.criteria,i.scores)}

function toast(msg,{type='info',action=null,duration=4200}={}){
const el=document.createElement('div');el.className=`toast t-${type}`;
const ic=type==='success'?'circle-check':type==='error'?'triangle-alert':'info';
el.innerHTML=`<i data-lucide="${ic}"></i><span>${esc(msg)}</span>${action?`<button class="toast-act">${esc(action.label)}</button>`:''}<button class="toast-x" aria-label="Закрыть"><i data-lucide="x"></i></button>`;
$('#toasts').appendChild(el);icons();
requestAnimationFrame(()=>el.classList.add('show'));
const kill=()=>{el.classList.remove('show');setTimeout(()=>el.remove(),260)};
const tm=setTimeout(kill,duration);
el.querySelector('.toast-x').onclick=()=>{clearTimeout(tm);kill()};
if(action)el.querySelector('.toast-act').onclick=()=>{clearTimeout(tm);kill();action.fn()};
}
function confetti(x=innerWidth/2,y=innerHeight*.3){
if(matchMedia('(prefers-reduced-motion: reduce)').matches)return;
const c=document.createElement('canvas');c.className='confetti';c.width=innerWidth;c.height=innerHeight;document.body.appendChild(c);
const ctx=c.getContext('2d');
const p=accentPal();
const cols=[p.a,'#E68150','#7C94E9','#DF77AC','#DBAF3D','#67B57B'];
const ps=Array.from({length:64},()=>({x,y,vx:(Math.random()-.5)*10,vy:-Math.random()*9-3,s:Math.random()*6+4,r:Math.random()*Math.PI,vr:(Math.random()-.5)*.3,c:cols[Math.random()*cols.length|0],l:70+Math.random()*30}));
let f=0;
(function tick(){ctx.clearRect(0,0,c.width,c.height);let alive=false;
for(const q of ps){if(q.l<=0)continue;alive=true;q.l--;q.x+=q.vx;q.y+=q.vy;q.vy+=.28;q.r+=q.vr;
ctx.save();ctx.translate(q.x,q.y);ctx.rotate(q.r);ctx.globalAlpha=Math.min(1,q.l/30);ctx.fillStyle=q.c;ctx.fillRect(-q.s/2,-q.s/2,q.s,q.s*.62);ctx.restore()}
if(alive&&f++<170)requestAnimationFrame(tick);else c.remove()})();
}

function weekLabel(anchor){
const a=fromISO(anchor),b=fromISO(addD(anchor,6));
if(a.getFullYear()!==b.getFullYear())return`${a.getDate()} ${MON_S[a.getMonth()]} ${a.getFullYear()} – ${b.getDate()} ${MON_S[b.getMonth()]} ${b.getFullYear()}`;
if(a.getMonth()!==b.getMonth())return`${a.getDate()} ${MON_S[a.getMonth()]} – ${b.getDate()} ${MON_S[b.getMonth()]} ${b.getFullYear()}`;
return`${a.getDate()} – ${b.getDate()} ${MONTHS_R[a.getMonth()]} ${a.getFullYear()}`;
}
function layoutDay(evts){
const sorted=[...evts].sort((a,b)=>a.start.localeCompare(b.start)||b.end.localeCompare(a.end));
const clusters=[];let cur=null,curEnd='';
for(const ev of sorted){
const end=ev.end==='24:00'?'23:59':ev.end;
if(!cur||ev.start>=curEnd){cur={items:[]};clusters.push(cur);curEnd=end}
else if(end>curEnd)curEnd=end;
cur.items.push(ev);
}
const pos=new Map();
for(const cl of clusters){
const cols=[];
for(const ev of cl.items){
const end=ev.end==='24:00'?'23:59':ev.end;
let ci=cols.findIndex(e=>e<=ev.start);
if(ci<0){ci=cols.length;cols.push(end)}else cols[ci]=end;
pos.set(ev.id,{col:ci});
}
cl.items.forEach(ev=>pos.get(ev.id).n=cols.length);
}
return pos;
}
function timedItems(){
const out=[];
state.modules.forEach(m=>m.disciplines.forEach(d=>d.items.forEach(i=>{
if(!i.dueDate||!i.dueTime)return;
const start=i.dueTime,end=i.dueTimeEnd||min2hm(Math.min(hm2min(start)+ITEM_CAL_DURATION,T_END_MAX));
out.push({id:`item-${i.id}`,itemId:i.id,mid:m.id,did:d.id,kind:'item',itemType:i.type,title:i.name,date:i.dueDate,start,end,color:d.color,done:itemDone(i)});
})));
return out;
}
function projectDues(){
const out=[];
state.modules.forEach(m=>{const p=m.project;if(p.enabled&&p.dueDate&&!calcGrade(p.criteria,p.scores))out.push({id:m.id,title:p.name,date:p.dueDate,color:m.color})});

let calPtr=null,calSuppressClick=false,calLastDragEnd=0;
const CAL_SNAP=15;
const calSnap=m=>Math.round(m/CAL_SNAP)*CAL_SNAP;
function calSlotAt(x,y){
for(const el of document.querySelectorAll('.cal-allday')){const r=el.getBoundingClientRect();if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom)return{date:el.dataset.adDate,allday:true}}

}
function calDurOf(ent){const t=calTimeOf(ent);if(!t.start)return ITEM_CAL_DURATION;const e=t.end==='24:00'?1440:hm2min(t.end);return clamp(e-hm2min(t.start),CAL_SNAP,DAY_END-DAY_START)}
function calBlockTouch(e){if(calPtr&&calPtr.active)e.preventDefault()}
function calCleanupPtr(){
if(!calPtr)return;
clearTimeout(calPtr.armTimer);

if(calPtr.ghost)calPtr.ghost.remove();
if(calPtr.hint)calPtr.hint.remove();

if(calPtr.src)calPtr.src.classList.remove('cal-src-dim','cal-resizing');

}
function calActivate(){
if(!calPtr||calPtr.active)return;

document.body.classList.add('cal-dragging');
if(calPtr.touch&&navigator.vibrate)try{navigator.vibrate(20)}catch{}

if(calPtr.mode==='move'){
const r=calPtr.src.getBoundingClientRect();
const g=calPtr.src.cloneNode(true);
g.classList.add('cal-ghost');g.classList.remove('cal-event','cal-ad-item');
g.style.width=Math.max(120,Math.min(r.width,220))+'px';

const h=document.createElement('div');h.className='cal-drop-hint pc-'+calPtr.color;h.innerHTML='<span></span>';h.style.display='none';document.body.appendChild(h);calPtr.hint=h;
}else if(calPtr.mode.startsWith('resize')){calPtr.src.classList.add('cal-resizing')}

function calAutoScroll(y){
const head=isMobileCal()?$('#cal-m-head'):$('#cal-toolbar');

document.addEventListener('pointerdown',e=>{
if(route().name!=='calendar'||calPtr)return;
if(e.button!==undefined&&e.button>0)return;
const rs=e.target.closest('.cal-rs');
const block=e.target.closest('[data-caldrag]');
const col=e.target.closest('.cal-col');
let mode=null;
if(rs&&block&&block.classList.contains('cal-event'))mode=rs.dataset.rs==='top'?'resize-top':'resize-bottom';
else if(block)mode='move';
else if(col&&!e.target.closest('.cal-event,.cal-ad-item'))mode='create';
if(!mode)return;
const touch=e.pointerType==='touch';
const ent=mode==='create'?null:calEntityGet(block.dataset);

calPtr={mode,touch,ent,src:block||null,col:col||(block?block.closest('.cal-col'):null),
x0:e.clientX,y0:e.clientY,pointerId:e.pointerId,active:false,moved:false,
dur:ent?calDurOf(ent):0,orig:ent?calTimeOf(ent):null,grabOff:0,
color:ent?(ent.type==='event'?ent.ev.color:ent.d.color):'blue',
anchorMin:null,cur:null,resCur:null,createCur:null};
if(mode==='create'&&col){const r=col.getBoundingClientRect();calPtr.anchorMin=clamp(calSnap(DAY_START+(e.clientY-r.top)/HOUR_H*60),DAY_START,DAY_END-CAL_SNAP)}
if(mode==='move'&&ent&&calPtr.orig.start&&block.classList.contains('cal-event')){
const r=block.closest('.cal-col').getBoundingClientRect();
calPtr.grabOff=clamp(DAY_START+(e.clientY-r.top)/HOUR_H*60-hm2min(calPtr.orig.start),0,calPtr.dur);
}
if(touch&&!mode.startsWith('resize'))calPtr.armTimer=setTimeout(()=>{if(calPtr&&!calPtr.moved)calActivate()},380);
},true);
document.addEventListener('pointermove',e=>{
if(!calPtr||e.pointerId!==calPtr.pointerId)return;
const p=calPtr,dx=e.clientX-p.x0,dy=e.clientY-p.y0;
if(!p.active){
const dist=Math.hypot(dx,dy);
if(p.touch&&!p.mode.startsWith('resize')){if(dist>10){p.moved=true;calCleanupPtr()}return}
if(dist>(p.touch?2:4))calActivate();else return;
}
e.preventDefault();
calAutoScroll(e.clientY);
if(p.mode==='move'){
const g=p.ghost;
g.style.left=(e.clientX-g.offsetWidth/2)+'px';
g.style.top=(e.clientY-16)+'px';
const slot=calSlotAt(e.clientX,e.clientY);
p.cur=slot;
document.querySelectorAll('.drop-on').forEach(el=>el.classList.remove('drop-on'));
const h=p.hint;
if(slot&&slot.col){
if(h.parentNode!==slot.col)slot.col.appendChild(h);
h.style.display='';
const start=calSnap(clamp(slot.min-p.grabOff,DAY_START,DAY_END-p.dur));
const end=Math.min(start+p.dur,DAY_END);
h.style.top=((start-DAY_START)/60*HOUR_H)+'px';
h.style.height=(p.dur/60*HOUR_H)+'px';
h.querySelector('span').textContent=min2hm(start)+'–'+min2hm(end);
}else{

}
}else if(p.mode.startsWith('resize')){
const col=p.src.closest('.cal-col');if(!col)return;
const r=col.getBoundingClientRect();
const min=clamp(calSnap(DAY_START+(e.clientY-r.top)/HOUR_H*60),DAY_START,DAY_END);
const o=p.orig;let s=hm2min(o.start),en=Math.min(o.end==='24:00'?1440:hm2min(o.end),DAY_END);

p.resCur={start:s,end:en};
p.src.style.top=((s-DAY_START)/60*HOUR_H)+'px';
p.src.style.height=Math.max(24,(en-s)/60*HOUR_H-2)+'px';
const tl=p.src.querySelector('.ev-time');if(tl)tl.textContent=min2hm(s)+'–'+min2hm(en);
}else if(p.mode==='create'){
const r=p.col.getBoundingClientRect();
const min=clamp(calSnap(DAY_START+(e.clientY-r.top)/HOUR_H*60),DAY_START,DAY_END);
let a=Math.min(p.anchorMin,min),b=Math.max(p.anchorMin,min);
if(b-a<CAL_SNAP)b=a+CAL_SNAP;
b=Math.min(b,DAY_END);
p.createCur={start:a,end:b};
p.selEl.style.top=((a-DAY_START)/60*HOUR_H)+'px';
p.selEl.style.height=((b-a)/60*HOUR_H)+'px';
p.selEl.querySelector('span').textContent=min2hm(a)+'–'+min2hm(b);
}
});
document.addEventListener('pointerup',e=>{
if(!calPtr||e.pointerId!==calPtr.pointerId)return;
const p=calPtr;
if(!p.active){calCleanupPtr();return}
calSuppressClick=true;setTimeout(()=>{calSuppressClick=false},400);

const slot=p.cur;

const end=Math.min(start+p.dur,DAY_END),date=slot.date;

}
}else if(p.mode.startsWith('resize')){
const c=p.resCur;
if(c){const ent=p.ent,date=calTimeOf(ent).date;mutate(()=>calTimeSet(ent,date,min2hm(c.start),min2hm(c.end)),'Длительность обновлена')}

// #region Экспорт в Apple Calendar (.ics)
function icsEscape(s){return String(s||'').replace(/\\/g,'\\\\').replace(/;/g,'\\;').replace(/,/g,'\\,').replace(/\r?\n/g,'\\n')}
// Перенос строк по стандарту iCalendar: не более 75 октетов, с учётом кириллицы
function icsFold(line){
const enc=new TextEncoder(),out=[];let cur='',bytes=0;
for(const ch of String(line)){
const b=enc.encode(ch).length;
if(bytes+b>74){out.push(cur);cur=' '+ch;bytes=1+b}
else{cur+=ch;bytes+=b}
}
out.push(cur);return out.join('\r\n');
}
// Локальное время события переводим в UTC — Apple Calendar показывает его в часовом поясе пользователя
function icsUtc(date,time){
const[y,m,d]=date.split('-').map(Number),[hh,mm]=time.split(':').map(Number);
return new Date(y,m-1,d,hh,mm).toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
}
function icsCandidates(){
const c=modalCtx&&modalCtx.type==='ics'?modalCtx.draft:{useRange:false,from:today(),to:null};
const from=c.useRange?c.from:today(),to=c.useRange?c.to:null;
const inRange=ds=>diffD(ds,from)>=0&&(!to||diffD(ds,to)<=0);
const out=[];
state.events.filter(e=>inRange(e.date)).forEach(e=>out.push({id:'ev-'+e.id,kind:'event',title:e.title,description:e.description,date:e.date,start:e.allDay?null:e.start,end:e.allDay?null:e.end,allDay:e.allDay,color:e.color}));
state.modules.forEach(m=>m.disciplines.forEach(d=>d.items.forEach(i=>{
if(!i.dueDate||!i.dueTime||!inRange(i.dueDate))return;
const end=i.dueTimeEnd||min2hm(Math.min(hm2min(i.dueTime)+ITEM_CAL_DURATION,T_END_MAX));
const links=i.links.map(l=>`${l.label||hostOf(l.url)}: ${l.url}`).join('\n');
out.push({id:'it-'+i.id,kind:i.type,title:i.name,description:`${i.type==='task'?'Задание':'Тема'} · ${m.name} / ${d.name}\n${i.description}${links?'\nСсылки:\n'+links:''}`,date:i.dueDate,start:i.dueTime,end,color:d.color,allDay:false});
})));
out.sort((a,b)=>a.date<b.date?-1:a.date>b.date?1:String(a.start||'').localeCompare(String(b.start||'')));
return out;
}
function icsListHtml(){
const c=modalCtx.draft,list=icsCandidates();
if(!list.length)return'<div class="hint" style="padding:14px;text-align:center">В выбранном диапазоне нет элементов с датой.</div>';
return list.map(x=>{const on=!c.excluded.has(x.id);return`<label class="ics-row pc-${x.color}${on?' on':''}"><input class="ics-check-input" type="checkbox" data-ics-id="${x.id}" ${on?'checked':''}><span class="ics-check" aria-hidden="true"><i data-lucide="check"></i></span><span class="t"><b>${esc(x.title)}</b><span>${x.kind==='event'?'событие':x.kind==='task'?'задание':'тема'}</span></span><span class="when">${dayLabel(x.date)} · ${x.allDay?'весь день':x.start}</span></label>`}).join('');
}
function downloadIcs(){
const sel=icsSelected();
if(!sel.length){toast('Нет выбранных элементов для экспорта',{type:'error'});return}
const stamp=new Date().toISOString().replace(/[-:]/g,'').replace(/\.\d{3}/,'');
const lines=['BEGIN:VCALENDAR','VERSION:2.0','PRODID:-//larpdeez//study calendar//RU','CALSCALE:GREGORIAN','METHOD:PUBLISH','X-WR-CALNAME:larpdeez','X-WR-CALDESC:Учебные события, темы и задания из larpdeez'];
sel.forEach(x=>{
lines.push('BEGIN:VEVENT',`UID:${x.id}-${x.date.replace(/-/g,'')}@larpdeez.local`,`DTSTAMP:${stamp}`);
if(x.allDay)lines.push(`DTSTART;VALUE=DATE:${x.date.replace(/-/g,'')}`,`DTEND;VALUE=DATE:${addD(x.date,1).replace(/-/g,'')}`);
else lines.push(`DTSTART:${icsUtc(x.date,x.start)}`,`DTEND:${icsUtc(x.date,x.end)}`);
lines.push(`SUMMARY:${icsEscape(x.title)}`,`DESCRIPTION:${icsEscape(x.description)}`,`CATEGORIES:${icsEscape(x.kind==='event'?'Событие':x.kind==='task'?'Задание':'Тема')}`,'STATUS:CONFIRMED','TRANSP:OPAQUE','END:VEVENT');
});
lines.push('END:VCALENDAR');
const text=lines.map(icsFold).join('\r\n')+'\r\n';
try{
const blob=new Blob([text],{type:'text/calendar;charset=utf-8'});
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`larpdeez-${today()}.ics`;
document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),4000);
closeModal();toast(`Экспортировано ${sel.length} ${plural(sel.length,['элемент','элемента','элементов'])} в .ics`,{type:'success'});
}catch{toast('Не удалось создать файл .ics',{type:'error'})}
}
function icsSelected(){const c=modalCtx.draft;return icsCandidates().filter(x=>!c.excluded.has(x.id))}
function icsDateLabel(v){
if(!validISO(v))return'—';
const d=fromISO(v);
return`${pad(d.getDate())}.${pad(d.getMonth()+1)}.${d.getFullYear()}`;
}
function icsDatesHtml(){

async function importFile(file){
if(!file)return;
let parsed;
try{parsed=JSON.parse(await file.text())}
catch{toast('Файл повреждён: это не корректный JSON. Данные не изменены.',{type:'error',duration:6000});return}
const raw=parsed&&typeof parsed==='object'&&parsed.data?parsed.data:parsed;
if(!raw||typeof raw!=='object'||Array.isArray(raw)||(!Array.isArray(raw.modules)&&!raw.course)){
toast('Файл не похож на резервную копию larpdeez. Данные не изменены.',{type:'error',duration:6000});return;
}
let next;
try{next=normalize(raw)}catch{toast('Не удалось разобрать структуру файла. Данные не изменены.',{type:'error'});return}
openConfirm('Импортировать данные?',`В файле: ${next.modules.length} ${plural(next.modules.length,['модуль','модуля','модулей'])}, ${next.events.length} ${plural(next.events.length,['событие','события','событий'])}. Текущие данные будут заменены.`,()=>{
state=next;applyTheme();
if(!save()){toast('Данные импортированы, но не поместились в хранилище целиком.',{type:'error',duration:7000})}
ui.weekAnchor=null;location.hash='#/';render({top:true});
toast('Импорт завершён',{type:'success'});
},'Импортировать');
}

// #region Drag-and-drop сортировка
let dragCtx=null;
function clearDropMarks(){document.querySelectorAll('.drop-before').forEach(x=>x.classList.remove('drop-before'));document.querySelectorAll('.drop-end').forEach(x=>x.classList.remove('drop-end'))}
function sortArray(list,mid,did){
if(list==='modules')return state.modules;
if(list==='discs'){const m=findM(mid);return m?m.disciplines:null}
if(list==='items'){const d=findD(findM(mid),did);return d?d.items:null}
return null;
}
function applyOrder(list,mid,did,ids){const arr=sortArray(list,mid,did);if(!arr)return;arr.sort((a,b)=>ids.indexOf(a.id)-ids.indexOf(b.id));save();render()}
function dragAllowed(target){
if(!dragCtx)return false;
if(dragCtx.list==='modules'||dragCtx.list==='discs')return target.dataset.sortlist===dragCtx.list;
if(dragCtx.mid!==target.dataset.mid||dragCtx.did!==target.dataset.did)return false;
const tl=target.dataset.sortlist;
if(dragCtx.kind==='section')return tl==='layout';
return tl==='layout'||tl==='secitems';
}
function removeFromContainers(d,id,kind){
if(kind==='section'){d.layout=d.layout.filter(n=>!(n.kind==='section'&&n.id===id));return}
d.layout=d.layout.filter(n=>!(n.kind==='item'&&n.id===id));
d.sections.forEach(s=>s.items=s.items.filter(x=>x!==id));
}
function applyLayoutDrop(d,target,dragId,kind,beforeId){
removeFromContainers(d,dragId,kind);
if(target.dataset.sortlist==='secitems'){
const sec=d.sections.find(s=>s.id===target.dataset.sid);if(!sec)return;
const idx=beforeId?sec.items.indexOf(beforeId):sec.items.length;
sec.items.splice(idx<0?sec.items.length:idx,0,dragId);
}else{
const node={kind,id:dragId};
const idx=beforeId?d.layout.findIndex(n=>n.id===beforeId&&n.kind===(kind==='section'?'section':'item')):-1;
if(idx>=0)d.layout.splice(idx,0,node);else d.layout.push(node);
}
const owner={};d.sections.forEach(s=>s.items.forEach(id=>owner[id]=s.id));
d.items.forEach(i=>i.sectionId=owner[i.id]||null);
save();render();
}
document.addEventListener('dragstart',e=>{
const h=e.target.closest&&e.target.closest('[data-drag]');if(!h)return;
const listEl=h.closest('[data-sortlist]');if(!listEl)return;
dragCtx={id:h.dataset.drag,list:listEl.dataset.sortlist,kind:h.dataset.dragkind||'item',mid:listEl.dataset.mid,did:listEl.dataset.did};
try{e.dataTransfer.effectAllowed='move';e.dataTransfer.setData('text/plain',h.dataset.drag)}catch{}
const card=listEl.querySelector(`:scope > [data-drag="${h.dataset.drag}"]`);
if(card)requestAnimationFrame(()=>card.classList.add('dragging'));
});
document.addEventListener('dragover',e=>{
if(!dragCtx)return;
const list=e.target.closest&&e.target.closest('[data-sortlist]');
if(!list||!dragAllowed(list))return;
e.preventDefault();clearDropMarks();
const cards=[...list.querySelectorAll(':scope > [data-drag]')].filter(c=>c.dataset.drag!==dragCtx.id);
const after=cards.find(c=>{const r=c.getBoundingClientRect();return e.clientY<r.top+r.height/2});
if(after)after.classList.add('drop-before');else list.classList.add('drop-end');
});
document.addEventListener('drop',e=>{
if(!dragCtx)return;
const list=e.target.closest&&e.target.closest('[data-sortlist]');
if(!list||!dragAllowed(list)){clearDropMarks();return}
e.preventDefault();
const before=list.querySelector(':scope > .drop-before');
const mid=list.dataset.mid,did=list.dataset.did,l=list.dataset.sortlist,ctx=dragCtx;
clearDropMarks();dragCtx=null;
if(l==='modules'||l==='discs'||l==='items'){
const ids=[...list.querySelectorAll(':scope > [data-drag]')].map(c=>c.dataset.drag).filter(id=>id!==ctx.id);
if(before)ids.splice(ids.indexOf(before.dataset.drag),0,ctx.id);else ids.push(ctx.id);
applyOrder(l,mid,did,ids);
}else{
const d=findD(findM(mid),did);if(!d)return;
applyLayoutDrop(d,list,ctx.id,ctx.kind,before?before.dataset.drag:null);
}
});
document.addEventListener('dragend',()=>{clearDropMarks();document.querySelectorAll('.dragging').forEach(x=>x.classList.remove('dragging'));dragCtx=null});

// #region Привязка полей (автосохранение без перерендера)
function applyBind(path,val,el){
const p=path.split('.'),k=p.shift();
if(k==='course'){state.course[p[0]]=val}
else if(k==='profile'){state.profile[p[0]]=p[0]==='bio'?val.slice(0,200):val}
else if(k==='comp'){const c=state.competencies.find(x=>x.id===p[0]);if(c)c.name=val.slice(0,40)}
else if(k==='module'){const m=findM(p[0]);if(!m)return;m[p[1]]=p[1]==='description'?val.slice(0,200):val}
else if(k==='disc'){const d=findD(findM(p[0]),p[1]);if(d)d[p[2]]=val}
else if(k==='sec'){const d=findD(findM(p[0]),p[1]);const s=d&&d.sections.find(x=>x.id===p[2]);if(s)s.name=val}
else if(k==='item'){const i=findI(findD(findM(p[0]),p[1]),p[2]);if(i)i[p[3]]=p[3]==='repeatDays'?(+val>0?clamp(Math.round(+val),1,365):null):val}
else if(k==='link'||k==='ilink'){const i=findI(findD(findM(p[0]),p[1]),p[2]);const l=i&&i.links.find(x=>x.id===p[3]);if(l)l[p[4]]=val}
else if(k==='crit'){const i=findI(findD(findM(p[0]),p[1]),p[2]);const c=i&&i.criteria.find(x=>x.id===p[3]);if(c)c.text=val}
else if(k==='proj'){const m=findM(p[0]);if(m)m.project[p[1]]=val}
else if(k==='preq'||k==='pcrit'){const m=findM(p[0]);if(!m)return;const arr=k==='preq'?m.project.requirements:m.project.criteria;const it=arr.find(x=>x.id===p[1]);if(it)it.text=val}
else if(k==='pref'){const m=findM(p[0]);const r=m&&m.project.refs.find(x=>x.id===p[1]);if(r)r[p[2]]=val}
if(el&&el.dataset.counter){const c=$(el.dataset.counter);if(c)c.textContent=`${val.length} / ${el.maxLength>0?el.maxLength:'∞'}`}
}

const GH={cfgKey:'ldz-gh-config',cfg:null,owner:'',repo:'',path:'vault.json',token:'',dek:null,vault:null,sha:null,ready:false,dirty:false,updatedAt:0,iterations:210000,_t:null};
const ghEnc=new TextEncoder(),ghDec=new TextDecoder();
function ghB64(buf){const u=buf instanceof Uint8Array?buf:new Uint8Array(buf);let s='';for(let i=0;i<u.length;i+=32768)s+=String.fromCharCode.apply(null,u.subarray(i,i+32768));return btoa(s)}
function ghUnB64(str){const s=atob(String(str).replace(/\s/g,''));const u=new Uint8Array(s.length);for(let i=0;i<s.length;i++)u[i]=s.charCodeAt(i);return u}
function ghRecovery(){const h=[...crypto.getRandomValues(new Uint8Array(6))].map(b=>b.toString(16).padStart(2,'0')).join('').toUpperCase();return'LDZ-'+h.match(/.{4}/g).join('-')}
async function ghDerive(secret,salt){const km=await crypto.subtle.importKey('raw',ghEnc.encode(secret),'PBKDF2',false,['deriveKey']);return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:GH.iterations,hash:'SHA-256'},km,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function ghWrap(dek,secret){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),key=await ghDerive(secret,salt),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,dek);return{salt:ghB64(salt),iv:ghB64(iv),ct:ghB64(ct)}}
async function ghUnwrap(w,secret){const key=await ghDerive(secret,ghUnB64(w.salt));return new Uint8Array(await crypto.subtle.decrypt({name:'AES-GCM',iv:ghUnB64(w.iv)},key,ghUnB64(w.ct)))}
async function ghEncryptData(obj){const iv=crypto.getRandomValues(new Uint8Array(12)),key=await crypto.subtle.importKey('raw',GH.dek,{name:'AES-GCM'},false,['encrypt']),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,ghEnc.encode(JSON.stringify(obj)));return{iv:ghB64(iv),ct:ghB64(ct)}}
async function ghDecryptData(d){const key=await crypto.subtle.importKey('raw',GH.dek,{name:'AES-GCM'},false,['decrypt']);return JSON.parse(ghDec.decode(await crypto.subtle.decrypt({name:'AES-GCM',iv:ghUnB64(d.iv)},key,ghUnB64(d.ct))))}
function ghUrl(){return`https://api.github.com/repos/${GH.owner}/${GH.repo}/contents/${GH.path.split('/').map(encodeURIComponent).join('/')}`}
function ghHeaders(){return{Authorization:'Bearer '+GH.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'}}

function ghSetSync(s){const el=$('#cloud-status');if(el){el.dataset.state=s;el.textContent={ok:'Синхронизировано',save:'Сохранение…',err:'Ошибка GitHub',off:'Локальный режим'}[s]||s}}

GH.pushNow=async function(){if(!this.ready||!this.dek||!this.vault)return;ghSetSync('save');try{const v={...this.vault,data:await ghEncryptData(state),updatedAt:Date.now()};await ghWriteVault(v);this.vault=v;this.dirty=false;ghSetSync('ok')}catch(e){ghSetSync('err');toast('GitHub: '+(e.message||'ошибка сохранения'),{type:'error'})}}
GH.pull=async function(){if(!this.ready||!this.dek)return;try{const v=await ghReadVault();if(v&&v.updatedAt>this.updatedAt){const data=await ghDecryptData(v.data);this.vault=v;this.updatedAt=v.updatedAt;state=normalize(data);try{localStorage.setItem(KEY,JSON.stringify(state))}catch{};applyTheme();render();ghSetSync('ok')}}catch{ghSetSync('err')}}

async function ghFetch(url,opts={},ms=20000){
const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);
try{return await fetch(url,{...opts,signal:c.signal})}
catch(e){throw new Error(e.name==='AbortError'?'GitHub не ответил за 20 секунд. Проверь сеть или открой api.github.com через VPN.':'Нет связи с api.github.com: '+(e.message||'сеть'))}
finally{clearTimeout(t)}
}
async function ghReadVault(){
const r=await ghFetch(ghUrl(),{headers:ghHeaders(),cache:'no-store'});
if(r.status===404)return null;
if(r.status===401)throw new Error('Токен неверный или истёк.');
if(r.status===403)throw new Error('Нет доступа. Токен должен быть выдан для '+GH.owner+'/'+GH.repo+' с Contents: Read and write.');
if(!r.ok)throw new Error('GitHub вернул '+r.status);
const j=await r.json();GH.sha=j.sha;
const v=JSON.parse(ghDec.decode(ghUnB64(j.content)));
if(!v||v.app!=='larpdeez-vault')throw new Error('Файл '+GH.path+' не является сейфом larpdeez.');
return v;
}
async function ghWriteVault(v){
const content=ghB64(ghEnc.encode(JSON.stringify(v)));
const mk=sha=>({message:'larpdeez sync '+new Date().toISOString(),content,...(sha?{sha}:{})});
let r=await ghFetch(ghUrl(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(mk(GH.sha))});
if(r.status===409){await ghReadVault();r=await ghFetch(ghUrl(),{method:'PUT',headers:ghHeaders(),body:JSON.stringify(mk(GH.sha))})}
if(r.status===401||r.status===403)throw new Error('Нет прав на запись. В токене нужно Contents: Read and write для '+GH.owner+'/'+GH.repo+'.');
if(r.status===404)throw new Error('Репозиторий не найден. Проверь владельца и название репозитория.');
if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.message||'GitHub '+r.status)}
const j=await r.json();GH.sha=j.content.sha;GH.updatedAt=v.updatedAt;
}

const normSearch=s=>String(s||'').toLowerCase().replace(/ё/g,'е').replace(/[^a-zа-я0-9\s]/g,' ').replace(/\s+/g,' ').trim();
function prefixDist(a,b,max){
const la=a.length,lb=b.length;
if(la-lb>max)return max+1;
let prev=new Array(lb+1),cur=new Array(lb+1);
for(let j=0;j<=lb;j++)prev[j]=j;
for(let i=1;i<=la;i++){
cur[0]=i;let best=i;
for(let j=1;j<=lb;j++){
cur[j]=Math.min(prev[j]+1,cur[j-1]+1,prev[j-1]+(a[i-1]===b[j-1]?0:1));
if(cur[j]<best)best=cur[j];
}
if(best>max)return max+1;
const t=prev;prev=cur;cur=t;
}
return Math.min.apply(null,prev);
}
function bestPrefixDist(words,q){
if(q.length<3)return null;
const allow=q.length<=4?1:2;
let best=null;
for(const w of words){
if(w.length<3)continue;
const d=prefixDist(q,w,allow);
if(d>allow)continue;
if(d>=2&&w[0]!==q[0])continue;
if(best===null||d<best)best=d;
}
return best;
}
function scoreOne(e,p){
const t=normSearch(e.title),words=t.split(' ').filter(Boolean);
let s=0;
if(t===p)s=1200;
else if(t.startsWith(p))s=1000-Math.min(60,t.length-p.length);
else if(words.some(w=>w.startsWith(p)))s=900;
else if(t.includes(p))s=760;
else{const d=bestPrefixDist(words,p);if(d!==null)s=700-d*70}
if(!s){
const mod=normSearch(e.mod),disc=normSearch(e.disc);
if(mod.includes(p))s=380;
else if(disc.includes(p))s=360;
else if(normSearch(e.extra).includes(p))s=330;
else if(normSearch(e.desc).includes(p))s=300;
else{const d2=bestPrefixDist((mod+' '+disc).split(' ').filter(Boolean),p);if(d2!==null)s=280-d2*60}
}else{
if(normSearch(e.mod).includes(p))s+=50;
if(normSearch(e.disc).includes(p))s+=40;
}
return s;
}
function scoreEntry(e,nq){
const parts=nq.split(' ').filter(Boolean);
if(!parts.length)return 0;
let total=0;
for(const p of parts){const s=scoreOne(e,p);if(!s)return 0;total+=s}
return total;
}
function searchRun(q){

function smoothPath(p){
if(p.length<2)return'';
if(p.length===2)return`M${p[0].x},${p[0].y}L${p[1].x},${p[1].y}`;
let d=`M${p[0].x},${p[0].y}`;
for(let i=0;i<p.length-1;i++){
const p0=p[i-1]||p[i],p1=p[i],p2=p[i+1],p3=p[i+2]||p2;
const c1x=p1.x+(p2.x-p0.x)/6,c1y=p1.y+(p2.y-p0.y)/6,c2x=p2.x-(p3.x-p1.x)/6,c2y=p2.y-(p3.y-p1.y)/6;
d+=`C${c1x.toFixed(1)},${c1y.toFixed(1)} ${c2x.toFixed(1)},${c2y.toFixed(1)} ${p2.x},${p2.y}`;
}
return d;
}

${[1,2,3,4,5].map(v=>`<g class="cg-grid"><line x1="${PX}" x2="${W-PX}" y1="${y(v)}" y2="${y(v)}"${v===1?' class="cg-base"':''}/><text x="${PX-8}" y="${y(v)+3.5}" class="cg-num" text-anchor="end">${v}</text><text x="${W-PX+8}" y="${y(v)+3.5}" class="cg-letter">${letters[v]}</text></g>`).join('')}

function ensureInbox(){if(!Array.isArray(state.inboxSections))state.inboxSections=[];const ids=new Set(state.inboxSections.map(s=>s.id));state.inbox.forEach(x=>{if(!x.sectionId||!ids.has(x.sectionId))x.sectionId=null})}
function inboxMove(id,secId,beforeId){
ensureInbox();
const it=state.inbox.find(x=>x.id===id);if(!it)return;
it.sectionId=secId||null;
state.inbox=state.inbox.filter(x=>x.id!==id);
let ix=-1;
if(beforeId)ix=state.inbox.findIndex(x=>x.id===beforeId);
if(ix<0){let last=-1;state.inbox.forEach((x,i)=>{if((x.sectionId||null)===(secId||null))last=i});ix=last+1}
state.inbox.splice(ix,0,it);
save();render();
}

function inboxSectionTransfer(secId,mid,did){
const s=state.inboxSections.find(x=>x.id===secId),d=findD(findM(mid),did);if(!s||!d)return;
const items=state.inbox.filter(x=>x.sectionId===secId);
mutate(()=>{
const ns={id:uid(),name:s.name,items:[]};
items.forEach(x=>{
const ni=normItem({id:uid(),type:x.type,name:x.name,description:x.description,links:x.links.map(l=>({id:uid(),url:l.url,label:l.label})),criteria:(x.criteria||[]).map(c=>({id:uid(),text:c.text}))});
d.items.push(ni);ns.items.push(ni.id);
});
d.sections.push(ns);d.layout.push({kind:'section',id:ns.id});
state.inbox=state.inbox.filter(x=>x.sectionId!==secId);
state.inboxSections=state.inboxSections.filter(x=>x.id!==secId);
},`Раздел «${s.name}» перенесён в «${d.name}»`);
}

let favDrag=null,favSuppress=false;
function favCleanup(){
if(!favDrag)return;
clearTimeout(favDrag.arm);
if(favDrag.ghost)favDrag.ghost.remove();
if(favDrag.card)favDrag.card.classList.remove('fav-src');
document.querySelectorAll('.fav-drop-before,.fav-drop-after').forEach(el=>el.classList.remove('fav-drop-before','fav-drop-after'));
document.body.classList.remove('fav-dragging');
favDrag=null;
}
function favActivate(){
const d=favDrag;if(!d||d.active)return;
d.active=true;favSuppress=true;
document.body.classList.add('fav-dragging');
try{d.grip.setPointerCapture(d.pid)}catch{}
const r=d.card.getBoundingClientRect();
const gh=d.card.cloneNode(true);
gh.classList.add('fav-ghost');gh.classList.remove('reveal');
gh.style.width=r.width+'px';gh.style.left=r.left+'px';gh.style.top=r.top+'px';
document.body.appendChild(gh);
d.ghost=gh;d.gw=r.width;d.gh=r.height;
d.card.classList.add('fav-src');
if(d.touch&&navigator.vibrate)try{navigator.vibrate(15)}catch{}
}
function favTargetIndex(x,y){
const cards=[...document.querySelectorAll('#fav-grid .fav-card')].filter(c=>c!==favDrag.card);
let idx=cards.length;
for(let i=0;i<cards.length;i++){
const r=cards[i].getBoundingClientRect();
if(y<r.top){idx=i;break}
if(y<=r.bottom&&x<r.left+r.width/2){idx=i;break}
}
return{cards,idx};
}
document.addEventListener('pointerdown',e=>{
if(route().name!=='favorites'||favDrag)return;
const grip=e.target.closest('.fav-grip');if(!grip)return;
const card=grip.closest('.fav-card');if(!card||!card.dataset.fkey)return;
favDrag={key:card.dataset.fkey,card,grip,pid:e.pointerId,x0:e.clientX,y0:e.clientY,touch:e.pointerType==='touch',active:false,ghost:null,idx:-1};
if(favDrag.touch)favDrag.arm=setTimeout(()=>{if(favDrag&&!favDrag.active)favActivate()},260);
},true);
document.addEventListener('pointermove',e=>{
const d=favDrag;if(!d||e.pointerId!==d.pid)return;
if(!d.active){
const dist=Math.hypot(e.clientX-d.x0,e.clientY-d.y0);
if(dist>(d.touch?8:5))favActivate();else return;
}
e.preventDefault();
d.ghost.style.left=(e.clientX-d.gw/2)+'px';
d.ghost.style.top=(e.clientY-d.gh/2)+'px';
const{cards,idx}=favTargetIndex(e.clientX,e.clientY);
d.idx=idx;
document.querySelectorAll('.fav-drop-before,.fav-drop-after').forEach(el=>el.classList.remove('fav-drop-before','fav-drop-after'));
if(!cards.length)return;
if(idx<cards.length)cards[idx].classList.add('fav-drop-before');
else cards[cards.length-1].classList.add('fav-drop-after');
});
document.addEventListener('pointerup',e=>{
const d=favDrag;if(!d||e.pointerId!==d.pid)return;
if(!d.active){favCleanup();return}
const key=d.key,idx=d.idx;
favCleanup();
setTimeout(()=>{favSuppress=false},350);
if(idx<0)return;
const moved=state.favorites.find(f=>f.key===key);if(!moved)return;
const keys=state.favorites.map(f=>f.key).filter(k=>k!==key);
keys.splice(Math.min(idx,keys.length),0,key);
state.favorites.sort((a,b)=>keys.indexOf(a.key)-keys.indexOf(b.key));
save();render();
toast('Порядок избранного сохранён',{type:'success',duration:2200});
});
document.addEventListener('pointercancel',()=>favCleanup());
document.addEventListener('click',e=>{if(favSuppress){favSuppress=false;e.stopPropagation();e.preventDefault()}},true);

// #region Доработки: normalize-обёртка, обработчики, drag входящих, viewport
const ldzNormalizeBase=normalize;
normalize=function(r){
const s=ldzNormalizeBase(r);
const seen=new Set();
s.inboxSections=(r&&Array.isArray(r.inboxSections)?r.inboxSections:[]).map(x=>(x&&typeof x==='object'&&x.id&&!seen.has(String(x.id))&&seen.add(String(x.id)))?{id:String(x.id),name:str(x.name,'Раздел').slice(0,60)}:null).filter(Boolean);
const secIds=new Set(s.inboxSections.map(x=>x.id));
s.inbox.forEach(x=>{if(!x.sectionId||!secIds.has(x.sectionId))x.sectionId=null});
return s;
};

const mo=pop.meta.month;mo.m+=a==='wp-next'?1:-1;if(mo.m<0){mo.m=11;mo.y--}if(mo.m>11){mo.m=0;mo.y++}

break}
case 'inbsec-add':openInboxSectionModal();break;
case 'inbsec-edit':openInboxSectionModal(ds.id);break;
case 'inbsec-save':{

if(!v){const er=$('#inbsec-err');if(er){er.textContent='Введите название';er.classList.add('show')}break}
if(ds.id){const s=state.inboxSections.find(x=>x.id===ds.id);if(s)s.name=v}
else state.inboxSections.push({id:uid(),name:v});
save();closeModal();render();break}
case 'inbsec-del':{
const s=state.inboxSections.find(x=>x.id===ds.id);if(!s)break;
openConfirm('Удалить раздел?',`Раздел «${s.name}» будет удалён. Его элементы вернутся в общий список входящих.`,()=>{
mutate(()=>{state.inbox.forEach(x=>{if(x.sectionId===s.id)x.sectionId=null});state.inboxSections=state.inboxSections.filter(x=>x.id!==s.id)},'Раздел удалён')});break}
case 'inbsec-up':case 'inbsec-down':{
const i=state.inboxSections.findIndex(x=>x.id===ds.id),to=i+(a==='inbsec-down'?1:-1);
if(i<0||to<0||to>=state.inboxSections.length)break;

case 'inbsec-move':openInboxSectionMove(ds.id);break;

if(inbDrag.card)inbDrag.card.classList.remove('inb-src');
document.querySelectorAll('.inb-slot.hover').forEach(el=>el.classList.remove('hover'));
document.querySelectorAll('.inb-sec-head.drop-on').forEach(el=>el.classList.remove('drop-on'));
document.body.classList.remove('inb-dragging');
inbDrag=null;
}
function inbActivate(){
const d=inbDrag;if(!d||d.active)return;
d.active=true;document.body.classList.add('inb-dragging');
try{d.grip.setPointerCapture(d.pid)}catch{}
const r=d.card.getBoundingClientRect();
const g=d.card.cloneNode(true);g.classList.add('inb-ghost');g.style.width=Math.min(r.width,340)+'px';
document.body.appendChild(g);d.ghost=g;d.gw=Math.min(r.width,340);
d.card.classList.add('inb-src');
if(d.touch&&navigator.vibrate)try{navigator.vibrate(15)}catch{}
}
document.addEventListener('pointerdown',e=>{
if(route().name!=='inbox'||inbDrag)return;
const grip=e.target.closest('.inb-grip');if(!grip)return;
const card=grip.closest('.inbox-card');if(!card)return;
inbDrag={id:grip.dataset.inbid,card,grip,pid:e.pointerId,x0:e.clientX,y0:e.clientY,touch:e.pointerType==='touch',active:false,dest:null};
if(inbDrag.touch)inbDrag.arm=setTimeout(()=>{if(inbDrag&&!inbDrag.active)inbActivate()},260);
},true);
document.addEventListener('pointermove',e=>{
const d=inbDrag;if(!d||e.pointerId!==d.pid)return;
if(!d.active){
const dist=Math.hypot(e.clientX-d.x0,e.clientY-d.y0);
if(d.touch){if(dist>10)inbCleanup();return}
if(dist>5)inbActivate();else return;
}
e.preventDefault();
d.ghost.style.left=(e.clientX-d.gw/2)+'px';
d.ghost.style.top=(e.clientY-24)+'px';
if(e.clientY<90)scrollBy(0,-10);else if(e.clientY>innerHeight-70)scrollBy(0,10);
document.querySelectorAll('.inb-slot.hover').forEach(el=>el.classList.remove('hover'));
document.querySelectorAll('.inb-sec-head.drop-on').forEach(el=>el.classList.remove('drop-on'));
d.dest=null;
const els=document.elementsFromPoint(e.clientX,e.clientY);
const slot=els.find(el=>el.classList&&el.classList.contains('inb-slot'));
if(slot){slot.classList.add('hover');d.dest={sec:slot.dataset.inbsec||null,before:slot.dataset.inbbefore||null};return}
const head=els.find(el=>el.classList&&el.classList.contains('inb-sec-head'));
if(head){head.classList.add('drop-on');d.dest={sec:head.dataset.inbsec||null,before:null}}
});
document.addEventListener('pointerup',e=>{
const d=inbDrag;if(!d||e.pointerId!==d.pid)return;
const dest=d.active?d.dest:null,id=d.id;
inbCleanup();
if(dest)inboxMove(id,dest.sec,dest.before);
});
document.addEventListener('pointercancel',()=>inbCleanup());
// #endregion
// #region Инициализация
async function init(){
load();applyTheme();
$('#file-import').addEventListener('change',e=>{const f=e.target.files[0];e.target.value='';importFile(f)});
const remote=await GH.boot();
if(remote){state=normalize(remote);try{localStorage.setItem(KEY,JSON.stringify(state))}catch{}}
applyTheme();
addEventListener('hashchange',()=>{closeModal();render({top:true})});
addEventListener('visibilitychange',()=>{if(document.hidden){if(GH.dirty)GH.pushNow()}else GH.pull()});
addEventListener('beforeunload',()=>{try{localStorage.setItem(KEY,JSON.stringify(state))}catch{};if(GH.dirty)GH.pushNow()});
render({top:true});
startSessTicker();
if(GH.dirty)GH.pushNow();
}
if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',init);else init();
// #endregion
</script>
