<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Редактор курса — Larpdeez</title>
  <link rel="stylesheet" href="/css/tokens.css">
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <main class="editor-layout">
    <aside class="editor-tree-pane" id="tree-pane">
      <div class="editor-tree-head">
        <select class="input" id="course-switch" title="Сменить курс" style="padding:6px 10px;font-size:var(--fs-13)"></select>
        <div class="search-wrap">
          <span class="lead" id="tree-search-lead"></span>
          <input class="input search-input" id="tree-search" placeholder="Фильтр по дереву…" autocomplete="off">
        </div>
      </div>
      <div class="editor-tree-scroll" id="tree-scroll"></div>
    </aside>
    <section class="editor-workspace">
      <div class="editor-ws-inner" id="workspace">
        <div class="empty"><div class="big">⏳</div><p>Загрузка курса…</p></div>
      </div>
    </section>
  </main>

  <script src="/js/app.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/editor.js"></script>
</body>
</html>
